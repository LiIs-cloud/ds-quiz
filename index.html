组成的序列"},{"k":"C","t":"所有整数组成的序列"},{"k":"D","t":"邻接表"}],"correct":["B"],"exp":"解析：线性表定义的要求为：相同数据类型、有限序列。选项C的元素个数是无穷个，错误；选项 A 集合中的元素没有前后驱关系，错误；选项D属于一种存储结构，本题要求选出的是一个具体 的线性表，不要将二者混为一谈。只有选项B 符合线性表定义的要求。","kp":["线性表"]},{"id":"q028","ch":2,"type":"choice","text":"在线性表中，除开始元素外，每个元素（）","opts":[{"k":"A","t":"只有唯一的前驱元素"},{"k":"B","t":"只有唯一的后继元素"},{"k":"C","t":"有多个前驱元素"},{"k":"D","t":"有多个后继元素"}],"correct":["A"],"exp":"解析：线性表中，除最后一个（或第一个）元素外，每个元素都只有一个后继（或前驱）元素。","kp":["线性表"]},{"id":"q029","ch":2,"type":"choice","text":"S】 若非空线性表中的元素既没有直接前驱，又没有直接后继，则该表中有（）个元素。","opts":[{"k":"A","t":"1"},{"k":"B","t":"2"},{"k":"C","t":"3"},{"k":"D","t":"n"}],"correct":["A"],"exp":"解析：线性表中的第一个元素没有直接前驱，最后一个元素没有直接后继；当线性表中仅有一个元 素时，该元素既没有直接前驱，又没有直接后继。 2.2 线性表的顺序表示- 2.2.1 顺序表的定义 考点追踪 （算法题）顺序表的应用（2010、2011、2018、2020、2025） 线性表的顺序存储也称顺序表。它是用一组地址连续的存储单元依次存储线性表中的数据元 素，使得逻辑上相邻的元素在物理位置上也相邻。第1个元素存储在顺序表的起始位置，第i个 元素的存储位置之后紧接着存放的是第i+1个元素，称i为元素a，在顺序表中的位序。因此，顺 序表的特点是：表中元素的逻辑顺序与其物理存储顺序完全一致。 设顺序表工的起始存储地址为LOC （A），每个数据元素占用的存储空间大小为 sizeof（E1 emType），则顺序表的存储结构如图 2.1所示。 数组下标 顺序表 内存地址 0 4」 LOC （A） 1 42 LOC （A） +sizeof （ElemType） 1-1 LOC （A） + （i-1） xsizeof （ElemType） n-1 an LOC （A） +（n-1） xsizeof （ElemType） MaxSize-1| LOC （A） + （MaxSize-1） xsizeof （E1emType） 图2.1 线性表的顺序存储结构 由于任意数据元素的存储地址与顺序表起始地址之间的偏移量与其位序呈线性关系，因此可 在0（1）时间内直接访问表中任意位置的元素，这种特性使得线性表的顺序存储结构属于随机存取。 在高级程序设计语言中，通常使用数组来实现顺序表。 注意 线性表中元素的位序从1开始，而数组中元素的下标从0开始，注意二者之间的转换。 假定线性表的元素类型为 ElemType，则静态分配的顺序表存储结构描述为 #define MaxSize 50 //定义线性表的最大长度 typedef struct｛ ElemType data ［Maxsize］； /顺序表的元素 16 2027年数据结构考研复习指导 int length； 1顺序表的当前长度 ｝SqList； 1顺序表的类型定义 一维数组既可以静态分配，也可以动态分配。静态分配时，数组的大小和存储空间在编译时 已经固定，一旦空间占满，再插入新元素将导致溢出，进而可能引发程序异常。 动态分配时，存储数组的空间是在程序执行过程中通过动态存储分配语句申请的。当空间占 满时，可以另行开辟一块更大的存储空间，将原表中的所有元素复制到新空间中，从而实现存储 容量的扩充，而无须在初始化时为线性表一次性划分全部可能用到的空间。 动态分配的顺序表存储结构描述为 #define InitSize 100 //表长度的初始定义 typedef struct｛ ElemType *data； 1/指示动态分配数组的指针 int MaxSize,length； 1/数组的最大容量和当前个数 //动态分配数组顺序表的类型定义 ｝ SeqList； C 的初始动态分配语句 L.data= （ElemType*） malloc （sizeof （ElemType） *InitSize）； C++的初始动态分配语句为 L.data=new ElemType ［InitSize］： 注意 动态分配并不是链式存储，它同样属于顺序存储结构。其物理结构没有变化，依然支持随机存取， 只是存储空间的大小可以在运行时动态调整。 顺序表的主要优点：① 可进行随机访问，即通过首地址和元素序号可在 O（1）时间内找到 指定的元素；② 存储密度高，每个结点仅存储数据元素，无额外指针开销。顺序表的缺点也很 明显：① 插入和删除操作效率较低，需要移动大量元素；② 要求分配连续的存储空间，不够 灵活。 2.2.2 顺序表上基本操作的实现 点追踪 顺序表上操作的时间复杂度分析（2023） 本节仅讨论顺序表的初始化、插入、删除和按值查找，其他基本操作的实现都较为简单。 注意 在各种操作的实现中（包括严蔚敏老师的教材），通常可以忽略边界条件判断、变量定义，内存分 配失败等实现细节，即不要求代码具有实际可执行性，而应重点体现算法的核心思想与逻辑步骤。 1. 顺序表的初始化 静态分配和动态分配的顺序表在初始化时有所不同。静态分配：在声明顺序表时，数组空间 已由编译器分配，因此初始化只需将当前长度置为0。 //SqList L； //声明一个顺序表 void InitList （SqList &L） ｛ L.length=0； //顺序表初始长度为0 ｝ 动态分配：需在运行时为顺序表分配初始大小的数组空间，并设置长度和容量。 void InitList （SeqList &L）｛ L.data= （ElemType *） malloc（Initsize *sizeof （ElemType））；//分配存储空间 第2章线性表 17 L.length=0； 1顺序表初始长度为0 1/初始存储容量 L.MaxSize=InitSize； 其中，MaxSize 表示当前分配的存储空间上限。当插入元素导致空间不足时，需要扩容。 2. 插入操作 在顺序表工的第i（1≤i≤L.length+1）个位置插入新元素 e。若主超出合法范围，或存 储空间己满，则插入失败，返回 Ealse；否则，将第主个元素及其后的所有元素依次后移一位， 腾出一个空位置插入e，表长加1，返回true。 bool ListInsert （SqList &L,int i,ElemType e） ｛ i£ （1<111i>L.length+1） 1/判断立的范围是否有效 return false； if （L.length>=MaxSize） //当前存储空间已满 return false； Eor （int j=L.length;j>=i;j--） 1/将第主个元素及之后的元素后移 L.data lj］=L.data ［j-1］； L.data ［i-1］=e； //在位置主插入e（注意下标转换） //表长加 1 L.length++i return truei 注意 区分位序（从1开始）与数组下标（从0开始）。为什么判断插入位置时使用 length+1，而移动元素 的EOr循环中使用 length？因为合法插入位置包括第n+1位，但移动元素时最多从第n位开始后移。 最好情况：在表尾插入（i=n+1），无须移动元素，时间复杂度为 O（1）。 最坏情况：在表头插入（i=1），需移动全部n个元素，时间复杂度为 O（n）。 平均情况：设在第i个位置插入的概率为p，=1/（n+1），则平均移动次数为 n+1 2 因此，插入操作的平均时间复杂度为 O（n）。 3. 删除操作 删除顺序表L中第i（1≤i≤L.length）个位置的元素，并通过引用参数e返回其值。若立 非法，返回false；否则，保存被删元素，将其后所有元素前移一位，表长减1，返回true。 bool ListDelete（SqList &L,int i,ElemType &e） ｛ if （i<111i>L.length） //判断主的范围是否有效 return false； e=L.data［i-1］； //将被删除的元素赋给 e for（int j=iij<L.length:j++）| 1/将第主个位置后的元素前移 L.data lj-1］=L.dataljl； 1/表长減 1 L.length--； return true： ｝ 最好情况：删除表尾元素（i=n），无须移动元素，时间复杂度 O（1）。 最坏情况：删除表头元素（i=1），需移动其余n-1个元素，时间复杂度O（n）。 平均情况：设删除第i个元素的概率为p；=1/n，则平均移动次数 i=1 n 2 2","kp":["顺序表","复杂度分析"]},{"id":"q030","ch":2,"type":"choice","text":"下列叙述中，（）是顺序存储结构的优点。","opts":[{"k":"A","t":"存储密度大"},{"k":"B","t":"插入运算方便"},{"k":"C","t":"删除运算方便"},{"k":"D","t":"方便地运用于各种逻辑结构的存储表示"}],"correct":["A"],"exp":"解析：顺序表不像链表那样要在结点中存放指针域，因此存储密度大，选项 A 正确。选项B 和C 是链表的优点。选项D是错误的，比如对于树形结构，顺序表显然不如链表表示起来方便。","kp":["链表"]},{"id":"q031","ch":2,"type":"choice","text":"下列关于顺序表的叙述中，正确的是（）","opts":[{"k":"A","t":"顺序表可以利用一维数组表示，因此顺序表与一维数组在逻辑结构上是相同的"},{"k":"B","t":"在顺序表中，逻辑上相邻的元素物理位置上不一定相邻"},{"k":"C","t":"顺序表和一维数组一样，都可以进行随机存取"},{"k":"D","t":"在顺序表中，每个元素的类型不必相同"}],"correct":["C"],"exp":"解析：顺序表是顺序存储的线性表，表中所有元素的类型必须相同，且必须连续存放。一维数组中 的元素可以不连续存放；此外，栈、队列和树等逻辑结构也可利用一维数组表示，但它与顺序表 不属于相同的逻辑结构。在顺序表中，逻辑上相邻的元素物理位置上也相邻。","kp":["队列"]},{"id":"q032","ch":2,"type":"choice","text":"通常说顺序表具有随机存取的特性，指的是（）","opts":[{"k":"A","t":"查找值为×的元素的时间与顺序表中元素个数n无关"},{"k":"B","t":"查找值为x的元素的时间与顺序表中元素个数n有关"},{"k":"C","t":"查找序号为i的元素的时间与顺序表中元素个数n无关"},{"k":"D","t":"查找序号为i的元素的时间与顺序表中元素个数n有关"}],"correct":["C"],"exp":"解析：随机存取是指在 O（1）的时间访问下标为i的元素，所需时间与顺序表中的元素个数n无关。","kp":["顺序表"]},{"id":"q033","ch":2,"type":"choice","text":"一个顺序表所占用的存储空间大小与（）无关。","opts":[{"k":"A","t":"表的长度"},{"k":"B","t":"元素的存放顺序"},{"k":"C","t":"元素的类型"},{"k":"D","t":"元素中各字段的类型"}],"correct":["B"],"exp":"解析：顺序表所占的存储空间 = 表长xsizeof（元素的类型），表长和元素的类型显然会影响存储 空间的大小。若元素为结构体类型，则元素中各字段的类型也会影响存储空间的大小。 22 2027年数据结构考研复习指导","kp":["顺序表"]},{"id":"q034","ch":2,"type":"choice","text":"若线性表最常用的操作是存取第i个元素及其前驱和后继元素的值，为了提高效率，应采 用（）的存储方式。","opts":[{"k":"A","t":"单链表"},{"k":"B","t":"双向链表"},{"k":"C","t":"循环单链表"},{"k":"D","t":"顺序表"}],"correct":["D"],"exp":"解析：题干实际要求能最快存取第i-1、i和i+1个元素值。选项A、B、C 都只能从头结点依次顺 序查找，时间复杂度为 O（n）；只有顺序表可以按序号随机存取，时间复杂度为 O（1）。","kp":["双向链表","复杂度分析"]},{"id":"q035","ch":2,"type":"choice","text":"一个线性表最常用的操作是存取任意一个指定序号的元素并在最后进行插入、删除操作，则利 用（）存储方式可以节省时间。","opts":[{"k":"A","t":"顺序表"},{"k":"B","t":"双链表"},{"k":"C","t":"带头结点的循环双链表"},{"k":"D","t":"循环单链表"}],"correct":["A"],"exp":"解析：只有顺序表可以按序号随机存取，且在最后进行插入和删除操作时不需要移动任何元素。","kp":["双向链表"]},{"id":"q036","ch":2,"type":"subj","text":"【综合应用题】从顺序表中删除具有最小值的元素（假设唯一）并由函数返回被删元素的值。空出的位 置由最后一个元素填补，若顺序表为空，则显示出错信息并退出运行。","answer":"算法思想：搜索整个顺序表，查找最小值元素并记住其位置，搜索结束后用最后一个元素填 补空出的原最小值元素的位置。 本题代码如下： bool Del Min （SqList &L,ElemType &value） ｛ //删除顺序表工 中最小值元素结点，并通过引用型参数 value 返回其值 1/若删除成功，则返回true；否则返回 false i£（L.length==0） //表空，中止操作返回 false； return value=L.data ［0］； //假定0号元素的值量小 int pos=0； //循环，寻找具有最小值的元素 for （int i=1;i<L.length;i++） //让 value 记忆当前具有最小值的元素 if （L.data ［i］<value）｛ value=L.data［il； pos=1； ｝ //空出的位置由最后一个元素填补 L.datalposl=L.data［L.length-1］； L.length--； 1此时，value 为最小值 return truei ｝ 注意 本题也可用函数返回值返回，两者的区别是：函数返回值只能返回一个值，而参数返回（引用传参） 可以返回多个值。","kp":["顺序表"]},{"id":"q037","ch":2,"type":"subj","text":"【综合应用题】设计一个高效算法，将顺序表L的所有元素逆置，要求算法的空间复杂度为 O（1）。","answer":"算法思想：扫描顺序表L的前半部分元素，对于元素 L.data ［i］（0<=i<L.length/2）， 将其与后半部分的对应元素L.data［L.length-i-1］进行交换。 本题代码如下： void Reverse （SqList &L）｛ //辅助变量 ElemType temp； for（int i=0;i<L.length/2;i++）｛ //交换L.data［i］与L.data［L.length-i-1］ temp=L.data［il； L.datalil=L.data［L.length-i-1］； L.data ［L. length-1-1］=temp；","kp":["顺序表","复杂度分析"]},{"id":"q038","ch":2,"type":"subj","text":"【综合应用题】对长度为n的顺序表L，编写一个时间复杂度为O（n）、空间复杂度力 O（1）的算法，该算 法删除顺序表中所有值力x的数据元素。","answer":"解法1：用k记录顺序表L中不等于x的元素个数（需要保存的元素个数），扫描时将不等 于x的元素移动到下标k的位置，并更新k值。扫描结束后修改L的长度。 本题代码如下： void del_x_1 （SqList &L,Elemrype x） ｛ 1/本算法实现删除顺序表工 中所有值×的数据元素 //记录值不等于×的元素个数 int k=0,ii for（i=0;i<L.length;i++） if （L.data［i］！=x）｛ L.data［k］=L.datalil； //等于×的元素增1 k++； 1顺序表工 的长度等于k L. length=k； 解法2：用k记录顺序表L中等于×的元素个数，一边扫描L，一边统计k，并将不等于x的 元素前移k个位置。扫描结束后修改L的长度。 本题代码如下： void del_x_2 （SqList &L,ElemType x） ｛ //k 记录值等于x的元素个数 int k=0,1=0； while （i<L.length）｛ if （L.data［i］==x） else L.datali-k］=L.data［i］；1/当前元素前移k个位置 i++； /顺序表工的长度递减 L.length=L.length-ki 此外，本题还可以考虑设头、尾两个指针（i=1,/=n），从两端向中间移动，在遇到最左端 2027年数据结构考研复习指导 值x的元素时，直接将最右端值非x的元素左移至值为×的数据元素位置，直到两指针相遇。但 这种方法会改变原表中元素的相对位置。","kp":["顺序表","复杂度分析"]},{"id":"q039","ch":2,"type":"subj","text":"【综合应用题】从顺序表中删除其值在给定值s和1之间（包含s和1，要求s<t）的所有元素，若了或 t不合理或顺序表为空，则显示出错信息并退出运行。","answer":"算法思想：从前向后扫描顺序表L，用k记录值在s和t之间的元素个数（初始时K=0）。 对于当前扫描的元素，若其值不在s和t之间，则前移k个位置；否则执行 kt+。每个不在s和 之间的元素仅移动一次，因此算法效率高。 本题代码如下： bool Del_s_t （SqList &L, ElemType s, ElemType t） ｛ 1/删除顺序表L中值在给定值s和t（要求s<t）之间的所有元素 int i,k=0； if （L.length==01Is>=t） 1/线性表为空或s、t不合法，返回 return false； for （1=0;i<L.length;i++）｛ if （L.data［i］>=s&&L.data ［i］<=t） k++； else L.datali-k］=L.data ［i］；1/当前元素前移k个位置 ｝I/Eor 1/长度减小 L.length-=k； return ue： ｝ 注意 本题也可从后向前扫描顺序表，每遇到一个值在s和1之间的元素，就删除该元素，其后的所有元素 全部前移。但移动次数远大于前者，效率不够高。","kp":["顺序表"]},{"id":"q040","ch":2,"type":"subj","text":"【综合应用题】从有序顺序表中删除所有其值重复的元素，使表中所有元素的值均不同。","answer":"算法思想：注意是有序顺序表，值相同的元素一定在连续的位置上，用类似于直接插入排序 的思想，初始时将第一个元素视为非重复的有序表。之后依次判断后面的元素是否与前面非重复 有序表的最后一个元素相同，若相同，则继续向后判断，若不同，则插入前面的非重复有序表的 最后，直至判断到表尾为止。 本题代码如下： Delete Same （SeqList& L） ｛ if （L.length==0） return false； 1/i 存储第一个不相同的元素，j为工作指针 intinji for （i=0,j=1;j<L.length;j++） //查找下一个与上一个元素值不同的元素 if （L.data ［il ！=L.datalj］） L.data［++i］=L.datalj］； //找到后，将元素前移 L.length=i+1； return true； ｝ 对于本题的算法，请读者用序列1，2,2，2，2，3，3，3, 4,4, 5 来手动模拟算法的执行过程，在模 拟过程中要标注i和j所指示的元素。 思考：若将本题中的有序表改无序表，你能想到时间复杂度为 O（n）的方法吗？ （提示：使用散列表。）","kp":["哈希表","复杂度分析"]},{"id":"q041","ch":2,"type":"subj","text":"【综合应用题】将两个有序顺序表合并为一个新的有序顺序表，并由函数返回结果顺序表。","answer":"算法思想：首先，按顺序不断取下两个顺序表表头较小的结点存入新的顺序表中。然后，看 哪个表还有剩余，将剩下的部分加到新的顺序表后面。 本题代码如下： bool Merge （SeqList A, SeqList B,SeqList &C） ｛ 1/将有序顺序表A与B合并为一个新的有序顺序表c 1大于顺序表的最大长度 if （A.length+B.length>C.maxSize） return false； int i=0,j=0,k=0； while（i<A.length&&j<B.length）｛ |/循环，两两比较，小者存入结果表 if （A.data ［i］<=B.data lj］） C.data［k++］=A.datali++］； else C.data［k++］=B.data lj++］； //还剩一个没有比较完的顺序表 while （i<A. length） C.data［k++］=A.data li++］； while （j<B.length） C.data［k++］=B.data lj++］； C. length=k； return truei ｝ 注意 本算法的方法非常典型，需要牢固掌握。","kp":["顺序表"]},{"id":"q042","ch":2,"type":"subj","text":"【综合应用题】已知在一维数组 A［m+n］中依次存放两个线性表（（a1, C2， Q3，\"，Qm）和（b1，b2,b3，\"，b，）。编写一 个函数，将数组中两个顺序表的位置互换，即将（b1，02.b3。\"，b，）放在（a1,02，03。 ，Qn）的前面。","answer":"算法思想：首先将数组 A［m +］中的全部元素（al， Q2，Q3， ，Qm, b1,b2,b3， ，b，）原地逆置 为（bn，b，-1, b，-2，•，b1,Qm, Q.w-1, Qm-2，•，ai），然后对前n个元素和后m个元素分别使用逆置算法， 即可得到（b1，b2，03。•，bw,C41,Q2、03，⋯，Qm），从而实现顺序表的位置互换。 本题代码如下： typedef int DataType； void Reverse（Datarype All,int left,int right,int arraySize） ｛ 1/逆转（aleft, aleft+1,aleft+2， …，aright）为（aright,aright-1，⋯，aleft） if （left>=right ||right>=arraySize） int mid= （left+right）/2； for （int i=0;i<=mid-left;i++）｛ DataType temp=A［left+i］； A［left+i］=A ［right-i］： A ［right-i］=temp； void Exchange （Datarype All,int m,int n,int arraysize） ｛ /*数组 A［m+n］中，从0到m-1存放顺序表（al, a2, a3，•，am），从m到m+n-1存放顺序表 （b1,b2,b3，⋯，bn），算法将这两个表的位置互换*/ Reverse （A,0,m+n-1,arraysize）； Reverse （A,0,n-1,arraySize）； Reverse （A, n,m+n-1,arraySize）；","kp":["顺序表"]},{"id":"q043","ch":2,"type":"subj","text":"【综合应用题】线性表（al,Q2,Q3\"，an）中的元素递增有序且按顺序存储于计算机内。要求设计一个算法， 完成用最少时间在表中查找数值为×的元素，若找到，则将其与后继元素位置相交换， 若找不到，则将其插入表中并使表中元素仍然递增有序。","answer":"算法思想：顺序存储的线性表递增有序，可以顺序查找，也可以折半查找。题目要求\"用最 少的时间在表中查找数值为x的元素\"，这里应使用折半查找法。 本题代码如下： void SearchExchangeInsert （ElemType A［］，ElemType x） ｛ 1/ow 和high 指向顺序表下界和上界的下标 int 1ow=0,high=n-1,mid； while （1ow<=high）｛ 2027年数据结构考研复习指导 /找中间位置 mid= （1ow+high） /2； /找到x，退出 while 循环 if（A［mid］==x） break； else if（A［mid］<x） 1ow=mid+1;//到中点mid的右半部去查 //到中点mid 的左半部去查 else high=mid-1； //下面两个 i 语句只会执行一个 ｝ 1/若最后一个元素与x相等，则不存在与其后 if （A ［mid］ ==x&&mid！=n-1）｛ 继交换的操作 t=A［mid］；A［mid］=A［mid+1］； Almid+1］=t； //查找失败，插入数据元素x if（10w>high）｛ for（i=n-1;i>high;i--） Ali+1］=A［i］；1/后移元素 1插入x A［i+1］=X； /结束插入 ｝ ｝ 本题的算法也可写成三个函数：查找函数、交换后继函数与插入函数。写成三个函数的优点 是逻辑清晰且易读。","kp":["折半查找"]},{"id":"q044","ch":2,"type":"subj","text":"【综合应用题】给定三个序列A、B、C，长度均为n，且均为无重复元素的递增序列，请设计一个时间 上尽可能高效的算法，逐行输出同时存在于这三个序列中的所有元素。例如，数组A为 ｛1,2,3｝，数组B为12,3,4｝，数组C为｛-1,0.2｝，则输出2。 要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你的算法的时间复杂度和空间复杂度。","answer":"【解析】 1）算法的基本设计思想。 使用三个下标变量从小到大遍历数组。当三个下标变量指向的元素相等时，输出并向前推进 指针，否则仅移动小于最大元素的下标变量，直到某个下标变量移出数组范围，即可停止。 2）算法的实现。 void samekey （int A［l,int Bll,int C［l,int n） ｛ 1/定义三个工作指针 int i=0,j=0,k=0； //相同则输出，并集体后移 while（i<n&&j<n&&k<n）｛ if（A［1］==B［j］&&B［j］==C［k］）｛ printf（\"8dln\"， A［i］）； i++ij++；k++； int maxNum=max （A［i］，max （B［jl,C［k］））； if （A ［i］<maxNum） i++； if （B［j］<maxNum）j++； if （C ［k］<maxNum） k++； 3）每个指针移动的次数不超过n，且每次循环至少有一个指针后移，故时间复杂度为O（n）， 算法只用到了常数个变量，空间复杂度 O（1）。","kp":["数组与矩阵","复杂度分析"]},{"id":"q045","ch":2,"type":"subj","text":"【综合应用题】【2010统考真题】设将n（n>1）个整数存放到一维数组R中。设计一个在时间和空间 两方面都尽可能高效的算法。将R 中保存的序列循环左移P（0<P<n）个位置，即将R 中的数据由（Xo,X1\"， 1）变换为（Xp Xp+1,Xn-1,X0,X,X 1）。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或 C++或 Java 语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 可将问题视为把数组 ab 转换成数组 ba （a代表数组的前p个元素，b代表数组中余下的n-p个 元素），先将a逆置得到ab，再将b逆置得到ab，最后将整个ab逆置得到（a b）=ba。设 Reverse 函数执行将数组逆置的操作，对 abcdefgh 向左循环移动3（p=3）个位置的过程如下： Reverse （0,p-1）得到 cbadefgh； Reverse （p, n-1） 得到 cbahgfed； Reverse （0, n-1）得到 defghabc。 注：在 Reverse 中，两个参数分别表示数组中待转换元素的始末位置。 2）使用C语言描述算法如下： void Reverse （int R［］，int from,int to）｛ int i,temp； for （1=0;1< （to-from+1） /2;i++） ｛temp=R［from+il;R［from+il=R［to-il;R［to-i］=temp；｝ void Converse （int Rll,int n,int p）｛ Reverse （R, 0,P-1） ； Reverse （R,P,n-1）； Reverse （R,0,n-1）； 3）上述算法中三个 Reverse 函数的时间复杂度分别为 0（p/2）、O（（n-p）/2）和 O（n/2），故所 设计的算法的时间复杂度O（n），空间复杂度力 O（1）。 【另解】借助辅助数组来实现。算法思想：创建大小为P的辅助数组S，将R 中前p个整数 依次暂存在S中，同时将R 中后n-P个整数左移，然后将S中暂存的p个数依次放回到R 中的 后续单元。时间复杂度为 O（n），空间复杂度为 O（p）。","kp":["数组与矩阵","复杂度分析"]},{"id":"q046","ch":2,"type":"subj","text":"【综合应用题】【2011统考真题】一个长度为L（L≥1）的升序序列S，处在第L/2|个位置的数称为S 的中位数。例如，若序列 S， =（11,13,15,17,19），则S」的中位数是15，两个序列的中位 数是含它们所有元素的升序序列的中位数。例如，若 S2 =（2,4,6, 8,20），则 Si和S的中 位数是11。现在有两个等长升序序列A和B，试设计一个在时间和空间两方面都尽可能 高效的算法，找出两个序列 A和B的中位数。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++或 Java语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想如下。 分别求两个升序序列4、B的中位数，设为a和b，求序列A、B 的中位数过程如下： ① 若a=b，则a或b为所求中位数，算法结束。 ② 若a<b，则舍弃序列4中较小的一半，同时舍弃序列B中较大的一半，要求两次舍弃的 长度相等。 ③ 若a>b，则舍弃序列4中较大的一半，同时舍弃序列B中较小的一半，要求两次舍弃的 长度相等。 在保留的两个升序序列中，重复过程①、②、③，直到两个序列中均只含一个元素时为止， 较小者为所求的中位数。 2）本题代码如下： int M_Search （int All,int Bll,int n） ｛ int sl,d1,m1,S2,d2,m2； s1=0:d1=n-1； S2=0;d2=n-1； while （s1！=d1||s2！=d2）｛ m1= （s1+d1） /2； m2= （S2+d2） /2； if （A［m1］==B［m2］） //满足条件① return A［m1］； //满足条件② if （A［m1］<B ［m2］）｛ if（（s1+d1） 82==0）｛ //若元素个数奇数 //舍弃A 中间点以前的部分，且保留中间点 s1=m1； //舍弃B 中间点以后的部分，且保留中间点 d2=m2； 1/元素个数力偶数 else｛ //舍弃A 的前半部分 s1=m1+1； //舍弃B 的后半部分 d2=m2； ｝ //满足条件③ else｛ if（（S1+d1）82==0）｛ 1/若元素个数次奇数 //舍弃A中间点以后的部分，且保留中间点 d1=m1； //舍弃B 中间点以前的部分，且保留中间点 S2=m2； //元素个数为偶数 else｛ //舍弃A 的后半部分 d1=m1； //舍弃B 的前半部分 s2=m2+1； 2027年数据结构考研复习指导 return Als1］<B［s2］？ Als11:Bls2］i 3）算法的时间复杂度为 0（logzn），空间复杂度 O（1）。 【另解】对两个长度为n的升序序列4和B中的元素按从小到大的顺序依次访问，这里访问 的含义只是比较序列中两个元素的大小，并不实现两个序列的合并，因此空间复杂度为 O（1）。按 照上述规则访问第n个元素时，这个元素为两个序列 A和B的中位数。","kp":["复杂度分析"]},{"id":"q047","ch":4,"type":"subj","text":"【综合应用题】【2013统考真题】已知一个整数序列A=（a0, al，\"，an-1），其中O≤a，<n （O≤i<n）。 若存在Qm=0p=•=0pm=X且m>n/2（0≤Pk<n, 1≤A≤m），则称x为A的主元素。 例如A=（0, 5,5,3, 5,7, 5,5），则5为主元素；又如A=（0, 5,5,3,5, 1,5,7），则A中没有 主元素。假设A中的n个元素保存在一个一维数组中，请设计一个尽可能高效的算法， 找出A的主元素。若存在主元素，则输出该元素；否则输出-1。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或 C++或 Java语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想：算法的策略是从前向后扫描数组元素，标记出一个可能成为主元 素的元素 Num。然后重新计数，确认 Num 是否是主元素。 算法可分为以下两步： ① 选取候选的主元素。依次扫描所给数组中的每个整数，将第一个遇到的整数 Num 保存到 c 中，记录 Num 的出现次数为1；若遇到的下一个整数仍等于 Num，则计数加1，否则计 数减1；当计数减到0时，将遇到的下一个整数保存到c中，计数重新记为1，开始新一 轮计数，即从当前位置开始重复上述过程，直到扫描完全部数组元素。 ② 判断c中元素是否是真正的主元素。再次扫描该数组，统计c中元素出现的次数，若大 于n/2，则为主元素；否则，序列中不存在主元素。 2）算法实现如下： int Majority （int All,int n） ｛ lc用来保存候选主元素，count 用来计数 int i,c,count=1； 1/设置A［01为候选主元素 c=A［0］； //查找候选主元素 for （i=1;i<n;i++） if（A［1 ==C） 1/对A 中的候选主元素计数 count++； else 1/处理不是候选主元素的情况 if （count>0） count--； //更换候选主元素，重新计数 else｛ C=A［i］； count=1； if （count>0） for（i=count=0;i<n;i++） //统计候选主元素的实际出现次数 if （A［i］==C） count++； if（count>n/2）return ci /确认候选主元素 //不存在主元素 else return -1； ｝ 3）实现的程序的时间复杂度为 O（n），空间复杂度为 O（1）。 说明 本题若采用先排好序再统计的方法［时间复杂度为 O（nlogzn）］，则只要解答正确，最高就可拿11分。 即便是写出O（n'）的算法，最高也能拿10分，因此，对于统考算法题，花费大量时间去思考最优解法是 得不偿失的。本算法的方法非常典型，需要牢固掌握。","kp":["数组与矩阵","复杂度分析"]},{"id":"q048","ch":2,"type":"subj","text":"【综合应用题】【2018统考真题】给定一个含n（n≥1）个整数的数组，请设计一个在时间上尽可能高 效的算法，找出数组中未出现的最小正整数。例如，数组｛-5，3，2,3｝中未出现的最小正 整数是I；数组｛1，2,3｝中未出现的最小正整数是 4。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 要求在时间上尽可能高效，因此采用空间换时间的办法。分配一个用于标记的数组B［n］，用 来记录A中是否出现了1～n中的正整数，B［0］对应正整数1，B［n-1］对应正整数n，初始化B中全 部为0。A中含有n个整数，因此可能返回的值是1～n+1，当A中n个数恰好为1~n时返回n+1。当 数组A中出现了小于或等于0或大于n的值时，会导致1～n中出现空余位置，返回结果必然在1～n 中，因此对于A中出现了小于或等于O或大于n的值，可以不采取任何操作。 经过以上分析可以得出算法流程：从A［01开始遍历A，若0<A［i］<=n，则令B［A［i］-1］=1； 否则不做操作。对A遍历结束后，开始遍历数组B，若能查找到第一个满足B［i］==0的下标i，返 回1+1即为结果，此时说明A中未出现的最小正整数在1和n之间。若B［i］全部不为0，返回1+1 （跳出循环时i=n，i+1等于n+1），此时说明A中未出现的最小正整数是n+1。 2）算法实现： int findMissMin （int A［l,int n） //标记数组 int i，*B； B=（int *）malloc （sizeof （int） *n） ：/1分配空间 1/賦初值为0 memset （B, O, sizeof （int） *n）； for （i=0;i<n;i++） 1/若A［i］的值介于 1~n，则标记数组B if（A［i >0&&A［i <=n） B［A［i］-1］=1； //扫描数组B，找到目标值 for （i=0;i<n;i++） if（B［i］==0） break； 1/返回结果 return i+1； ｝ 3）时间复杂度：遍历A一次，遍历B一次，两次循环内操作步骤为 O（1）量级，因此时间复 杂度为O（n）。空间复杂度：额外分配了 B［n］，空间复杂度为 O（n）。","kp":["数组与矩阵","复杂度分析"]},{"id":"q049","ch":4,"type":"subj","text":"【综合应用题】【2020统考真题】定义三元组（a,b,c）（a,b,C均为整数）的距离D=a-b+6-c+c a。 给定3个非空整数集合 SI、S2和S3，按升序分别存储在3个数组中。请设计一个尽可能 高效的算法，计算并输出所有可能的三元组（a, b, c）（aESI,bES2, CESs）中的最小距 离。例如Si=｛-1,0,9｝，S2 =｛-25，-10,10, 11｝，Ss =$2, 9, 17,30,41｝，则最小距离为2， 相应的三元组为（9,10,9）。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C语言或 C++语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"分析。由D=la-b|+|b-cl+lc-a|≥0，有如下结论。 ① 当a=b=c时，距离最小。 ② 其余情况。不失一般性，假设 a≤b≤c，观察下面的数轴： L2 L 。 Li=1a b， L2=1b-cl Ls=lc-al D=la-bl+1b-cl+lc-al≥0=L+la+ s=2Ls 由D的表达式可知，事实上决定 D大小的关键是a和c之间的距离，于是问题就可以简化 为每次固定c找一个a，使得Ls=|c-a|最小。 1）算法的基本设计思想： ① 使用Dmin记录所有已处理的三元组的最小距离，初值为一个足够大的整数。 IS2|且 <IS3时（IS|表示集合S中的元素个数），循环执行下面的步骤a）～c）。 a）计算（4［，B［ ］，CIA］）的距离 D；（计算D） b）若D<Dmin，则Dmin=D；（更新D） c）将A［i、B［小、CI中的最小值的下标+1；（对照分析：最小值a，最大值为c，这里 c不变而更新 a，试图寻找更小的距离D） ③ 输出 Dmin，结束。 2027年数据结构考研复习指导 2）算法实现： #define INT MAX Ox7fffffEE int abs （int a） ｛//计算绝对值 if （aco） return -ai else return ai ｝ bool x1s_min （int a, int b, int c） ｛/la 是否是三个数中的最小值 if（ac=b&&a<=c） return true： return false； ｝ int findMinofTrip（int All,int n,int Bll,int m,int C［l,int p）｛ //D min 用于记录三元组的最小距离，初值赋为 INT_MAX int 1=0,j=0,k=0,D_min=INT_MAX,D； while （i<n&&j<m&&kcp&&D_min>0）｛ D=abs_（A［il-Blj］） tabs_（Blj］-C［k］）+abs_（C［k］-A［i］）；l计算 D 1/更新D i£（D<D_min） D_min=D； iE（x1s_min（A［i］，B［j］，C［k］）） i++； 1/更新a else if（x1s_min （B［j］，C［k］，Ali］）） j++； else k++； return D_min： 3）设n=（BSi| +IS2l + ISsD），时间复杂度为O（n），空间复杂度为O（1）。","kp":["数组与矩阵","复杂度分析"]},{"id":"q050","ch":4,"type":"subj","text":"【综合应用题】【2025统考真题】有两个长度均为n的一维整型数组A和res，对数组A中的每个元素A［， 计算A［与AU］（O≤i≤J≤n-1）乘积的最大值，并将其保存到res［l中。例如，当A［］=｛1， 4， -9,6｝时，得到res［］=16,24,81,36｝。现给定数组A，设计一个时间和空间上尽可能高效的 算法calMulMax，求res中各元素的值。函数原型 void calMulMax （int Al］，int res ［］，int n）。 要求如下： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 从后向前扫描一趟数组A，对每个A［i（O≤i≤n-1），分别找到从 A［n-1］到A［中的最大值 Max 和最小值 Min，然后分以下情况进行处理：① 若A［≥0，则A［与 Max 相乘；② 若A［i<0， 则A［与 Min 相乘。相乘的结果保存在 res［中。 2）算法实现： void calMulMax （int All, int res［l, int n） int i, Max, Min； Max=Min=A［n-1］ for（i=n-1；i>=0;i--） 1/从后向前扫描一趟数组 A if （A［i］>Max） Max=A［i］； else if （A［i］<Min） Min = A［i］； if（Ali］>=0）res ［i］ = A［i］*Max；//根据 A［的正负性分别处理 else res ［i］=A［i］ *Min； ｝ 3）算法的时间复杂度为O（n），空间复杂度 O（1）。","kp":["数组与矩阵","复杂度分析"]},{"id":"q051","ch":2,"type":"choice","text":"下列关于线性表的存储结构的描述中，正确的是（） I. 线性表的顺序存储结构优于其链式存储结构 II.链式存储结构比顺序存储结构能更方便地表示各种逻辑结构 ［.若频繁使用插入和删除结点操作，则顺序存储结构更优于链式存储结构 IV.顺序存储结构和链式存储结构都可以进行顺序存取","opts":[{"k":"A","t":"I、II、III"},{"k":"B","t":"II、IV"},{"k":"C","t":"IL、皿"},{"k":"D","t":"II、IV"}],"correct":["B"],"exp":"解析：两种存储结构适用于不同的场合，不能简单地说谁好谁坏，说法1错误。链式存储用指针表 46 2027年数据结构考研复习指导 示逻辑结构，而指针的设置是任意的，因此比顺序存储结构能更方便地表示各种逻辑结构，说法 II正确。在顺序存储中，插入和删除结点需要移动大量元素，效率较低，说法1I 的描述刚好相反。 顺序存储结构既能随机存取又能顺序存取，而链式结构只能顺序存取，说法IV 正确。","kp":["线性表"]},{"id":"q052","ch":2,"type":"choice","text":"对于一个线性表，既要求能够进行较快速地插入和删除，又要求存储结构能反映数据之间的逻辑 关系，则应该用（）","opts":[{"k":"A","t":"顺序存储方式"},{"k":"B","t":"链式存储方式"},{"k":"C","t":"散列存储方式"},{"k":"D","t":"以上均可以"}],"correct":["B"],"exp":"解析：首先直接排除选项 A 和 D。散列存储通过散列函数映射到物理空间，不能反映数据之间的逻辑 关系，排除选项C。链式存储能方便地表示各种逻辑关系，且插入和删除操作的时间复杂度为O（1）。","kp":["哈希表","复杂度分析"]},{"id":"q053","ch":2,"type":"choice","text":"链式存储设计时，结点内的存储单元地址（）","opts":[{"k":"A","t":"一定连续"},{"k":"B","t":"一定不连续"},{"k":"C","t":"不一定连续"},{"k":"D","t":"部分连续，部分不连续"}],"correct":["A"],"exp":"解析：链式存储设计时，各个不同结点的存储空间可以不连续，但结点内的存储单元地址必须连续。","kp":["基本概念"]},{"id":"q054","ch":2,"type":"choice","text":"下列关于线性表说法中，正确的是（） I. 顺序存储方式只能用于存储线性结构 II.在一个设有头指针和尾指针的单链表中，删除表尾元素的时间复杂度与表长无关 II. 带头结点的循环单链表中不存在空指针 IV.在一个长度为n的有序单链表中插入一个新结点并仍保持有序的时间复杂度为O（n） V.若用单链表来表示队列，则应该选用带尾指针的循环链表","opts":[{"k":"A","t":"I、II"},{"k":"B","t":"I、IIl、IV、V"},{"k":"C","t":"IV.V"},{"k":"D","t":"III、IV、V"}],"correct":["D"],"exp":"解析：顺序存储方式同样适用于存储图和树，说法1错误。删除表尾结点时，必须从头开始找到表 尾结点的前驱，其时间与表长有关，说法II错误。循环单链表中最后一个结点的指针不是 NULI， 而是指向头结点，整个链表形成一个环，因此不存在空指针，说法 III 正确。有序单链表只能依 次查找插入位置，时间复杂度为O（n），说法IV 正确。队列需要在表头删除元素，表尾插入元素， 采用带尾指针的循环链表较为方便，插入和删除的时间复杂度都为 O（1），说法 V 正确。","kp":["队列","复杂度分析"]},{"id":"q055","ch":2,"type":"choice","text":"设线性表中有2n个元素，（）在单链表上实现要比在顺序表上实现效率更高。","opts":[{"k":"A","t":"删除所有值x的元素"},{"k":"B","t":"在最后一个元素的后面插入一个新元素"},{"k":"C","t":"顺序输出前k个元素"}],"correct":["A"],"exp":"解析：对于选项 A，在单链表和顺序表上实现的时间复杂度都为O（m），但后者要移动很多元素，因 此在单链表上实现效率更高。对于选项B和D，顺序表的效率更高。C无区别。","kp":["链表","复杂度分析"]},{"id":"q056","ch":2,"type":"choice","text":"在一个单链表中，已知q所指结点是p所指结点的前驱结点，若在q和p之间插入结点S，则执 行（）","opts":[{"k":"A","t":"s-> next=P->next; P->next=S；"},{"k":"B","t":"p-> next =S-> next; S-> next=p；"},{"k":"C","t":"9- > next=S;S->next=p；"},{"k":"D","t":"p-> next=s;s->next=g；"}],"correct":["C"],"exp":"解析：s 插入后，q成为s的前驱，而p 成为s的后继，选择选项C。 注意 可能有读者认为选项 C中的两条语句交换后才正确。实际上，因为本题插入位置的前后结，点都有指 针指示（这与前面介绍的插入操作是不同的），所以选项C 中的语句顺序并不会造成断链。在此提醒读 者在学习过程中一定要多动脑思考，而不要生搬硬套。","kp":["链表"]},{"id":"q057","ch":2,"type":"choice","text":"在n个元素的线性表的数组表示中，时间复杂度为 O（1）的操作是（） L. 访问第i（1≤i≤n） 个结点和求第i（2≤i≤n））个结点的直接前驱 1I.在最后一个结点后插入一个新的结点 IL. 删除第1个结点 IV.在第i（1≤i≤n） 个结点后插入一个结点","opts":[{"k":"A","t":"I"},{"k":"B","t":"I、1I"},{"k":"C","t":"I、II"},{"k":"D","t":"I、II、III"}],"correct":["C"],"exp":"解析：对说法1，解析略；对说法I，在最后位置插入新结点不需要移动元素，时间复杂度为 O（1）； 对说法1I，被删结点后的结点需要要依次前移，时间复杂度为O（n）；对说法IV，需要后移n-i个 结点，时间复杂度为O（n）。","kp":["线性表","复杂度分析"]},{"id":"q058","ch":2,"type":"choice","text":"设线性表有n个元素，严格说来，以下操作中，（）在顺序表上实现要比在链表上实现的效率高。 I. 输出第i（1≤i≤n） 个元素值 1I.交换第3个元素与第4个元素的值 I.顺序输出这n个元素的值","opts":[{"k":"A","t":"I"},{"k":"B","t":"I、III"},{"k":"C","t":"I、1I"},{"k":"D","t":"II、1I"}],"correct":["C"],"exp":"解析：对说法1，顺序表只需3次交换操作；链表需要分别找到两个结点前驱，第4个结点断链后 再插入到第2个结点后，效率较低。对说法［，需要依次顺序访问每个元素，时间复杂度相同。","kp":["链表","复杂度分析"]},{"id":"q059","ch":2,"type":"choice","text":"在一个长度为n的顺序表中删除第i（1≤i≤n）个元素时，需向前移动（）个元素。","opts":[{"k":"A","t":"n"},{"k":"B","t":"i-1"},{"k":"C","t":"n-i"},{"k":"D","t":"n-i+1"}],"correct":["C"],"exp":"解析：需要将元素 QIHI～Q，依次前移一位，共移动 n-（i+ 1）+1=n-i个元素。","kp":["顺序表"]},{"id":"q060","ch":2,"type":"choice","text":"对于顺序表，访问第i个位置的元素和在第i个位置插入一个元素的时间复杂度为（）","opts":[{"k":"A","t":"O（n），O（n）"},{"k":"B","t":"O（n），O（1）"},{"k":"C","t":"O（1），0（n）"},{"k":"D","t":"O1），0（1）"}],"correct":["C"],"exp":"解析：在第i个位置插入一个元素，需要移动 n-i+1个元素，时间复杂度为 O（n）。","kp":["顺序表","复杂度分析"]},{"id":"q061","ch":2,"type":"choice","text":"对于顺序存储的线性表，其算法时间复杂度为 O（1）的运算应该是（）","opts":[{"k":"A","t":"将n个元素从小到大排序"},{"k":"B","t":"删除第i（1≤i≤n） 个元素"},{"k":"C","t":"改变第i（1≤i≤n） 个元素的值"},{"k":"D","t":"在第i（1≤i≤n） 个元素后插入一个新元素"}],"correct":["C"],"exp":"解析：对n个元素进行排序的时间复杂度最小也要O（n）（初始有序时），通常为 O（nlogzn）或 O（nP）， 通过第8章学习后会更容易理解。选项B和D显然错误。顺序表支持按序号的随机存取方式。","kp":["顺序表","复杂度分析"]},{"id":"q062","ch":2,"type":"choice","text":"顺序表的插入算法中，当n个空间已满时，可再申请增加分配m个空间，若申请失败，则说明系 统没有（）可分配的存储空间。","opts":[{"k":"A","t":"m个"},{"k":"B","t":"m 个连续"},{"k":"C","t":"n+m个"},{"k":"D","t":"n+m 个连续"}],"correct":["D"],"exp":"解析：顺序存储需要连续的存储空间，在申请时需申请n+m个连续的存储空间，然后将线性表原 来的n个元素复制到新申请的n+m个连续的存储空间的前n个单元。","kp":["顺序表"]},{"id":"q063","ch":2,"type":"choice","text":"【2023统考真题】在下列对顺序存储的有序表（长度为n）实现给定操作的算法中，平均时间复杂 度为0（1）的是（）","opts":[{"k":"A","t":"查找包含指定值元素的算法"},{"k":"B","t":"插入包含指定值元素的算法"},{"k":"C","t":"删除第i（1≤i≤n） 个元素的算法"},{"k":"D","t":"获取第i（1≤i≤n） 个元素的算法"}],"correct":["D"],"exp":"解析：对于顺序存储的有序表，查找指定值元素可以采用顺序查找法或折半查找法，平均时间复杂 度最少为 O（logzn）。插入指定值元素需要先找到插入位置，然后将该位置及之后的元素依次后移 一个位置，最后将指定值元素插入到该位置，平均时间复杂度为 O（n）。删除第；个元素需要将该 元素之后的全部元素依次前移一个位置，平均时间复杂度为O（n）。获取第；个元素只需直接根据 下标读取对应的数组元素即可，时间复杂度为 O（1）。","kp":["折半查找","复杂度分析"]},{"id":"q064","ch":2,"type":"choice","text":"下面关于线性表的一些说法中，正确的是（）","opts":[{"k":"A","t":"对一个设有头指针和尾指针的单链表执行删除最后一个元素的操作与链表长度无关"},{"k":"B","t":"线性表中每个元素都有一个直接前驱和一个直接后继"},{"k":"C","t":"为了方便插入和删除数据，可以使用双链表存放数据"},{"k":"D","t":"取线性表第i个元素的时间与i的大小有关"}],"correct":["C"],"exp":"解析：选项 A显然错误。选项 B 中第一个元素和最后一个元素不满足题设要求。双链表能很方便 地访问前驱和后继，故删除和插入数据较为方便，选项C正确。选项D未考虑顺序存储的情况。","kp":["双向链表"]},{"id":"q065","ch":2,"type":"choice","text":"在双链表中向p所指的结点之前插入一个结点q的操作为（）","opts":[{"k":"A","t":"p-> prior =q;9->next=p; p->prior- >next =q; 9->prior =p->prior；"},{"k":"B","t":"9->prior=p->prior; P->prior-> next=9; 9->next = p; p-> prior =9-> next；"},{"k":"C","t":"9-> next= p; p->next= q; 9-> prior- > next= q; q->next = p；"},{"k":"D","t":"p-> prior->next =q； 9-> next=p; 9->prior=p->prior; P->prior=q；"}],"correct":["D"],"exp":"解析：为了在p之前插入结点q，可以将p的前一个结点的next 域指向q，将q的next 域指向 P，将q的prior 域指向p 的前一个结点，将p的prior 域指向q。仅选项D满足条件。","kp":["双向链表"]},{"id":"q066","ch":2,"type":"choice","text":"在双向链表存储结构中，删除p所指的结点时必须修改指针（）","opts":[{"k":"A","t":"p-> prior->next =p->next; p-> next->prior =p-> prior；"},{"k":"B","t":"p-> prior =p->prior- > prior; p- >prior- > next= p；"},{"k":"C","t":"p->next->prior = p; p->next= p->next-> next；"},{"k":"D","t":"p->next=p->prior->prior; P->prior =p->next-> next；"}],"correct":["A"],"exp":"解析：与上一题的分析基本类似，只不过这里是删除一个结点，注意将p 的前、后两结点链接起来。 关键是要保证在结点指针的修改过程中不断链！ 注意，请读者仔细对比上述两题，弄清双链表的插入和删除方法。","kp":["双向链表"]},{"id":"q067","ch":2,"type":"choice","text":"在如下图所示的双链表中，已知指针p指向结点 A，若要在结点A和C之间插入指针q所指的 结点B，则依次执行的语句序列可以是（） ① q->next=p->next； ② q->prior=p； ③ p->next=9； ④p->next->prior=q；","opts":[{"k":"A","t":"①②④③"},{"k":"B","t":"④③②①"},{"k":"C","t":"③④①②"},{"k":"D","t":"①③④②"}],"correct":["A"],"exp":"解析：结点A和B分别由指针p 和q指示，但结点C仅能由p->next 间接指示，因此在改变p->next 之前，必须先将 q->next 指向结点C，即①要在③前面，且④要在③前面（因为若先执行③，则 ④相当于 q->prior 指向其自身，显然矛盾）。故只能选择选项A。","kp":["双向链表"]},{"id":"q068","ch":2,"type":"choice","text":"在双链表的两个结点之间插入一个新结点，需要修改（）个指针域。","opts":[{"k":"A","t":"1"},{"k":"B","t":"3"},{"k":"C","t":"4"},{"k":"D","t":"2"}],"correct":["C"],"exp":"解析：当在双链表的两个结点（分别用第一个、第二个结点表示）之间插入一个新结点时，需要修 改四个指针域，分别是：新结点的前驱指针域，指向第一个结点；新结点的后继指针域，指向第 二个结点；第一个结点的后继指针域，指向新结点；第二个结点的前驱指针域，指向新结点。","kp":["双向链表"]},{"id":"q069","ch":2,"type":"choice","text":"在长度为n的有序单链表中插入一个新结点，并仍然保持有序的时间复杂度是（）","opts":[{"k":"A","t":"O（1）"},{"k":"B","t":"O（n）"},{"k":"C","t":"O（n）"},{"k":"D","t":"O（nlogzn）"}],"correct":["B"],"exp":"解析：设单链表递增有序，首先要在单链表中找到第一个大于×的结点的直接前驱p，在p 之后插 入该结点。查找的时间复杂度为 O（n），插入的时间复杂度为 O（1），总时间复杂度为 O（n）。","kp":["链表","复杂度分析"]},{"id":"q070","ch":2,"type":"choice","text":"与单链表相比，双链表的优点之一是（）","opts":[{"k":"A","t":"插入、删除操作更方便"},{"k":"B","t":"可以进行随机访问"},{"k":"C","t":"可以省略表头指针或表尾指针"},{"k":"D","t":"访问前后相邻结点更灵活"}],"correct":["D"],"exp":"解析：在插入和删除操作上，单链表和双链表都不用移动元素，都很方便，但双链表修改指针的操 作更为复杂，选项A 错误。双链表中可以快速访问任何一个结点的前驱和后继结点，选项D正确。","kp":["双向链表"]},{"id":"q071","ch":2,"type":"choice","text":"对于一个带头结点的循环单链表L，判断该表为空表的条件是（）","opts":[{"k":"A","t":"头结点的指针域内空"},{"k":"B","t":"L 的值次 NULL"},{"k":"C","t":"头结点的指针域与L的值相等"},{"k":"D","t":"头结点的指针域与L的地址相等"}],"correct":["C"],"exp":"解析：带头结点的循环单链表 为空表时，满足->next==L，即头结点的指针域与工的值相等， 而不是头结点的指针域与工的地址相等。注意，带头结点的循环单链表中不存在空指针。","kp":["链表"]},{"id":"q072","ch":2,"type":"choice","text":"对于一个带头结点的循环双链表L，判断该表为空表的条件是（）","opts":[{"k":"A","t":"L->prior ==L && L->next == NULL"},{"k":"B","t":"L-> prior == NULL && L->next == NULL"},{"k":"C","t":"L-> prior == NULL && L->next ==L"},{"k":"D","t":"L->prior ==L && L->next ==L"}],"correct":["D"],"exp":"解析：循环双链表工判空的条件是头结点（头指针）的prior 和 next 域都指向它自身。","kp":["双向链表"]},{"id":"q073","ch":2,"type":"choice","text":"一个链表最常用的操作是在末尾插入结点和删除结点，则选用（）最节省时间。","opts":[{"k":"A","t":"带头结点的循环双链表"},{"k":"B","t":"循环单链表"},{"k":"C","t":"带尾指针的循环单链表"},{"k":"D","t":"单链表"}],"correct":["A"],"exp":"解析：在链表的末尾插入和删除一个结点时，需要修改其相邻结点的指针域。而寻找尾结点及尾结 点的前驱结点时，只有带头结点的循环双链表所需要的时间最少。","kp":["双向链表"]},{"id":"q074","ch":2,"type":"choice","text":"设对n（n>1）个元素的线性表的运算只有4种：删除第一个元素；删除最后一个元素；在第一个 元素之前插入新元素；在最后一个元素之后插入新元素，则最好使用（）","opts":[{"k":"A","t":"只有尾结点指针没有头结点指针的循环单链表"},{"k":"B","t":"只有尾结点指针没有头结点指针的非循环双链表"},{"k":"C","t":"只有头结点指针没有尾结点指针的循环双链表"},{"k":"D","t":"既有头结点指针又有尾结点指针的循环单链表"}],"correct":["C"],"exp":"解析：对于选项 A，删除尾结点*p 时，需要找到*p 的前一个结点，时间复杂度为O（n）。对于选项 B，删除首结点*p 时，需要找到*p 结点，这里没有直接给出头结点指针，而是通过尾结点的prior 指针找到*p 结点的时间复杂度为 O（n）。对于选项 D，删除尾结点*p 时，需要找到*p 的前一个 结点，时间复杂度O（n）。对于C，执行这四种算法的时间复杂度均为 O（1）。 48 2027年数据结构考研复习指导","kp":["双向链表","复杂度分析"]},{"id":"q075","ch":2,"type":"choice","text":"有两个长度为n的循环单链表，若要求两个循环单链表的头尾相接的时间复杂度为O（1），则对 应两个循环单链表各设置一个指针，分别指向（）","opts":[{"k":"A","t":"各自的头结点"},{"k":"B","t":"各自的尾结点"},{"k":"C","t":"各自的首结点"},{"k":"D","t":"一个表的头结点，另一个表的尾结点"}],"correct":["B"],"exp":"解析：要求用 O（1）的时间将两个循环单链表头尾相接，并未指明哪个链表接在另一个链表之后，所 以对两个链表都要在 O（1）的时间找到头结点和尾结点。因此，两个指针应都指向尾结点。","kp":["链表","复杂度分析"]},{"id":"q076","ch":2,"type":"choice","text":"有一个长度为n的循环单链表，若从表中删除音元结点的时间复杂度达到 O（n），则此时采用的 循环单链表的结构可能是（）","opts":[{"k":"A","t":"只有表头指针，没有头结点"},{"k":"B","t":"只有表尾指针，没有头结点"},{"k":"C","t":"只有表尾指针，带头结点"},{"k":"D","t":"只有表头指针，带头结点"}],"correct":["A"],"exp":"解析：在循环单链表中，删除首元结点后，要保持链表的循环性，因此需要找到首元结点的前驱。 当链表带头结点时，其前驱就是头结点，因此不论是表头指针还是表尾指针，删除首元结点的时 间都为 O（1）。当链表不带头结点时，其前驱是尾结点，因此，若有表尾指针，就可在O（1）的时间 找到尾结点；若只有表头指针，则需要遍历整个链表找到尾结点，时间为O（n）。","kp":["链表","复杂度分析"]},{"id":"q077","ch":2,"type":"choice","text":"某线性表用带头结点的循环单链表存储，头指针为 head，当head-> next-> next == head 成立时， 线性表的长度可能是（）","opts":[{"k":"A","t":"0"},{"k":"B","t":"1"},{"k":"C","t":"2"},{"k":"D","t":"可能为0或1"}],"correct":["D"],"exp":"解析：对一个空循环单链表，有 head->next==head，推理 head->next->next==head-> next==head。对含有一个元素的循环单链表，头结点（头指针 head 指示）的 next 域指向这个 唯一的元素结点，该元素结点的 next 域指向头结点，因此也有 head->next->next=head。","kp":["链表"]},{"id":"q078","ch":2,"type":"choice","text":"有两个长度都为n的双链表，若以h，为头指针的双链表是非循环的，以h，为头指针的双链表是 循环的，则下列叙述中正确的是（）","opts":[{"k":"A","t":"对于双链表h，删除首结点的时间复杂度是O（n）"},{"k":"B","t":"对于双链表 b2，删除音结点的时间复杂度是O（n）"},{"k":"C","t":"对于双链表hi，删除尾结点的时间复杂度是O（1）"},{"k":"D","t":"对于双链表h，删除尾结点的时间复杂度是O（1）"}],"correct":["D"],"exp":"解析：对于两种双链表，删除首结点的时间复杂度都是 O（1）。对于非循环双链表，删除尾结点的时 间复杂度是O（n）；对于循环双链表，删除尾结点的时间复杂度是 O（1）。","kp":["双向链表","复杂度分析"]},{"id":"q079","ch":2,"type":"choice","text":"一个链表最常用的操作是在最后一个元素后插入一个元素和删除第一个元素，则选用（）最节 省时间。","opts":[{"k":"A","t":"不带头结点的循环单链表"},{"k":"B","t":"双链表"},{"k":"C","t":"单链表"},{"k":"D","t":"不带头结点且有尾指针的循环单链表"}],"correct":["D"],"exp":"解析：对于选项 A，在最后一个元素之后插入元素的情况与普通单链表相同，时间复杂度为 O（n）；而 删除第一个元素时，为保持循环单链表的性质（尾结点指向第一个结点），要先遍历整个链表找到尾 结点，再做删除操作，时间复杂度为O（n）。对于选项B，双链表的情况与单链表的相同，一个是O（n）， 一个是 O（1）。对于选项C，在最后一个元素之后插入一个元素，要遍历整个链表才能找到插入位置， 时间复杂度为 O（n）；删除第一个元素的时间复杂度为 O（1）。对于选项D，与选项A的分析对比，有 尾结点的指针，省去了遍历链表的过程，因此时间复杂度均为 O（1）。","kp":["双向链表","复杂度分析"]},{"id":"q080","ch":2,"type":"choice","text":"需要分配较大空间，插入和删除不需要移动元素的线性表，其存储结构为（）","opts":[{"k":"A","t":"单链表"},{"k":"B","t":"静态链表"},{"k":"C","t":"顺序表"},{"k":"D","t":"双链表"}],"correct":["B"],"exp":"解析：静态链表采用数组表示，因此需要预先分配较大的连续空间，静态链表同时还具有一般链表 的特点，即插入和删除不需要移动元素。","kp":["静态链表"]},{"id":"q081","ch":2,"type":"choice","text":"下列关于静态链表的说法中，正确的是（） I. 静态链表兼具顺序表和单链表的优点，因此存取表中第i个元素的时间与i无关 I.静态链表能容纳的最大元素个数在表定义时就确定了，以后不能增加 I.静态链表与动态链表在元素的插入、删除上类似，不需要移动元素 IV. 相比动态链表，静态链表可能浪费较多的存储空间","opts":[{"k":"A","t":"1、II、III"},{"k":"B","t":"II、III、IV"},{"k":"C","t":"I、I、IV"},{"k":"D","t":"I、II、IV"}],"correct":["B"],"exp":"解析：静态链表的存储空间虽然是顺序分配的，但元素的存储不是顺序的，查找时仍然需要按链依 次进行，而插入、删除都不需要移动元素。静态链表的存储空间是一次性申请的，能容纳的最大 元素个数在定义时就已确定。并非每个空间都存储了元素，因此会造成存储空间的浪费。","kp":["静态链表"]},{"id":"q082","ch":2,"type":"choice","text":"【2016统考真题】己知一个带有表头结点的循环双链表L，结点结构为： prev data next 其中 prev 和 next 分别是指向其直接前驱和直接后继结点的指针。现要删除指针p 所指的结点，正确的 语句序列是（）","opts":[{"k":"A","t":"p-> next-> prev =P-> prev; P-> prev- > next=P-> prev; free（p）；"},{"k":"B","t":"p->next->prev =p->next; P-> prev-> next =p-> next; free（p）；"},{"k":"C","t":"p-> next->prev =P-> next; P-> prev-> next=P->prev; free（P）；"},{"k":"D","t":"p-> next-> prev =P->prev; P->prev-> next=P-> next; free（P）；"}],"correct":["D"],"exp":"解析：选项A的第二句代码，相当于将p 前驱结点的后继指针指向其自身，错误；选项B和C的 第一句代码，相当于将p后继结点的前驱指针指向其自身，错误。只有选项D正确。","kp":["双向链表"]},{"id":"q083","ch":4,"type":"choice","text":"【2016统考真题】已知表头元素为c的单链表在内存中的存储状态如下表所示： 元素 链接地址 地址 1000H a 1010H 100CH 1004H b 1000H 1008H c 100CH d NULL 1010H e 1004H 1014H 现将f存放于 1014H处并插入单链表，若f在逻辑上位于a和e之间，则a， e，f的\"链接地址\"依次 是（）","opts":[{"k":"A","t":"1010H，1014H,1004H"},{"k":"B","t":"1010H,1004H,1014H"},{"k":"C","t":"1014H,1010H, 1004H"},{"k":"D","t":"1014日，1004日，1010H"}],"correct":["D"],"exp":"解析：根据存储状态，单链表的结构如下图所示。 104C ：口 其中\"链接地址\"是指结点 next 所指的内存地址。当结点王插入后，a指向王，王指向e，e 指 向b。显然 a、e 和王的\"链接地址\"分别是f、b 和 e 的内存地址，即1014H、1004H和 1010H。","kp":["链表"]},{"id":"q084","ch":2,"type":"choice","text":"【2021统考真题】已知头指针h指向一个带头结点的非空循环单链表，结点结构为： data next 其中 next 是指向直接后继结点的指针，p是尾指针，q是临时指针。现要删除该链表的第一个元素，正确 的语句序列是（）","opts":[{"k":"A","t":"h->next =h-> next->next; q= h-> next; free（q）；"},{"k":"B","t":"q=h->next; h-> next =h-> next-> next; free（q）；"},{"k":"C","t":"q=h->next; h-> next =9-> next; if（p！=q） p=h; free（q）；"},{"k":"D","t":"q=h->next; h-> next =9->next; if（p ==q） p=h; free（q；"}],"correct":["D"],"exp":"解析：选项A的第二句代码，相当于将p 前驱结点的后继指针指向其自身，错误；选项B和C的 第一句代码，相当于将p后继结点的前驱指针指向其自身，错误。只有选项D正确。","kp":["链表"]},{"id":"q085","ch":2,"type":"choice","text":"【2023统考真题】现有非空双链表L，其结点结构为： prev data next prev 是指向直接前驱结点的指针，next 是指向直接后继结点的指针。若要在L中指针p所指向的结 点（非尾结点）之后插入指针s指向的新结点，则在执行语句序列\"s-> next=p->next; p->next=S：\" 后，下列语句序列中还需要执行的是（）","opts":[{"k":"A","t":"S->next-> prev = p; S-> prev = p；"},{"k":"B","t":"p-> next-> prev =S; S-> prev=P；"},{"k":"C","t":"s-> prev =s->next->prev;s-> next-> prev =s；"},{"k":"D","t":"p->next-> prev =S->prev; s->next->prev =p；"}],"correct":["C"],"exp":"解析：链表的插入操作要保证不会造成断链，画图再依次判断选项。执行语句 \"① s->next=p->next； ②p->next=s；\"后的结构如下图所示（虚线表示 prev，实线表示 next）。 0---=⑨- --p ◎ 对于选项 A，s->next->prev=P，错误。对于选项 B，p->next->prev=S，让s 的 prev 指向s，错误。对于选项D，两句代码均错误。对于选项C，执行语句 \"③s->prev=s->next->prev； ④s->next->prev=S；\"后的结构如下图所示，满足插入的要求。 20 （","kp":["双向链表"]},{"id":"q086","ch":2,"type":"choice","text":"【2024统考真题】己知带头结点的非空单链表L的头指针为h，结点结构为： data next 其中 next 是指向直接后继结点的指针。现有指针p 和q，若p 指向L 中非首且非尾的任意一个结 点，则执行语句序列\"q=P->next; p-> next=q->next; q-> next=h > next; h->next=9：\" 的结 果是（）","opts":[{"k":"A","t":"在p 所指结点后插入q所指结点"},{"k":"B","t":"在q所指结点后插入p 所指结点"},{"k":"C","t":"将p所指结点移至L的头结点之后"},{"k":"D","t":"将q所指结点移动到L 的头结点之后"}],"correct":["D"],"exp":"解析：假设单链表工的初始状态如图①所示。执行 q=P->next 后的状态如图②所示，q指向p 的后 继结点。执行 p->next=q->next 后的状态如图③所示，结点p的 next 指向q的后继结点。执 行 q->next=h->next 后的状态如图④所示，结点q的next 指向h的后继结点。执行h->next=g 后的状态如图⑤所示，q所指结点移至工的头结点h之后，选项D正确。 ④0+山- J b h P P q ①初始状态 ②执行q=p->next后 ④白中中山- h 』， p h q 9 ③执行p->next=g->next后 ④执行q->next=h->next后 ⑤执行h->next=g后","kp":["链表"]},{"id":"q087","ch":2,"type":"subj","text":"【综合应用题】在带头结点的单链表工中，删除所有值为×的结点，并释放其空间，假设值为×的结点 不唯一，试编写算法以实现上述操作。","answer":"解法1：用p从头至尾扫描单链表，pre 指向*p 结点的前驱。若p 所指结点的值为x，则删 2027年数据结构考研复习指导 除，并让p 移向下一个结点，否则让pre、p 指针同步后移一个结点。 本题代码如下： void Del X_ 1 （Linklist &L,ElemType x） ｛ LNode *p=L->next， *pre=L， *q;//置p 和pre 的初始值 while（p！=NULL）｛ if（p->data==x）｛ 1/q 指向被删结点 9=P： p=p->next； 1/将*q结点从链表中断开 pre->next=p； 1/释放*q 结点的空间 free（g）； ｝ 1/否则，pre 和p 同步后移 else pre=p； p=p->nexti ｝llelse ｝ //while 本算法是在无序单链表中删除满足某种条件的所有结点，这里的条件是结点的值为x。实际 上，这个条件是可以任意指定的，只要修改if 条件即可。比如，我们要求删除值介于 mink 和 maxk 之间的所有结点，只需将if 语句修改为iE（p->data>mink&&p->data<maxk）。 解法2：采用尾插法建立单链表。用p指针扫描工的所有结点，当其值不为x时，将其链接 到工之后，否则将其释放。 本题代码如下： void Del_X_2 （Linklist &L,ElemType x） ｛ LNode *p=L->next， *r=L，*q； 1/r 指向尾结点，其初值为头结点 while（p！=NULL）｛ 1*p 结点值不为×时将其链接到工尾部 if （p->data！=x） ｛ r->next=p； r=P： //继续扫描 p=p->next； 1/*p 结点值为x时将其释放 else｛ q=p； //继续扫描 p=p->next； 1释放空间 free （q）； ｝//while 1/插入结束后置尾结点指针为 NULI r->next=NULL； 上述两个算法扫描一遍链表，时间复杂度为O（n），空间复杂度为O（1）。","kp":["链表","复杂度分析"]},{"id":"q088","ch":2,"type":"subj","text":"【综合应用题】试编写在带头结点的单链表L中删除一个最小值结点的高效算法（假设该结点唯一）。","answer":"算法思想：用p 从头至尾扫描单链表，pre 指向*p 结点的前驱，用minp 保存值最小的结点 指针（初值为p），minpre 指向*minp 结点的前驱（初值 pre）。一边扫描，一边比较，若 p->data 小于minp->data，则将p、pre 分别赋值给 minp、minpre，如下图所示。当p 扫描完 毕时，minp 指向最小值结点，minpre 指向最小值结点的前驱结点，再将minp 所指结点删除即可。 minpre p minp pre a， 本题代码如下： LinkList Delete_Min （LinkList &L） ｛ LNode *pre=L， *p=pre->next;//p 为工作指针，pre 指向其前驱 LNode *minpre=pre， *minp=p；//保存最小值结点及其前驱 while （p！=NULL）｛ if（p->data<minp->data） ｛ /找到比之前找到的小值结点更小的结点 minpre=pre； ｝ //继续扫描下一个结点 pre=p； p=p->next； minpre->next=minp->next； 1/删除最小值结点 free （minp）； return Li ｝ 算法需要从头至尾扫描链表，时间复杂度为 O（n），空间复杂度为 O（1）。 若本题改为不带头结点的单链表，则实现上会有所不同，请读者自行思考。","kp":["链表","复杂度分析"]},{"id":"q089","ch":2,"type":"subj","text":"【综合应用题】试编写算法将带头结点的单链表就地逆置，所谓\"就地\"是指辅助空间复杂度为 O（1）。","answer":"解法1：将头结点摘下，然后从第一结点开始，依次插入到头结点的后面（头插法建立单链 表），直到最后一个结点为止，这样就实现了链表的逆置，如下图所示。 头插法 本题代码如下： LinkList Reverse_1 （LinkList L） ｛ //p 为工作指针，r为p的后继，以防断链 LNode *p， *ri 1/从第一个元素结点开始 p=L->next； 1/先将头结点工的 next 域置为 NULL L->next=NULL； //依次将元素结点摘下 while （p！=NULL）｛ 1/暂存p 的后继 r=p->nexti 1/将p 结点插入到头结点之后 p->next=L->next； L->next=p； P= ； ｝ return Li 解法2：大部分辅导书都只介绍解法1，这对读者的理解和思维是不利的。为了将调整指针这 个复杂的过程分析清楚，我们借助图形来进行直观的分析。 假设pre、p和r指向三个相邻的结点，如下图所示。假设经过若干操作后，*pre之前的结 点的指针都已调整完毕，它们的next都指向其原前驱结点。现在令*p结点的next域指向*pre结点， 注意到一旦调整指针的指向，*p的后继结点的链就会断开，为此需要用r来指向原*p的后继结点。处 理时需要注意两点：一是在处理第一个结点时，应将其next域置 NUL，而不是指向头结点（因为 它将作为新表的尾结点）；二是在处理完最后一个结点后，需要将头结点的指针指向它。 pre P a； 2027年数据结构考研复习指导 本题代码如下： LinkList Reverse_2 （LinkList L）｛ LNode *pre，*p=L->next，*r=p->next； /处理第一个结点 p->next=NULL； /为空，则说明p 为最后一个结点 while （r！=NULL）｛ //依次继续遍历 pre=p； P=I； = >next； //指针反转 P->next=pre； ｝ //处理最后一个结点 L->next=pi return Li ｝ 上述两个算法的时间复杂度为 O（n），空间复杂度O（1）。","kp":["链表","复杂度分析"]},{"id":"q090","ch":2,"type":"subj","text":"【综合应用题】设在一个带表头结点的单链表中，所有结点的元素值无序，试编写一个函数，删除表中 所有处于给定的两个值（作为函数参数给出）之间的元素（若存在）。","answer":"因为链表是无序的，所以只能逐个结点进行检查，执行删除。 本题代码如下： void RangeDelete （LinkList &L,int min,int max）｛ //p 是检测指针，pr 是其前驱 LNode *pr=L， *p=L->1ink； while （p！=NULL） iE（p->data>min&&p->data<max）｛ //寻找到被删结点，删除 pr->1ink=p->1ink； free （p）； p=pr->link； //杏则继续寻找被删结点 else｛ Pr=p； p=p->1ink； ｝ ｝","kp":["链表"]},{"id":"q091","ch":2,"type":"subj","text":"【综合应用题】给定两个单链表，试分析找出两个链表的公共结点的思想（不用写代码）。","answer":"两个单链表有公共结点，即两个链表从某一结点开始，它们的 next 都指向同一结点。每个单 链表结点只有一个 next 域，因此从第一个公共结点开始，之后的所有结点都是重合的，不可能再 出现分叉。所以两个有公共结点而部分重合的单链表，拓扑形状看起来像 Y，而不可能像X。 本题极容易联想到\"蛮\"方法：在第一个链表上顺序遍历每个结点，每遍历一个结点，在第 二个链表上顺序遍历所有结点，若找到两个相同的结点，则找到了它们的公共结点。显然，该算 法的时间复杂度为 O（lenl•len2）。 接下来我们试着去寻找一个线性时间复杂度的算法。先把问题简化：如何判断两个单链表有 没有公共结点？应注意到这样一个事实：若两个链表有一个公共结点，则该公共结点之后的所有 结点都是重合的，即它们的最后一个结点必然是重合的。因此，我们判断两个链表是不是有重合 的部分时，只需要分别遍历两个链表到最后一个结点。若两个尾结点是一样的，则说明它们有公 共结点，否则两个链表没有公共结点。 然而，在上面的思路中，顺序遍历两个链表到尾结点时，并不能保证在两个链表上同时到达 尾结点。这是因为两个链表长度不一定一样。但假设一个链表比另一个长k个结点，我们先在长 的链表上遍历k个结点，之后再同步遍历，此时我们就能保证同时到达最后一个结点。两个链表 从第一个公共结点开始到链表的尾结点，这一部分是重合的，因此它们肯定也是同时到达第一公 共结点的。于是在遍历中，第一个相同的结点就是第一个公共的结点。 根据这一思路中，我们先要分别遍历两个链表得到它们的长度，并求出两个长度之差。在长 的链表上先遍历长度之差个结点之后，再同步遍历两个链表，直到找到相同的结点，或者一直到 链表结束。此时，该方法的时间复杂度为 O（lenl +len2）。","kp":["链表","复杂度分析"]},{"id":"q092","ch":2,"type":"subj","text":"【综合应用题】设C=｛a1，b1，02，b，\"，Qnb，｝为线性表，采用带头结点的单链表存放，设计一个就地算 法，将其拆分为两个线性表，使得 A=｛al, Q2，\"，an｝，B=1b.\"，b2,b｝。","answer":"算法思想：循环遍历链表C，采用尾插法将一个结点插入表 A，这个结点为奇数号结点，这 样建立的表 A与原来的结点顺序相同；采用插法将下一结点插入表 B，这个结点为偶数号结点， 这样建立的表B 与原来的结点顺序正好相反。 本题代码如下： LinkList DisCreat 2 （LinkList &A） ｛ LinkList B= （LinkList） malloc （sizeof （LNode））；//创建B 表表头 //B表的初始化 B->next=NULL； /p 为工作指针 LNode *p=A->next， *qi //ra 始终指向A 的尾结点 LNode *ra=A； while （p！=NULL） ｛ 1将*p链到A的表尾 ra->next=p； ra=p； p=p->next； iE （p！=NULL）｛ 1头插后，*p 将断链，因此用q记忆*p 的后继 q=p->next； 1/将*p 插入到B的前端 p->next=B->next； B->next=p； P=9； ｝ //A 尾结点的 next 域置空 ra->next=NULL； return B； ｝ 要特别注意的是，该算法采用头插法插入结点后，*p 的指针域已改变，若不设变量保存其 后继结点，则会引起断链，从而导致算法出错。","kp":["链表"]},{"id":"q093","ch":2,"type":"subj","text":"【综合应用题】在一个递增有序的单链表中，存在重复的元素。设计算法删除重复的元素，例如（7, 10， 2027年数据结构考研复习指导 10,21, 30, 42, 42,42, 51,70） 将变为（7,10,21,30,42,51,70）。","answer":"算法思想：题中链表是有序表，因此所有相同值域的结点都是相邻的。用p扫描递增单链表 L，若*p 结点的值域等于其后继结点的值域，则删除后者，否则p 移向下一个结点。 本题代码如下： void Del_Same （LinkList &L）｛ /hp为扫描工作指针 LNode *p=L->next， *qi if （p==NULL） return； while（p->next！=NULL）｛ 1/q 指向*p 的后继结点 q=p->next； if（p->data==g->data）｛ /找到重复值的结点 1/释放*q结点 p->next=g->next； //释放相同元素值的结点 free （q）； else p=p->next； 本算法的时间复杂度O（n），空间复杂度为O（1）。 本题也可采用尾插法，将头结点摘下，然后从第一结点开始，依次与已经插入结点的链表的 最后一个结点比较，若不等则直接插入，否则将当前遍历的结点删除并处理下一个结点，直到最 后一个结点为止。","kp":["插入排序","复杂度分析"]},{"id":"q094","ch":2,"type":"subj","text":"【综合应用题】设A和B是两个单链表（带头结点），其中元素递增有序。设计一个算法从A和B中 的公共元素产生单链表C，要求不破坏A、B的结点。","answer":"2027年数据结构考研复习指导 算法思想：表 A、B 都有序，可从第一个元素起依次比较 A、B 两表的元素，若元素值不等， 则值小的指针往后移，若元素值相等，则创建一个值等于两结点的元素值的新结点，使用尾插法 插入到新的链表中，并将两个原表指针后移一位，直到其中一个链表遍历到表尾。 本题代码如下： void Get_Common （LinkList A, LinkList B） ｛ LNode *p=A->next， *q=B->next， *r， *si LinkList C= （LinkList） malloc（sizeof （LNode））； //建立表C Ir始终指向C的尾结点 r=C； //循环跳出条件 while （p！=NULL&&q！=NULL） ｛ if （p->data<q->data） //若A的当前元素较小，后移指针 p=p->next； else if （p->data>9->data） 1/若B的当前元素较小，后移指针 q=9->nexti //找到公共元素结点 else｛ s= （LNode *） malloc （sizeof （LNode））； 1/复制产生结点*s s->data=p->data； //将*s 链接到C上（尾插法） r->next=S； r=S； /表A 和B 继续向后扫描 p=p->nexti q=q->next； 1/置c尾结点指针为空 r->next=NULL；","kp":["链表"]},{"id":"q095","ch":2,"type":"subj","text":"【综合应用题】已知两个链表 A和B分别表示两个集合，其元素递增排列。编制函数，求A与B的交 集，并存放于A链表中。","answer":"算法思想：采用归并的思想，设置两个工作指针pa 和pb，对两个链表进行归并扫描，只有 同时出现在两集合中的元素才链接到结果表中且仅保留一个，其他的结点全部释放。当一个链表 遍历完毕后，释放另一个表中剩下的全部结点。 本题代码如下： LinkList Union （LinkList &la,LinkList &1b）｛ 1/设工作指针分别为 pa 和 pb LNode *pa=la->next； LNode *pb=1b->next； 1/结果表中当前合并结点的前驱指针 pc LNode *u， *pc=la； while（pa&&pb） ｛ //交集并入结果表中 if（pa->data==pb->data） ｛ //A 中结点链接到结果表 pC->next=pai pc=pa； pa=pa->next； //B 中结点释放 u=pb； pb=pb->next； free（u）； else if（pa->data<pb->data） ｛//若A 中当前结点值小于 B 中当前结点值 u=pa： //后移指针 pa=pa->nexti 1/释放A中当前结点 free（u）； //若B中当前结点值小于 A 中当前结点值 else｛ u=pb； 1后移指针 pb=pb->next； //释放B中当前结点 free （u）； ｝ //while 结束 1/B 已遍历完，A 未完 while （pa）｛ u=pai pa=pa->nexti 1/释放A中剩余结点 free （u）； //A 已遍历完，B 未完 while （pb）｛ u=pb； pb=pb->next； 1/释放B中剩余结点 free （u）； ｝ 1/置结果链表尾指针 NULI pc->next=NULL； //释放B 表的头结点 free（1b）； lai return ｝ 链表归并类型的试题在各学校历年真题中出现的频率很高，故应扎实掌握解决此类问题的思 想。该算法的时间复杂度 O（lenl + len2），空间复杂度为 O（1）。","kp":["链表","复杂度分析"]},{"id":"q096","ch":2,"type":"subj","text":"【综合应用题】两个整数序列A=（41，Q2，0\"，Qmn和B=b，b2、03\"，b，已经存入两个单链表中，设计一 个算法，判断序列 B是否是序列A的连续子序列。","answer":"算法思想：因为两个整数序列已存入两个链表中，操作从两个链表的第一个结点开始，若对 应数据相等，则后移指针；若对应数据不等，则A链表从上次开始比较结点的后继开始，B链表 仍从第一个结点开始比较，直到 B 链表到尾表示匹配成功。A链表到尾而B链表未到尾表示失败。 操作中应记住A链表每次的开始结点，以便下次匹配时好从其后继开始。 本题代码如下： int Pattern（LinkList A,LinkList B） ｛ //p 为A链表的工作指针，本题假定 A 和B 均无头结点 LNode *p=A： Mpre 记住每趟比较中A链表的开始结点 LNode *pre=p； I/q是B链表的工作指针 LNode *q=B； while （p&&g） if（p->data==q->data） ｛//结点值相同 p=p->next； q=q->next； else｛ pre=pre->next； IA 链表新的开始比较结点 p=pre； 1/q从B链表第一个结点开始 q=B； I/B 已经比较结束 if （g==NULL） 1/说明B是A 的子序列 return 1i else I/B 不是A 的子序列 0； return ｝ 注意 该题其实是字符串模式匹配的链式表示形式，读者应该结合字符串模式匹配的内容重新考虑能否优 化该算法。","kp":["串·KMP"]},{"id":"q097","ch":2,"type":"subj","text":"【综合应用题】设计一个算法用于判断带头结点的循环双链表是否对称。","answer":"算法思想：让p从左向右扫描，q从右向左扫描，直到它们指向同一结点（p==q，当循环双链 表中结点个数为奇数时）或相邻（p->next=g 或 q->prior=p，当循环双链表中结点个数为偶数 时）为止，若它们所指结点值相同，则继续进行下去，否则返回0。若比较全部相等，则返回1。 本题代码如下： 2027年数据结构考研复习指导 int Symmetry （DLinkList L）｛ //两头工作指针 DNode *p=L->next，*q=L->prior； //循环跳出条件 while （p！=q&&p->next！=q） 1所指结点值相同则继续比较 if （p->data==g->data） ｛ P=P->next： q=9->priOr； //否则，返回0 else return 0； //比较结束后返回 1 1； return ｝ 注意 while 循环第二个判断条件易误写成 q->next！=P，分析这样会产生什么问题。","kp":["双向链表"]},{"id":"q098","ch":2,"type":"subj","text":"【综合应用题】有两个循环单链表，链表头指针分别为h，和h，编写一个函数将链表 hz链接到链表 h 之后，要求链接后的链表仍保持循环链表形式。","answer":"算法思想：先找到两个链表的尾指针，将第一个链表的尾指针与第二个链表的头结点链接起 来，再使之成为循环的。 本题代码如下： LinkList Link（LinkList &h1,LinkList &h2）｛ 1/将循环链表h2链接到循环链表h1之后，使之仍保持循环链表的形式 1分别指向两个链表的尾结点 LNode *p，*qi p=h1； 1寻找h1 的尾结点 while （p->next！=h1） p=p->next； q=h2； /寻找h2 的尾结点 while （q->next！=h2） q=9->next； //将h2 链接到h1 之后 p->next=h2； 1/令h2 的尾结点指向 h1 9->next=h1； return hl；","kp":["循环链表"]},{"id":"q099","ch":2,"type":"subj","text":"【综合应用题】设有一个带头结点的非循环双链表I，其每个结点中除有 pre、data 和 next 城外， 还有一个访问频度域 freq，其值均初始化为零。每当在链表中进行一次 Locate （L,X） 运算时，令值为×的结点中Ereq 域的值增1，并使此链表中的结点保持按访问频度递 减的顺序排列，且最近访问的结点排在频度相同的结点之前，以便使频繁访问的结点总 是靠近表头。试编写符合上述要求的 Locate （L,x）函数，返回找到结点的地址，类型 为指针型。","answer":"算法思想：首先在双链表中查找数据值为x的结点，查到后，将结点从链表上摘下，然后顺 着结点的前驱链查找该结点的插入位置（频度递减，且排在同频度的第一个，即向前找到第一个 比它的频度大的结点，插入位置为该结点之后），并插入到该位置。 本题代码如下： DLinkList Locate（DLinkList &L,ElemType x） ｛ //p 为工作指针，q为p 的前驱，用于查找插入位置 DNode *p=L->next，*qi while （p&&p->data！=x） //查找值x的结点 p=p->next； if（！p） 1/不存在值为x的结点 exit （0）； else｛ //令元素值为×的结点的 freq 域加 1 p->freq++； if （p->pre==L|Ip->pre->freq>p->freq） //p 是链表首结点，或Ereq 值小于前驱 return pi if（p->next！=NULL） p->next->pre=p->pre； P->pre->next=p->next； //将p 结点从链表上摘下 q=p->pre； while （q！=L&&q->freq<=p->freq） q=q->pre； p->next=g->next； if（q->next！=NULL）q->next->pre=p；//将p 结点排在同频率的第一个 P->pre=gi q->next=p； 1/返回值为x的结点的指针 return pi","kp":["双向链表"]},{"id":"q100","ch":2,"type":"subj","text":"【综合应用题】设将n（n>1）个整数存放到不带头结点的单链表L中，设计算法将L中保存的序列循环 右移k（0<K<n）个位置。例如，若K=1，则将链表｛0， 1,2,3｝变为13,0,1,2｝。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 首先，遍历链表计算表长n，并找到链表的尾结点，将其与首结点相连，得到一个循环单链 表。然后，找到新链表的尾结点，它原链表的第n-k个结点，令工 指向新链表尾结点的下一 个结点，并将环断开，得到新链表。 2）本题代码如下： LNode *Converse （LNode *L,int k）｛ //n 用来保存链表的长度 int n=1； //p 为工作指针 LNode *p=Li 1/计算链表的长度 while （p->next！=NULL）｛ P=P->next； n++； 1/循环执行后，P 指向链表尾结点 //将链表连成一个环 p->next=L； //寻找链表的第n-k个结点 for （int 1=1;i<=n-k;i++） p=p->next； //令工指向新链表尾结点的下一个结点 L=p->next； //将环断开 p->next=NULL； return Li 3）本算法的时间复杂度为 O（n），空间复杂度为 O（1）。","kp":["链表","复杂度分析"]},{"id":"q101","ch":2,"type":"subj","text":"【综合应用题】单链表有环，是指单链表的最后一个结点的指针指向了链表中的某个结点（通常单链表 的最后一个结点的指针域是空的）。试编写算法判断单链表是否存在环。 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 设置快慢两个指针分别为fast和slow最初都指向链表头head。s1ow每次走一步，即 s1ow=31ow->next; fast每次走两步，即fast=fast->next->next。 fast比s1ow走得快， 若有环，则fast一定先进入环，而s1ow后进入环。两个指针都进入环后，经过若干操作后两个 指针定能在环上相遇。这样就可以判断一个链表是否有环。 如下图所示，当s1ow刚进入环时，fast早已进入环。因为fast每次比slow多走一步且fast 与s1ow的距离小于环的长度，所以East与s1ow相遇时，s10w所走的距离不超过环的长度。 head Slow afast 如下图所示，设头结点到环的入口点的距离为a，环的入口点沿着环的方向到相遇点的距离 为x，环长为r，相遇时 fast 绕过了n 圈。 a 2027年数据结构考研复习指导 则有 2（a+x）=atn*r+x，即 a=nr-x。显然从头结点到环的入口点的距离等于n 倍的环长 减去环的入口点到相遇点的距离。因此可设置两个指针，一个指向 head，另一个指向相遇点， 两个指针同步移动（均为一次走一步），相遇点即环的入口点。 2）本题代码如下： LNode* FindLoopStart （LNode *head） ｛ //设置快慢两个指针 LNode *fast=head， *slow=head； while （fast！=NULL&&fast->next！=NULL）｛ 1/每次走一步 slow=S1ow->next； //每次走两步 fast=fast->next->next； //相遇 if（slow==fast） break； if （fast==NULL||fast->next==NULL） 1/没有环，返回 NULI return NULL； 11分别指向开始点、相遇点 LNode *pl=head， *p2=slow； while （p1！=p2）｛ p1=p1->next； p2=p2->next； //返回入口点 return pl； 3） 当East 与slow 相遇时，s1ow 肯定没有遍历完链表，故算法的时间复杂度O（n），空 间复杂度为 O（1）。","kp":["链表","复杂度分析"]},{"id":"q102","ch":2,"type":"subj","text":"【综合应用题】设有一个长度n（n 为偶数）的不带头结点的单链表，且结点值都大于O，设计算法求这 个单链表的最大李生和。李生和定义为一个结点值与其孪生结点值之和，对于第i个结 点（从0开始），其孪生结点为第n-1-1个结点。要求： 1） 给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你的算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： 设置快、慢两个指针分别为 fast 和 s1ow，初始时 s1ow 指向工（第一个结点），fast 指向 L->next（第二个结点），之后s1ow 每次走一步，fast 每次走两步。当 fast 指向表尾（第n 个结点）时，s1ow 正好指向链表的中间点（第n/2 个结点），即s1ow 正好指向链表前半部分的 最后一个结点。将链表的后半部分逆置，然后设置两个指针分别指向链表前半部分和后半部分的首 结点，在遍历过程中计算两个指针所指结点的元素之和，并维护最大值。 2）本题代码如下： int PairSum （LinkList L）｛ LNode *fast=L->next，*s1ow=L;//利用快慢双指针找到链表的中间点 while （fast！=NULL&&fast->next！=NULL）｛ fast=fast->next->next； //快指针每次走两步 //慢指针每次走一步 slow=slow->next； LNode *newHead=NULL，*p=slow->next，*tmp； //反转链表后一半部分的元素，采用头插法 while （p！=NULL）｛ //p 指向当前待插入结点，令tmp 指向其下一结点 tmp=p->next； 1/将p所指结点插入到新链表的首结点之前 p->next=newHead； //newHead 指向刚才新插入的结点，作为新的首结点 newHead=p； //当前待处理结点变为下一结点 p=tmp； ｝ int mx=0;p=L； LNode *q=newHead； 1用p和q分别遍历两个链表 while（q！=NULL）｛ if（（p->data+q->data）>mx）//用mx记录最大值 mx=p ->data+q->data； p=p->next； q=q->next； ｝ return mx； ｝ 3）本算法的时间复杂度O（n），空间复杂度 O（1）。","kp":["链表","复杂度分析"]},{"id":"q103","ch":2,"type":"subj","text":"【综合应用题】【2009统考真题】已知一个带有表头结点的单链表，结点结构为 data link 假设该链表只给出了头指针 1ist。在不改变链表的前提下，请设计一个尽可能高效的 算法，查找链表中倒数第K个位置上的结点（K正整数）。若查找成功，算法输出该 结点的 data 域的值，并返回 1；否则，只返回0。要求： 1）描述算法的基本设计思想。 2）描述算法的详细实现步骤。 3）根据设计思想和实现步骤，采用程序设计语言描述算法（使用C、C++或 Java 语言 实现），关键之处请给出简要注释。","answer":"1）算法的基本设计思想： 问题的关键是设计一个尽可能高效的算法，通过链表的一次遍历，找到倒数第k个结点的位 置。定义两个指针变量P 和q，初始时均指向头结点的下一个结点（链表的第一个结点），P指 针沿链表移动；当P 指针移动到第k个结点时，q指针开始与P指针同步移动；当P指针移动到 最后一个结点时，q指针所指示结点为倒数第k个结点。以上过程对链表仅进行一遍扫描。 2）算法的详细实现步骤如下： ① count=0，P 和q指向链表表头结点的下一个结点。 ② 若p为空，转⑤。 ③ 若count 等于k，则q指向下一个结点；否则，count=count+1。 ④ p指向下一个结点，转②。 ⑤ 若count 等于k，则查找成功，输出该结点的data 域的值，返回1；否则，说明k值 超过了线性表的长度，查找失败，返回0。 ⑥ 算法结束。 3）算法实现如下： 1/链表数据的类型定义 typedef int ElemType； //链表结点的结构定义 typedef struct LNode｛ //结点数据 ElemType data； //结点链接指针 struct LNode *link； ｝LNode，*LinkList； int Search_k（LinkList list,int k） ｛ LNode *p=list->1ink，*q=list->1ink;//指针p、q指示第一个结点 int count=0； //遍历链表直到最后一个结点 while （p！=NULL）｛ 1计数，若 count<k只移动p if（count<k） count++； else q=q->1ink； 1/之后让p、q同步移动 p=p->link； ｝//while if （count<k） 1/查找失败返回o return O； //杏则打印并返回1 else｛ printf（\"%d\"，q->data）； return 1； 评分说明 若所给算法采用一遍扫描方式就能得到正确结果，则可给满分15分；若采用两遍或多遍扫描才能得到 正确结果，则最高分为10分。若采用递归算法得到正确结果，则最高给 10分；若实现算法的空间复杂度 过高（使用了大小与k有关的辅助数组），但结果正确，则最高给10分。","kp":["链表","复杂度分析"]},{"id":"q104","ch":4,"type":"subj","text":"【综合应用题】【2012统考真题】假定采用带头结点的单链表保存单词，当两个单词有相同的后缀时， 可共享相同的后缀存储空间，例如，loading 和being 的存储映像如下图所示。 strly ＄1-27-0-0-0 stzzy 路~0D-el P 设str1 和str2分别指向两个单词所在单链表的头结点，链表结点结构力 datanext， 请设计一个时间上尽可能高效的算法，找出由strl 和str2所指向两个链表共同后缀 的起始位置（如图中字符i所在结点的位置P）。要求： 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++或Java语言描述算法，关键之处给出注释。 3）说明你所设计算法的时间复杂度。","answer":"顺序遍历两个链表到尾结点时，并不能保证两个链表同时到达尾结点。这是因为两个链表的 长度不同。假设一个链表比另一个链表长k个结点，我们先在长链表上遍历k个结点，之后同步 遍历两个链表，这样就能够保证它们同时到达最后一个结点。因为两个链表从第一个公共结点到 2027年数据结构考研复习指导 链表的尾结点都是重合的，所以它们肯定同时到达第一个公共结点。 1）算法的基本设计思想： ① 分别求出 str1 和 str2所指的两个链表的长度m和n。 ② 将两个链表以表尾对齐：令指针 P、q分别指向 str1 和 str2的头结点，若m≥n，则 指针P 先走，使p 指向链表中的第m-n+1个结点；若m ＜n，则使q指向链表中的第 n-m+1个结点，即使指针p 和q所指的结点到表尾的长度相等。 ③ 反复将指针p 和q同步向后移动，并判断它们是否指向同一结点。当p、q指向同一结 点，则该点即所求的共同后缀的起始地址。 2）本题代码如下： typedef struct Node｛ Char datai struct Node *next； ｝ SNode； /*求链表长度的函数*/ int listlen （SNode *head）｛ int len=0； while （head->next！=NULL）｛ len++； head=head->next； return len； /*找出共同后缀的起始地址*/ SNode* find_list （SNode *str1, SNode *str2） ｛ int m,n： SNode *p，*gi 1求 str1 的长度，0（m） m=listlen （str1）； /I求 str2 的长度，O（n） n=listlen （str2）； 1/若m>n，使p 指向链表中的第m-n+1 个结点 for （p=str1;m>n;m--） p=p->next； 1/若m<n，使q指向链表中的第 n-m+1 个结点 for （q=str2;m<n;n--） q=q->next； while（p->next！=NULL&&p->next！=q->next）｛ //查找共同后缀的起始地址 /两个指针同步向后移动 p=p->next； q=9->next； ｝ //返回共同后缀的起始地址 return p->next； 3）时间复杂度 O（lenl +len2）或 O（max（lenl,len2）），其中lenl、len2分别为两个链表的长度。","kp":["链表","复杂度分析"]},{"id":"q105","ch":2,"type":"subj","text":"【综合应用题】【2015统考真题】用单链表保存m个整数，结点的结构为Idata］［1ink］，且ldatal≤ n（n为正整数）。现要求设计一个时间上尽可能高效的算法，对于链表中 data 的绝对 值相等的结点，仅保留第一次出现的结点而删除其余绝对值相等的结点。例如，若给定 的单链表 head 如下： head 则删除结点后的 head 为 head 要求： 1）给出算法的基本设计思想。 2）使用C或C++语言，给出单链表结点的数据类型定义。 3） 根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 4）说明你所设计算法的时间复杂度和空间复杂度。","answer":"1）算法的基本设计思想： • 算法的核心思想是用空间换时间。使用辅助数组记录链表中己出现的数值，从而只需对链 表进行一趟扫描。 •因为Idata|≤n，故辅助数组q的大小n+1，各元素的初值均为0。依次扫描链表中 的各结点，同时检查q［ldatal］的值，若为0则保留该结点，并令q［ldata|］=1；否 则将该结点从链表中删除。 2）使用C语言描述的单链表结点的数据类型定义： typedef struct node｛ int data； *link； struct node ｝ NODE； Typedef NODE *PNODE； 3）算法实现如下： void func （PNODE h,int n）｛ PNODE p=h,ri int *q,m； q= （int *）malloc（sizeof （int）*（n+1））；//申请n+1个位置的辅助空间 //数组元素初值置0 for （int i=0;i<n+l;i++） * （q+i）=0； while （p->link！=NULL）｛ m=p->1ink->data>0? p->link->data：-p->link->data； //判断该结点的 data 是否已出现过 if（* （q+m）==0）｛ //首次出现 * （qtm） =1； //保留 p=p->link； //重复出现 else｛ 1/刪除 r=p->link； p->link=r->1ink； free（r）； ｝ Free （q）； ｝ 4）参考答案所给算法的时间复杂度为O（m），空间复杂度O（n）。","kp":["链表","复杂度分析"]},{"id":"q106","ch":2,"type":"subj","text":"【综合应用题】【2019统考真题】设线性表L=（a，Q，Q，，Q，-2,Q-1Q，）采用带头结点的单链表保存， 链表中的结点定义如下： typedef struct node int data； struct node *next； ｝NODE； 请设计一个空间复杂度为 O（1）且时间上尽可能高效的算法，重新排列L中的各结点，得 1）给出算法的基本设计思想。 2）根据设计思想，采用C或C++语言描述算法，关键之处给出注释。 3）说明你所设计的算法的时间复杂度。","answer":"1）算法的基本设计思想： 个元素，再摘取倒数第一个元素⋯⋯依次合并而成的。为了方便链表后半段取元素，需要先将L 后半段原地逆置［题目要求空间复杂度为O（1），不能借助栈］，否则每取最后一个结点都需要遍 历一次链表。① 先找出链表L的中间结点，为此设置两个指针p和q，指针p每次走一步，指针q 每次走两步，当指针q到达链尾时，指针p正好在链表的中间结点：② 然后将L的后半段结点原地 逆置。③ 从单链表前后两段中依次各取一个结点，按要求重排。 2）算法实现如下： void change list （NODE*h）｛ NODE *p， *q， *r，*si p=g=h； //寻找中间结点 while（q->next！=NULL）｛ //p 走一步 p=p->next； q=q->next；； if（g->next！=NULL）q=q->next; //q 走两步 ｝ //p 所指结点为中间结点，q为后半段链表的首结点 q=p->next； p->next=NULL； //将链表后半段逆置 while（q！=NULL）｛ r=9->next； q->next=p->next； p->next=g； 9=工； //s 指向前半段的第一个数据结点，即插入点 s=h->next； //q 指向后半段的第一个数据结点 q=p->next； p->next=NULL； //将链表后半段的结点插入到指定位置 while（q！=NULL）｛ 2027年数据结构考研复习指导 //r 指向后半段的下一个结点 r=9 >next； q->next=s->next；//将 q所指结点插入到s所指结点之后 s->next=g； 1/s 指向前半段的下一个插入点 s=9->next： C=工； ｝ 3）第一步找中间结点的时间复杂度为 O（n），第二步逆置的时间复杂度为 O（n），第三步合并 链表的时间复杂度为 O（n），所以该算法的时间复杂度为 O（n）。 归纳总结 本章是算法设计题的重点考查内容。线性表相关的算法题通常代码量较小，却蕴含一定的设 计技巧，非常适合用于笔试考查。此类题目常采用\"三段式\"结构命题。 在给出题目背景和具体要求的前提下： ① 给出算法的基本设计思想。 ② 采用C或C++语言描述算法，关键之处给出注释。 ③ 分析所设计算法的时间复杂度和空间复杂度。 算法具体的设计思路灵活多变，难以一概而论。因此读者务必勤加练习，反复研读本章的典 型例题，尝试用多种方法求解，并对比其时间与空间效率，从而逐步掌握各类题型的分析视角与 最优解法。为此，编者整理了几种常用的算法设计技巧，供参考：针对链表，常用方法包括头插 法、尾插法、逆置法、归并法、双指针法等，需根据具体问题灵活运用；针对顺序表，因其支持 随机访问，常结合经典排序与查找策略进行设计，如归并排序、二分查找等。 注意 在算法设计题中，若能正确定义数据结构并清晰阐述算法思想，通常可获得至少一半的分数；若能 进一步用规范代码实现，则得分更有保障；逻辑较复杂的部分可直接用文字说明，确保思路完整。 思维拓展 一个长度为n 的整型数组 A［L.n，给定整数x，设计一个时间复杂度不超过O（nlogzn）的算 法，查找出这个数组中所有两两之和等于×的整数对（每个元素只输出一次）。 提示：本题若想到排序，则问题便迎刃而解。先用一种时间复杂度为O（nlogzn）的排序算法将 A［1..n］从小到大排序，然后分别从数组的小端（1=1）和大端（ =n）开始查找：若A［立］+A［j］<X， 之++；若A［1］+AIj］>X， --；否则输出A…（完整解答见原库 PDF）","kp":["折半查找","复杂度分析"]},{"id":"q107","ch":3,"type":"subj","text":"【综合应用题】有5个元素，其入栈次序为 A,B, C,D,E，在各种可能的出栈次序中，第一个出栈元素 为C且第二个出栈元素为D的出栈序列有哪几个？","answer":"CD 出栈后的状态如右图所示。 E N1DC 此时有如下3种操作：①E入栈后出栈，出栈序列为CDEBA；② B出栈，E B 入栈后出栈，出栈序列为 CDBEA；③ B出栈，A出栈，E入栈后出栈，出栈序列 A 为 CDBAE。 所以，以CD开头的出栈序列有 CDEBA、CDBEA、CDBAE 三种。","kp":["栈"]},{"id":"q108","ch":3,"type":"subj","text":"【综合应用题】若元素的入栈序列为 A,B, C,D,E，运用栈操作，能否得到出栈序列 B,C,A,E,D和D,B， A,C,E？为什么？","answer":"能得到出栈序列 BCAED。可由4入，B入，B出，C入，C出，4出，D入，E入，E出， D 出得到。不能得到出栈序列 DBACE。若出栈序列以D开头，说明在D之前的入找元素是A、B 和C，三个元素中C是栈顶元素，B和A 不可能早于C出栈，所以不可能得到出栈序列 DBACE。","kp":["栈"]},{"id":"q109","ch":3,"type":"subj","text":"【综合应用题】栈的初态和终态均为空，以1和O分别表示入栈和出栈，则出入栈的操作序列可表 示为由I和O组成的序列，可以操作的序列称为合法序列，否则称为非法序列。 1）下面所示的序列中哪些是合法的？ A. IOIIOIOO B. 1001OIIO C. 1IO1OIO D. 1I00100 2）通过对 1）的分析，写出一个算法，判定所给的操作序列是否合法。若合法，返回 true，否则返回false（假定被判定的操作序列已存入一维数组中）。","answer":"1）选项A、D合法，而选项B、C不合法。在B中，先入栈1次，再连续出栈2次，错误。 在选项C中，入栈和出栈次数不一致，会导致最终的栈不空。选项A、D均为合法序列，请自行 模拟。注意，在操作过程中，入栈次数一定大于或等于出栈次数；结束时，栈一定为空。 2）设被判定的操作序列已存入一维数组A 中。算法的基本设计思想：依次逐一扫描入栈出 栈序列（由1和O组成的字符串），每扫描至任意一个位置均需检查出栈次数（O的个数）是否 2027年数据结构考研复习指导 小于入栈次数（I的个数），若大于则为非法序列。扫描结束后，再判断入栈和出栈次数是否相 等，若不相等则不合题意，为非法序列。 本题代码如下： bool Judge （char Al ］）｛ int 1=0； 1/ 为下标，j和k分别为字母1和O的个数 int j=k=0； /I未到字符数组尾 while （A［i］！=110'）｛ switch （A［i］）｛ 'I'：j++；break; II入栈次数增1 Case 'O'：k++； case if（k>j） ｛printf（\"序列非法\\n\"）；exit （0）；｝ ｝ 1I不论A［i］是1还是O，指针主均后移 1++； iE（j！=k）｛ printf（\"序列非法\\n\"）； return falsei else｛ printf（\"序列合法\\n\"）； return true； 【另解】入找后，栈内元素个数加1；出栈后，栈内元素个数减1，因此可将判定一组出入栈 序列是否合法转化为一组由+1、-1组成的序列，它的任意前缀子序列的累加和不小于0（每次出 栈或入栈操作后判断）则合法：否则非法。","kp":["栈"]},{"id":"q110","ch":3,"type":"subj","text":"【综合应用题】设单链表的表头指针为L，结点结构由data和next两个域构成，其中data域为字符型。 设计算法判断该链表的全部n个字符是否中心对称。例如，xyX、xYYx都是中心对称的。","answer":"算法思想：使用栈来判断链表中的数据是否中心对称。让链表的前一半元素依次入栈。在处 理链表的后一半元素时，当访问到链表的一个元素后，就从栈中弹出一个元素，对两个元素进行 比较，若相等，则将链表中的下一个元素与栈中再弹出的元素进行比较，直至链表到尾。这时若 栈是空栈，则得出链表中心对称的结论；否则，当链表中的一个元素与栈中弹出元素不等时，结 论为链表非中心对称，结束算法的执行。 本题代码如下： int dc （LinkList L,int n）｛ int i； Is字符栈 char s［n/2］； /工作指针p，指向待处理的当前元素 LNode *p=L->next； //链表前一半元素入栈 for （i=0;i<n/2;i++）｛ s［il=p->datai p=p->next； ｝ //恢复最后的i值 1/若n 是奇数，后移过中心结点 if（n%2==1） p=p->next； while（p！=NULL&&s ［i］==p->data） ｛ //检测是否中心对称 1/充当栈顶指针 p=p->next； 1/栈 空栈 i£ （i==-1） //链表中心对称 return 1； else //链表中心不对称 returnO； ｝ 算法先将\"链表的前一半\"元素（字符）入栈。当n 为偶数时，前一半和后一半的个数相同； 当n为奇数时，链表中心结点字符不必比较，移动链表指针到下一字符开始比较。比较过程中遇 到不相等时，立即退出while 循环，不再进行比较。 本题也可以先将单链表中的元素全部入栈，然后扫描单链表工 并比较，直到比较到单链表工 尾为止，但算法需要两次扫描单链表L，效率不及上述算法高。","kp":["栈"]},{"id":"q111","ch":3,"type":"subj","text":"【综合应用题】设有两个栈S1、S2都采用顺序栈方式，并共享一个存储区［0.，maxsize-1］，为了 尽量利用空间，减少溢出的可能，可采用栈顶相向、迎面增长的存储方式。试设计S1、 S2 有关入栈和出栈的操作算法。","answer":"两个栈共享向量空间，将两个栈的栈底设在向量两端，初始时，S1 栈顶指针为-1，S2栈顶指 针为 maxsize。两个栈顶指针相邻时为栈满。两个栈顶相向、迎面增长，栈顶指针指向栈顶元素。 本题代码如下： //两个栈共享顺序存储空间所能达到的最多元素数， #define maxsize 1/初始化为 100 //假设元素类型为整型 #define elemtp int typedef struct｛ //栈空间 elemtp stack ［maxsizel ； /top 为两个栈顶指针 int top ［2］i ｝stk； 1/s 是如上定义的结构类型变量，为全局变量 stk si 本题的关键在于，两个栈入栈和出栈时的栈顶指针的计算。S1栈是通常意义下的栈；而s2 栈入栈操作时，其栈顶指针左移（减1），出栈时，栈顶指针右移（加1）。 此外，对于所有栈的操作，都要注意\"入栈判满、出栈判空\"的检查。 （1）入栈操作 代码如下： int Push（int i, elemtp x）｛ 1入栈操作。i为栈号，1=0表示左边的S1栈，1=1 表示右边的s2栈，x是入栈元素 1入栈成功返回 1，否则返回0 printf（\"栈号输入不对\"）； ｝ if（s.top［1］-8.top［0］==1）｛ printf（\"栈已满\\n\"）； return 0； switch （i）｛ case 0: s.stack［++s.top［0］］=x; return 1;break； case 1: s.stack［--s.top［1］］=x; return （2） 出栈操作 代码如下： elemtp Pop （int i）｛ 1/出栈算法。i代表栈号，i=0时为S1栈，i=1 时为S2栈 //出栈成功返回出栈元素，否则返回-1 iE（i<011i>1）｛ printf（\"栈号输入错误\\n\"）； exit （0）； switch （i）｛ case 0： if（s.top［0］==-1）｛ 2027年数据结构考研复习指导 printf（\"栈空\\n\"）； return -1； else return s.stack［s.top ［0］--］； break； case 1： if（s.top［1］==maxsize）｛ printf（\"栈空\\n\"）； return -1； else return s.stack［s.top ［1］++］； breaki ｝//switch ｝ 队列 3.2","kp":["队列"]},{"id":"q112","ch":3,"type":"choice","text":"栈和队列的主要区别在于（）","opts":[{"k":"A","t":"它们的逻辑结构不一样"},{"k":"B","t":"它们的存储结构不一样"},{"k":"C","t":"所包含的元素不一样"},{"k":"D","t":"插入、删除操作的限定不一样"}],"correct":["D"],"exp":"解析：栈和队列的逻辑结构都是线性结构，都可以采用顺序存储或链式存储，选项A和B错误， 第3章栈、队列和数组 85 选项C显然也错误。只有选项D 才是栈和队列的本质区别，限定表中插入和删除操作位置的不同。","kp":["队列"]},{"id":"q113","ch":3,"type":"choice","text":"队列的\"先进先出\"特性是指（） I. 最后插入队列中的元素总是最后被删除 I.当同时进行插入、删除操作时，总是插入操作优先 IL.每当有删除操作时，总要先做一次插入操作 IV. 每次从队列中删除的总是最早插入的元素","opts":[{"k":"A","t":"I"},{"k":"B","t":"I和IV"},{"k":"C","t":"II和III"},{"k":"D","t":"IV"}],"correct":["B"],"exp":"解析：队列\"先进先出\"的特性表现在：先入队列的元素先出队列，后入队列的元素后出队列，入 队对应的是插入操作，出队对应的是删除操作。说法I和 IV 均正确。","kp":["队列"]},{"id":"q114","ch":3,"type":"choice","text":"允许对队列进行的操作有（）","opts":[{"k":"A","t":"对队列中的元素排序"},{"k":"B","t":"取出最近进队的元素"},{"k":"C","t":"在队列元素之间插入元素"},{"k":"D","t":"删除队首元素"}],"correct":["D"],"exp":"解析：删除队首元素即出队，是队列的基本操作之一，所以选择选项D。","kp":["队列"]},{"id":"q115","ch":3,"type":"choice","text":"一个队列的入队顺序是1,2,3，4，则出队的输出顺序是（）","opts":[{"k":"A","t":"4,3,2,1"},{"k":"B","t":"1,2,3,4"},{"k":"C","t":"1,4,3,2"},{"k":"D","t":"3,2,4,1"}],"correct":["B"],"exp":"解析：队列的入队顺序和出队顺序是一致的，这是和栈不同的。","kp":["队列"]},{"id":"q116","ch":3,"type":"choice","text":"循环队列存储在数组 A［O..n］中，入队时的操作为（）","opts":[{"k":"A","t":"rear = rear +1"},{"k":"B","t":"rear =（rear+ 1） mod（n-1）"},{"k":"C","t":"rear = （rear+ 1） mod n"},{"k":"D","t":"rear= （rear+ 1） mod（n+1）"}],"correct":["D"],"exp":"解析：数组下标范围为0～n，因此数组容量为n+1。循环队列中元素入队的操作是 rear=（rear+1） mod maxsize，题中 maxsize=n+1。因此入队操作应为 rear=（rear+1）mod （n+1）。","kp":["循环队列"]},{"id":"q117","ch":3,"type":"choice","text":"己知循环队列的存储空间为数组 A［21］，front指向队首元素的前一个位置，rear 指向队尾元素，假 设当前 front 和 rear 的值分别为8和3，则该队列的长度力（）","opts":[{"k":"A","t":"5"},{"k":"B","t":"6"},{"k":"C","t":"16"},{"k":"D","t":"17"}],"correct":["C"],"exp":"解析：队列的长度为（rear-front+maxsize） 8maxsize=（rear-front+21）821=16。这种情 况和 front 指向当前元素，rear 指向队尾元素的下一个元素的计算是相同的。 注意 数组A［n］的下标范围为0~n-1。若写成 A［O..n］，则说明下标范围为0~n。","kp":["循环队列"]},{"id":"q118","ch":3,"type":"choice","text":"若用数组A［0..5］ 来实现循环队列，且当前 rear 和 front 的值分别为1和5，当从队列中删除一 个元素，再加入两个元素后，rear 和 front 的值分别为（）","opts":[{"k":"A","t":"3和4"},{"k":"B","t":"3 和0"},{"k":"C","t":"5和0"},{"k":"D","t":"5和1"}],"correct":["B"],"exp":"解析：循环队列中，每删除一个元素，队首指针 front=（front+1）86，每插入一个元素，队尾 指针 rear=（rear+1） 86。上述操作后，front=0，rear=3。","kp":["循环队列"]},{"id":"q119","ch":3,"type":"choice","text":"假设用数组 QIMaxsize］实现循环队列，队首指针 front 指向队音元素的前一位置，队尾指针rear 指向队尾元素，则判断该队列为空的条件是（）","opts":[{"k":"A","t":"Q.rear == （Q.front+ 1） % MaxSize"},{"k":"B","t":"（Q.rear+ 1） % MaxSize == Q.front+1"},{"k":"C","t":"（Q.rear+ 1） % Maxsize == Q.front"},{"k":"D","t":"Q.rear == Q.front"}],"correct":["D"],"exp":"解析：当队列中只有一个元素时，front 指向该元素的前一个位置，rear 指向该元素，因此当队 列为空时，队首指针等于队尾指针，这样第一个元素入队后，才能符合题目要求。","kp":["循环队列"]},{"id":"q120","ch":3,"type":"choice","text":"假设循环队列 Q［MaxSize］ 的队首指针为 front，队尾指针为rear，队列的最大容量为 MaxSize，此 外，该队列再没有其他数据成员，则判断该队列已满的条件是（）","opts":[{"k":"A","t":"Q.front == Q.rear"},{"k":"B","t":"Q.front + Q.rear >= MaxSize"},{"k":"C","t":"Q.front == （Q.rear+1 %o MaxSize"},{"k":"D","t":"Q.rear= （Q.front+ 1） % MaxSize"}],"correct":["C"],"exp":"解析：既然不能附加任何其他数据成员，只能采用牺牲一个存储单元的方法来区分是队空还是队 满，约定以\"队列头指针在队尾指针的下一位置作为队满的标志\"，因此选择选项C。选项A是 判断队列是否空的条件，选项B和D都是干扰项。 注意 对于这类具体问题，举一些特例判断往往比直接思考问题能更快得到答案。","kp":["循环队列"]},{"id":"q121","ch":3,"type":"choice","text":"假设用A［O.n|实现循环队列，front、rear 分别指向队首元素的前一个位置和队尾元素。若用 （rear+ 1） % （n+ 1） == front 作为队满标志，则（）","opts":[{"k":"A","t":"可用 front==rear 作队空标志"},{"k":"B","t":"队列中最多可有n+1 个元素"},{"k":"C","t":"可用 front >rear 作为队空标志"},{"k":"D","t":"可用 （front+ 1） % （n+1） == rear 作为队空标志"}],"correct":["A"],"exp":"解析：若用（rear+1）8（n+1）==front 作为队满标志，则说明题目采用了牺牲一个存储单元的方 法来区分队空和队满，因此可用 Eront==rear 作为队空标志。","kp":["循环队列"]},{"id":"q122","ch":3,"type":"choice","text":"S】 与顺序队列相比，链式队列（）","opts":[{"k":"A","t":"优点是队列的长度不受限制"},{"k":"B","t":"优点是进队和出队时间效率更高"},{"k":"C","t":"缺点是不能进行顺序访问"},{"k":"D","t":"缺点是不能根据队首指针和队尾指针计算队列的长度"}],"correct":["D"],"exp":"解析：虽然链式队列采用动态分配方式，但其长度也受内存空间的限制，不能无限制增长。顺序队 列和链式队列的入队和出队时间复杂度均为O（1）。顺序队列和链式队列都可以进行顺序访问。对 于顺序队列，可通过队首指针和队尾指针计算队列中的元素个数，而链式队列则不能。","kp":["队列","复杂度分析"]},{"id":"q123","ch":3,"type":"choice","text":"下列描述的几种链表中，最适合用作队列的是（）","opts":[{"k":"A","t":"带队首指针和队尾指针的循环单链表"},{"k":"B","t":"带队首指针和队尾指针的非循环单链表"},{"k":"C","t":"只带队首指针的非循环单链表"},{"k":"D","t":"只带队首指针的循环单链表"}],"correct":["B"],"exp":"解析：因为队列需在双端进行操作，所以选项C和D 的链表显然不太适合链队。对于选项 A，链 表在完成入队和出队后还要修改为循环的，对于队列来讲这是多余的（画蛇添足）。对于选项B， 86 2027年数据结构考研复习指导 因为有首指针，所以适合删除首结点；因为有队尾指针，所以适合在其后插入结点。","kp":["队列"]},{"id":"q124","ch":3,"type":"choice","text":"下列描述的几种链表中，最不适合用作链式队列的是（）","opts":[{"k":"A","t":"只带队首指针的非循环双链表"},{"k":"B","t":"只带队首指针的循环双链表"},{"k":"C","t":"只带队尾指针的循环双链表"},{"k":"D","t":"只带队尾指针的循环单链表"}],"correct":["A"],"exp":"解析：因为非循环双链表只带队首指针，所以在执行入队操作时需要修改队尾结点的指针域，而查 找队尾结点需要O（n）的时间。选项B、C和D均可在 O（1）的时间内找到队首和队尾。","kp":["队列"]},{"id":"q125","ch":3,"type":"choice","text":"在用单链表实现队列时，队首设在链表的（）位置。","opts":[{"k":"A","t":"链头"},{"k":"B","t":"链尾"},{"k":"C","t":"链中"},{"k":"D","t":"以上都可以"}],"correct":["A"],"exp":"解析：因为在队头做出队操作，为便于删除队首元素，所以总是选择链头作为队头。","kp":["队列"]},{"id":"q126","ch":3,"type":"choice","text":"用链式存储方式的队列进行删除操作时需要（）","opts":[{"k":"A","t":"仅修改头指针"},{"k":"B","t":"仅修改尾指针"},{"k":"C","t":"头尾指针都要修改"},{"k":"D","t":"头尾指针可能都要修改"}],"correct":["D"],"exp":"解析：队列采用链式存储时，删除元素要从表头删除，通常仅需修改头指针，但若队列中仅有一个 元素，则队尾指针也需要被修改，仅有一个元素时，删除后队列空，需要修改队尾指针为 rear=fronto","kp":["队列"]},{"id":"q127","ch":3,"type":"choice","text":"在一个链队列中，假设队首指针为 front，队尾指针为rear,x 所指向的元素需要入队，则需要执行 的操作为（）","opts":[{"k":"A","t":"front = X, front = front->next"},{"k":"B","t":"X-> next = front->next, front =X"},{"k":"C","t":"rear- > next =X, rear=X"},{"k":"D","t":"rear- > next = X,X->next= NULL,rear=x"}],"correct":["D"],"exp":"解析：插入操作时，先将结点x插入到链表尾部，再让 rear 指向这个结点x。选项C的做法不够 严密，因为是队尾，所以队尾 x->next 必须置为空。","kp":["队列"]},{"id":"q128","ch":3,"type":"choice","text":"假设循环单链表表示的队列长度为n，队首固定在链表尾，若只设头指针，则进队操作的时间复 杂度（）","opts":[{"k":"A","t":"0（n）"},{"k":"B","t":"O（1）"},{"k":"C","t":"0（n2）"},{"k":"D","t":"O（nlogzn）"}],"correct":["A"],"exp":"解析：依题意，入队操作是在队尾进行，即链表表头。题中己明确说明链表只设头指针，即没有头 结点和尾指针，入队后，循环单链表必须保持循环的性质，在只带头指针的循环单链表中寻找表 尾结点的时间复杂度为 O（n），所以入队的时间复杂度为 O（n）。","kp":["队列","复杂度分析"]},{"id":"q129","ch":3,"type":"choice","text":"假设输入序列为1,2,3，4,5，利用两个队列进行出入队操作，不可能输出的序列是（）","opts":[{"k":"A","t":"1,2,3,4,5"},{"k":"B","t":"5,2,3,4,1"},{"k":"C","t":"1,3,2,4,5"},{"k":"D","t":"4, 1,5,2,3"}],"correct":["B"],"exp":"解析：此类题可对各选项进行模拟，假设队列为Q，和Q2。对于选项 A，元素依次入队Q，然后依次 出队。对于选项B，5最先出队，只可能是1,2,3，4入队Q1，5入队Q，然后5出队，只能得到5，1， 2,3,4。对于选项C，1,2,5入队Q，3,4入队Qz，然后按要求出队。选项D 的分析同选项C。","kp":["队列"]},{"id":"q130","ch":3,"type":"choice","text":"若以1,2,3，4作为双端队列的输入序列，则既不能由输入受限的双端队列得到，又不能由输出受 限的双端队列得到的输出序列是（）","opts":[{"k":"A","t":"1,2,3,4"},{"k":"B","t":"4, 1,3,2"},{"k":"C","t":"4,2,3,1"},{"k":"D","t":"4,2,1,3"}],"correct":["C"],"exp":"解析：使用排除法。先看可由输入受限的双端队列产生的序列：设右端输入受限，1,2，3，4依次左 入，则依次左出可得4，3，2， 1，排除选项A；左出、右出、左出、左出可得到4，1,3，2，排除选 项B；再看可由输出受限的双端队列产生的序列：设右端输出受限，1,2，3，4依次左入、左入、 右入、左入，依次左出可得到 4，2,1,3，排除选项D。","kp":["双端队列"]},{"id":"q131","ch":3,"type":"choice","text":"【2010统考真题】某队列允许在其两端进行入队操作，但仅允许在一端进行出队操作。若元素 a.，b,c,d.e 依次入此队列后再进行出队操作，则不可能得到的出队序列是（）","opts":[{"k":"A","t":"b,a,C,d.e"},{"k":"B","t":"d,b,a,C,e"},{"k":"C","t":"d,b,C,a,e"},{"k":"D","t":"e,c,b,a,d"}],"correct":["C"],"exp":"解析：本题的队列实际上是一个输出受限的双端队列，如图3.11 所示。A操作：a左入（或右入）、 6左入、c右入、d右入、e右入。B操作：a左入（或右入）、b左入、c右入、d左入、e右入。 D操作：a左入（或右入）、b左入、c左入、d右入、e左入。C操作：a左入（或右入）、6右 入、因d未出，此时只能入队，c怎么进都不可能在b和a之间。 【另解】初始时队列为空，第1个元素a左入（或右入）后，第2个元素b无论是左入还是 右入都必与a相邻，而选项C中a与6不相邻，不合题意。","kp":["双端队列"]},{"id":"q132","ch":3,"type":"choice","text":"【2022 统考真题，给定有限符号集S, in 和 out均为S中所有元素的任意排列。对于初始为空的 栈ST，下列叙述中，正确的是（）","opts":[{"k":"A","t":"若in 是ST 的入栈序列，则不能判断 out 是否次其可能的出栈序列"},{"k":"B","t":"若 out 是ST的出栈序列，则不能判断 in 是否为其可能的入栈序列"},{"k":"C","t":"若 in 是ST 的入栈序列，out 是对应 in 的出栈序列，则in 与out 一定不同"},{"k":"D","t":"若in 是ST 的入栈序列，out 是对应 in 的出栈序列，则in与out 可能互为倒序"}],"correct":["D"],"exp":"解析：通过模拟出入栈操作，可以判断入栈序列in 和出栈序列 out 是否合法。因此，已知 in 序 列可以判断 out 序列是否为可能的出栈序列；已知 out 序列也可以判断 in 序列是否为可能的入 栈序列，选项A和B错误。若每个元素入栈后立即出栈，则in 序列和 out 序列相同，选项C 错误。若所有元素都入栈后才依次出栈，则in 序列和 out 序列互为倒序，选项D正确。","kp":["栈"]},{"id":"q133","ch":3,"type":"subj","text":"【综合应用题】若希望循环队列中的元素都能得到利用，则需设置一个标志域tag，并以tag的值为0 或1来区分队首指针 Eront 和队尾指针 rear 相同时的队列状态是\"空\"还是\"满\"。 试编写与此结构相应的入队和出队算法。","answer":"在循环队列的类型结构中，增设一个整型变量tag，入队时置tag 1，出队时置 tag为0 （因为只有入队操作可能导致队满，也只有出队操作可能导致队空）。队列Q初始时，置tag=0、 front=rear=0。这样队列的4要素如下： 队空条件：Q.front==Q.rear 且 Q.tag==0。 队满条件：Q.front==Q.rear 且 Q.tag==1。 入队操作：Q.data ［Q.rear］=x; Q.rear=（Q.rear+1） 8Maxsize; Q.tag=1. 出队操作：x=Q.data ［Q.front］； Q.front=（Q.front+1） &Maxsize; Q.tag=0. 1）设\"tag\"法的循环队列入队算法： int EnQueue1 （SqQueue &Q, ElemType x） ｛ i£（Q.front==Q.rear&&Q.tag==1） //两个条件都满足时则队满 return O： Q.data ［Q.rear］=xi O.rear= （O.rear+1） &MaxSize； //可能队满 Q.tag=1； return 1； 2）设\"tag\"法的循环队列出队算法： int DeQueuel （SqQueue &Q, ElemType &x） ｛ i£ （Q.front==Q.rear&&Q.tag==0） //两个条件都满足时则队空 x=Q.data ［Q.front］； Q.front= （0.front+1） 8MaxSize： 1/可能队空 Q.tag=0； 2027年数据结构考研复习指导 return 1； ｝","kp":["循环队列"]},{"id":"q134","ch":3,"type":"subj","text":"【综合应用题】Q是一个队列，S是一个空栈，实现将队列中的元素逆置的算法。","answer":"本题主要考查大家对队列和栈的特性与操作的理解。因为对队列的一系列操作不可能将其中 的元素逆置，而栈可以将入栈的元素逆序提取出来，所以我们可以让队列中的元素逐个地出队， 入栈；全部入栈后再逐个出栈，入队。 算法的实现如下： void Inverser （Stack &S,Queue &Q）｛ 1/本算法实现将队列中的元素逆置 while（！QueueEmpty （Q））｛ //队列中全部元素依次出队 x=DeQueue （Q）； 1元素依次入栈 Push（S,x）； while（：StackEmpty （S））｛ 1/栈中全部元素依次出栈 Pop （S,x）； //再入队 Enoueue （Q， ×）；","kp":["双端队列"]},{"id":"q135","ch":3,"type":"subj","text":"【综合应用题】利用两个栈S1和S2来模拟一个队列，已知栈的4 个运算定义如下： 1/元素 x入栈 S Push （S, x）； Is 出栈并将出栈的值赋给 × Pop （S,X）； //判断栈是杏力空 StackEmpty （S）； 1/判断栈是否为满 StackOverflow （S）； 如何利用栈的运算来实现该队列的3个运算（形参由读者根据要求自己设计）？ 1/将元素 x入队 Enqueue； 1/出队，并将出队元素存储在x中 Dequeue； //判断队列是否为空 QueueEmptyi","answer":"利用两个栈S1 和s2 来模拟一个队列，当需要向队列中插入一个元素时，用S1来存放已输 入的元素，即S1 执行入栈操作。当需要出队时，则对s2执行出栈操作。因为从栈中取出元素的 顺序是原顺序的逆序，所以必须先将s1 中的所有元素全部出栈并入栈到s2中，再在S2中执行 出栈操作，即可实现出队操作，而在执行此操作前必须判断s2 是否为空，否则会导致顺序混乱。 当栈 S1 和S2 都为空时队列为空。 总结如下： 1）对s2 的出栈操作用作出队，若s2 为空，则先将 S1中的所有元素送入S2。 2）对s1 的入栈操作用作入队，若s1 为满，则必须先保证s2 为空，才能将S1中的元素全 部插入S2中。 入队算法： int EnQueue （Stack &S1,Stack &S2,ElemType e） ｛ if （！StackOverflow （S1））｛ Push （S1,e）； return 1； if （StackOverflow （S1） &&！StackEmpty （S2） ） ｛ printf（\"队列为满\"）； return O； ｝ if （StackOverflow （S1） &&StackEmpty （S2） ） ｛ while （！StackEmpty （S1））｛ Pop （S1，×）； Push （S2，×）； ｝ Push （S1,e）； return 1； 出队算法： void Depueue （Stack &S1,Stack &S2,ElemType &x）｛ if （！StackEmpty （S2））｛ Pop（S2,x）； ｝ else if （StackEmpty （S1））｛ printf（\"队列为空\"）； else｛ while（！StackEmpty（S1）） ｛ Pop （S1,X）； Push（S2,X）； ｝ Pop （S2,X）； ｝ 判断队列为空的算法： int QueueEmpty （Stack S1, Stack S2） ｛ i£ （StackEmpty （S1） &&StackEmpty （S2）） return 1； else return 0；","kp":["双端队列"]},{"id":"q136","ch":3,"type":"subj","text":"【综合应用题】【2019统考真题】请设计一个队列，要求满足：① 初始时队列为空；② 入队时，允许 增加队列占用空间；③ 出队后，出队元素所占用的空间可重复使用，即整个队列所占 用的空间只增不减；④ 入队操作和出队操作的时间复杂度始终保持为 O（1）。请回答： 1）该队列是应选择链式存储结构，还是应选择顺序存储结构？ 2）画出队列的初始状态，并给出判断队空和队满的条件。 3）画出第一个元素入队后的队列状态。 4）给出入队操作和出队操作的基本过程。","answer":"1）顺序存储无法满足要求②的队列占用空间随着入队操作而增加。根据要求来分析：要求 ①容易满足；链式存储方便开辟新空间，要求②容易满足；对于要求③，出队后的结点 并不真正释放，用队首指针指向新的队头结点，新元素入队时，有空余结点则无须开辟 新空间，赋值到队尾后的第一个空结点即可，然后用队尾指针指向新的队尾结点，这就 需要设计成一个首尾相接的循环单链表，类似于循环队列的思想。设置队头、队尾指针 后，链式队列的入队操作和出队操作的时间复杂度均为 O（1），要求④可以满足。 因此，采用链式存储结构（两段式单向循环链表），队首指针为 front，队尾指针为 rear。 2）该循环链式队列的实现可以参考循环队列，不同之处在于循环链式队列可以方便地增加空 间，出队的结点可以循环利用，入队时空间不够也可以动态增加。同样，循环链式队列也 要区分队满和队空的情况，这里参考循环队列牺牲一个单元来判断。 frontBD rear 初始时，创建只有一个空结点的循环单链表，头指针front 和尾指针 rear 均指向空结点，如右图所示。 队空的判定条件：front==rear。 队满的判定条件：front==rear->next。 3）插入第一个元素后的状态如下图所示。 front④ Frear C1 4）操作的基本过程如下： 入队操作： 若 （front==rear->next） //队满 则在rear后面插入一个新的空闲结点； 入队元素保存到rear所指结点中；rear=rear ->next；返回。 出队操作： 若 （front==rear） //队空 则出队失败，返回； 取Eront 所指结点中的元素e；front=front->next；返回e。 2027年数据结构考研复习指导","kp":["循环队列","复杂度分析"]},{"id":"q137","ch":3,"type":"choice","text":"栈的应用不包括（）","opts":[{"k":"A","t":"递归"},{"k":"B","t":"表达式求值"},{"k":"C","t":"括号匹配"},{"k":"D","t":"缓冲区"}],"correct":["D"],"exp":"解析：缓冲区是用队列实现的，选项A、B、C都是栈的典型应用。 第3章栈、队列和数组 97","kp":["栈"]},{"id":"q138","ch":3,"type":"choice","text":"表达式c*（b+c）-d的后缀表达式是（）","opts":[{"k":"A","t":"abcd*+-"},{"k":"B","t":"abc+*d-"},{"k":"C","t":"abc*+d-"},{"k":"D","t":"-+*abcd"}],"correct":["B"],"exp":"解析：后缀表达式中，每个运算符均直接位于其两个操作数的后面，按照这样的方式逐步根据计算 的优先级将每个计算式进行变换，即可得到后缀表达式。 【另解】将两个直接操作数用括号括起来，再将操作符提到括号后，最后去掉括号。例如， 对于（①（@a* （ab+c））-d），提出操作符并去掉括号后，可得后缀表达式为 abc+*d-。 学完第5章后，可将表达式画成二叉树的形式，再用后序遍历即可求得后缀表达式。","kp":["二叉树遍历"]},{"id":"q139","ch":3,"type":"choice","text":"下面（）用到了队列。","opts":[{"k":"A","t":"括号匹配"},{"k":"B","t":"表达式求值"},{"k":"C","t":"递归"},{"k":"D","t":"FIFO 页面替换算法"}],"correct":["D"],"exp":"解析：FIFO 页面替换算法用到了队列。其余的都只用到了栈。","kp":["栈"]},{"id":"q140","ch":3,"type":"choice","text":"利用栈求表达式的值时，设立运算数栈OPEN。假设 OPEN 只有两个存储单元，则在下列表达式 中，不会发生溢出的是（）","opts":[{"k":"A","t":"A-B*（C-D）"},{"k":"B","t":"（A-B）*C-D"},{"k":"C","t":"（A-B*C）-D"},{"k":"D","t":"（A-B）*（C D）"}],"correct":["B"],"exp":"解析：利用栈求表达式的值时，可以分别设立运算符栈和运算数栈，其原理不变。选项B中A入栈， B入栈，计算得 R1，C入栈，计算得R2，D入栈，计算得 R3，由此得栈深2。选项A、C、D 依次计算得栈深为 4、3、3。因此选择选项B。 技巧 根据运算符优先级，统计已依次入栈但还未参与计算的运算符数。以选项C为例，当\"（\"\"A\"\"-\" 入栈时，\"（\"和\"_\"还未参与运算，此时运算符栈大小为 2，\"B\" 和\"*\"入栈时运算符大小为 3， \"C\"入栈时 \"B*C\"运算，运算符栈大小为2，以此类推。","kp":["栈"]},{"id":"q141","ch":3,"type":"choice","text":"执行完下列语句段后，i的值为（） int f（int x）｛ return（（x>0）？x*（x-1）：2）； ｝ int i； i=士（f（1））；","opts":[{"k":"A","t":"2"},{"k":"B","t":"4"},{"k":"C","t":"8"},{"k":"D","t":"无限递归"}],"correct":["B"],"exp":"解析：栈与递归有着紧密的联系。递归模型包括递归出口和递归体两个方面。递归出口是递归算法 的出口，即终止递归的条件。递归体是一个递推的关系式。根据题意有 F（0） =2； f （1）=1*f （0）=2； F （F （1）） =f （2） =2*f （1）=4。 （F（8）","kp":["栈"]},{"id":"q142","ch":3,"type":"choice","text":"设有如下递归函数，则计算 F（8） 需要调用该递归函数的次数为（） int F（int n）｛ if（n<=3） return 1； else return F（n-2）+F（n-4）+1； ｝","opts":[{"k":"A","t":"7"},{"k":"B","t":"8"},{"k":"C","t":"9"},{"k":"D","t":"10"}],"correct":["C"],"exp":"解析：计算F（8）的递归调用树如右图所示： 由图可知，递归函数E（）调用的次数为9。","kp":["递归"]},{"id":"q143","ch":3,"type":"choice","text":"设有如下递归函数，在 func（func（5））的执行过程中，第4个被执行的 func函数是（） int func （int x）｛ if（x<=3） return 2； else return func （x-2） +func （x-4）； ｝","opts":[{"k":"A","t":"func（2）"},{"k":"B","t":"func（3）"},{"k":"C","t":"func（4）"},{"k":"D","t":"func（5）"}],"correct":["C"],"exp":"解析：（E） 首先，执行内层参数 Eunc （5） =func （3）+ func （1）=4，共执行 3次 Eunc 函数。然后，执行 Eunc （func （5））=func （4） =func （2）+ func （0）=4，因此第4个被执行的 func 函数是 func（4）。也可以采用画出递归调用树的方式，即 某个函数的执行次序等于其在递归调用树的先序遍历中的次序。","kp":["二叉树遍历"]},{"id":"q144","ch":3,"type":"choice","text":"对于一个问题的递归算法求解和其相对应的非递归算法求解，（）","opts":[{"k":"A","t":"递归算法通常效率高一些"},{"k":"B","t":"非递归算法通常效率高一些"},{"k":"C","t":"两者相同"},{"k":"D","t":"无法比较"}],"correct":["B"],"exp":"解析：通常情况下，递归算法在计算机实际执行的过程中包含很多的重复计算，所以效率会低。","kp":["递归"]},{"id":"q145","ch":3,"type":"choice","text":"执行函数时，其局部变量一般采用（）进行存储。","opts":[{"k":"A","t":"树形结构"},{"k":"B","t":"静态链表"},{"k":"C","t":"栈结构"},{"k":"D","t":"队列结构"}],"correct":["C"],"exp":"解析：调用函数时，系统会为调用者构造一个由参数表和返回地址组成的活动记录，并将记录压入 系统提供的栈中，若被调用函数有局部变量，也要压入栈中。","kp":["队列"]},{"id":"q146","ch":3,"type":"choice","text":"执行（）操作时，需要使用队列作为辅助存储空间。","opts":[{"k":"A","t":"查找散列（哈希）表"},{"k":"B","t":"广度优先搜索图"},{"k":"C","t":"先序（根）遍历二叉树"},{"k":"D","t":"深度优先搜索图"}],"correct":["B"],"exp":"解析：本题涉及第5章和第6章的内容，图的广度优先搜索类似于树的层序遍历，都要借助于队列。","kp":["二叉树遍历"]},{"id":"q147","ch":3,"type":"choice","text":"下列说法中，正确的是（）","opts":[{"k":"A","t":"消除递归不一定需要使用栈"},{"k":"B","t":"对同一输入序列进行两组不同的合法入栈和出栈组合操作，所得的输出序列也一定相同"},{"k":"C","t":"通常使用队列来处理函数或过程调用"},{"k":"D","t":"队列和栈都是运算受限的线性表，只允许在表的两端进行运算"}],"correct":["A"],"exp":"解析：使用栈可以模拟递归的过程，以此来消除递归，但对于单向递归和尾递归而言，可以用迭代 的方式来消除递归，选项A 正确。不同的入栈和出栈组合操作，会产生许多不同的输出序列，B 98 2027年数据结构考研复习指导 错误。通常使用栈来处理函数或过程调用，选项C错误。队列和栈都是操作受限的线性表，但只 有队列允许在表的两端进行运算，而栈只允许在栈项方向进行操作，选项D错误。","kp":["队列"]},{"id":"q148","ch":3,"type":"choice","text":"【2009 统考真题】为解决计算机主机与打印机之间速度不匹配的问题，通常设置一个打印数据 缓冲区，主机将要输出的数据依次写入该缓冲区，而打印机则依次从该缓冲区中取出数据。该缓冲区的 逻辑结构应该是（）","opts":[{"k":"A","t":"栈"},{"k":"B","t":"队列"},{"k":"C","t":"树"},{"k":"D","t":"图"}],"correct":["B"],"exp":"解析：在提取数据时必须保持原来数据的顺序，所以缓冲区的特性是先进先出。","kp":["队列"]},{"id":"q149 text":"【2021 统考真题】初始为空的队列Q的一端仅能进行入队操作，另外一端既能进行入队操作又 能进行出队操作。若Q的入队序列是1,2,3,4,5，则不能得到的出队序列是（）","opts":[{"k":"A","t":"5, 4, 3, 1,2"},{"k":"B","t":"5, 3, 1,2,4"},{"k":"C","t":"4,2, 1,3,5"},{"k":"D","t":"4, 1,3,2,5"}],"correct":["D"],"exp":"解析：假设队列左端允许入队和出队，右端只能入队。对于选项 A，依次从右端入队1，2，再从 左端入队3，4，5。对于选项B，从右端入队 1，2，然后从左端入队3，再从右端入队4，最后从 左端入队5。对于选项C，从左端入队 1，2，然后从右端入队3，再从左端入队 4，最后从右端 入队5。无法验证选项D的序列。 54312 531244 42135. 人 A B C","kp":["队列"]},{"id":"q155","ch":3,"type":"subj","text":"【综合应用题】假设一个算术表达式中包含圆括号、方括号和花括号3种类型的括号，编写一个算法来 判别表达式中的括号是否配对，以字符\"\\0\"作为算术表达式的结束符。","answer":"括号匹配是栈的一个典型应用，给出这道题是希望读者好好掌握栈的应用。算法的基本思想 是扫描每个字符，遇到花、方、圆的左括号时入栈，遇到花、方、圆的右括号时检查栈顶元素是 否为相应的左括号，若是，出栈，否则配对错误。最后栈若不为空也为错误。 bool BracketsCheck （char *str）｛ 1初始化栈 InitStack （S）； int 1=0； while （str［i］！=\"\\0'）｛ switch（str［i］）｛ 1左括号入栈 case '（'： Push （S，'（'； breaki case '［'： Push （S， '［'）；break； case '｛'： Push （S， '｛'）；break； //遇到右括号，检测栈项 case '）'： Pop （S, e）； if （e！=' （'） return false； case '］'： Pop（S,e）； if（e！='［'） return false： case '｝'： Pop （S,e）； if（e！='｛'） return default： break； ｝/switch ｝//while if （！StackEmpty （S））｛ printf（\"括号不匹配\\n\"）； return false； ｝ else｛ printf（\"括号匹配\\n\"）； return true：","kp":["栈"]},{"id":"q156","ch":3,"type":"choice","text":"对特矩阵采用压缩存储的主要目的是（）","opts":[{"k":"A","t":"表达变得简单"},{"k":"B","t":"对矩阵元素的存取变得简单"},{"k":"C","t":"去掉矩阵中的多余元素"},{"k":"D","t":"减少不必要的存储空间"}],"correct":["D"],"exp":"解析：特殊矩阵中含有很多相同元素或零元素，所以可采用压缩存储，以节省存储空间。","kp":["数组与矩阵"]},{"id":"q157","ch":3,"type":"choice","text":"对n阶对称矩阵压缩存储时，需要表长为（）的顺序表。","opts":[{"k":"A","t":"n/2"},{"k":"B","t":"nxn/2"},{"k":"C","t":"n（n+1）/2"},{"k":"D","t":"n（n-1）/2"}],"correct":["C"],"exp":"解析：只需存储其上三角或下三角部分（含对角线），元素个数为 n+（n-1）+⋯+1= n（n+ 1）/2。","kp":["顺序表"]},{"id":"q158","ch":3,"type":"choice","text":"有一个nxn的对称矩阵A，将其下三角部分按行存放在一维数组B中，而 ATOIIO］ 存放于B［0］ 中，则第i+1行的对角元素 A［i［i 存放于B中的（）处。","opts":[{"k":"A","t":"（i+3）i/2"},{"k":"B","t":"（i+1）i/2"},{"k":"C","t":"（2n-i+1）i/2"},{"k":"D","t":"（2n-i-1）i/2"}],"correct":["A"],"exp":"解析：此题要注意3个细节：矩阵的最小下标为0；数组下标也是从0开

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>数据结构刷题 · 395 题</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f1216;--card:#171c23;--line:#242c36;--fg:#e6edf3;--dim:#8b98a5;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
body{padding:0 0 90px}
header{position:sticky;top:0;z-index:9;background:rgba(15,18,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{font-weight:700;font-size:16px}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
.spacer{flex:1}
.stat{color:var(--dim);font-size:13px}
.stat b{color:var(--fg)}
nav{max-width:1320px;margin:10px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim);cursor:pointer;font-size:13px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.wrong.on{background:var(--bad);border-color:var(--bad)}
main{max-width:1320px;margin:18px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;max-height:calc(100vh - 118px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 12px;min-height:0;display:flex;flex-direction:column}
.panel:not(.grow){flex:none}
.panel.grow{flex:1;overflow:auto}
.panel h3{margin:0 0 10px;font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.3px;flex:none}
.chip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border-radius:999px;background:#1e2733;border:1px solid #2c3744;color:#a9c4e0;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kpg{font-size:11px;color:#6f7d8c;margin:9px 0 4px;letter-spacing:.4px}
.kpg:first-child{margin-top:0}
.kprow{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px}
.kprow:hover .kpname{color:var(--acc)}
.kpname{flex:1;color:#cfdae6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpbar{width:52px;height:5px;background:#1b222b;border-radius:99px;overflow:hidden;flex:none}
.kpbar i{display:block;height:100%;background:var(--ok)}
.kpnum{color:var(--dim);font-size:11.5px;flex:none;min-width:34px;text-align:right}
.kprow.on .kpname{color:var(--acc);font-weight:600}
.kprow.zero{opacity:.4;cursor:default}
.kprow.zero:hover .kpname{color:#cfdae6}
@media (max-width:1150px){main{grid-template-columns:1fr}aside{position:static;max-height:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.meta{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px;margin-bottom:10px}
.badge{padding:2px 8px;border-radius:6px;background:#202834;color:#9fb3c8}
.q{font-size:16.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#1b222b;cursor:pointer;text-align:left;color:var(--fg);font-size:14.5px;line-height:1.6}
.opt:hover{border-color:#3b4654}
.opt .k{color:var(--dim);font-weight:700;flex:none}
.opt.sel{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.12)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}
.opt:disabled{cursor:default}
.fill{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.fill .row{display:flex;gap:10px;align-items:center}
.fill label{color:var(--dim);font-size:13px;flex:none;min-width:52px}
input[type=text],textarea{width:100%;background:#0f141a;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#1e2733;color:var(--fg);cursor:pointer;font-size:14px}
.btn:hover{border-color:#3b4654}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:rgba(34,197,94,.18);border-color:var(--ok)}
.btn.bad{background:rgba(239,68,68,.18);border-color:var(--bad)}
.ans{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:14px;color:#c9d6e2;white-space:pre-wrap}
.ans h4{margin:0 0 8px;font-size:13px;color:var(--warn);font-weight:600}
.verdict{font-weight:700;margin-left:8px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,18,22,.95);border-top:1px solid var(--line);padding:10px 20px}
.frow{max-width:1320px;margin:0 auto;display:flex;gap:10px;align-items:center}
.prog{flex:1;height:6px;background:#1b222b;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.hint{color:var(--dim);font-size:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}
.dot{width:9px;height:9px;border-radius:2px;background:#232c37}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.timer{color:#f59e0b;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.timer.hide{display:none}
.star{margin-left:auto;background:none;border:0;color:#6f7d8c;font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.star.on{color:#f59e0b}
.opt.sel{border-color:var(--acc);background:rgba(59,130,246,.12)}
.fb{font-size:13px;margin-left:8px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.chipx{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.35);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
.summary h2{margin:0 0 10px;font-size:20px}
.score{font-size:36px;font-weight:800;color:var(--acc)}
.wronglist{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--dim)}
.wronglist li{margin:4px 0}
html,body{max-width:100%;overflow-x:hidden}
main>*{min-width:0}
.card{min-width:0}
.opt{min-width:0;overflow-wrap:anywhere}
.q{overflow-wrap:anywhere}

@media (max-width:640px){
  header{padding:10px 12px}
  .hrow{gap:8px;row-gap:6px}
  .brand{font-size:15px}
  .brand small{display:none}
  .stat{font-size:12px;order:9;flex-basis:100%;margin-top:2px}
  .btn{padding:6px 11px;font-size:13px}

  .tab{font-size:12px;padding:4px 10px;white-space:nowrap;flex:none}

  .q{font-size:16px;line-height:1.75}
  .opts{gap:8px;margin-top:12px}
  .opt{font-size:14px;padding:10px 12px;border-radius:9px}
  .meta{flex-wrap:wrap;gap:6px;margin-bottom:8px}
  aside{position:static;max-height:none;gap:10px}
  aside .panel.grow{max-height:320px;overflow:auto}
  .panel{padding:12px 12px 10px}
  .fill label{min-width:44px;font-size:12.5px}
  input[type=text],textarea{font-size:16px;padding:10px 12px}

  footer{padding:8px 12px}
  .frow{gap:8px;flex-wrap:wrap}

  .hint{font-size:11.5px}
  .ans{font-size:13.5px}

}

.kfhead{font-size:11px;color:#6f7d8c;margin:12px 0 6px;letter-spacing:.4px}
.doclink{background:none;border:0;color:#60a5fa;font-size:12px;cursor:pointer;padding:0 2px;margin-left:2px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(820px,94vw);background:#0d1218;border-left:1px solid var(--line);
  display:flex;flex-direction:column;z-index:50;box-shadow:-18px 0 40px rgba(0,0,0,.45)}
.drawer.hide{display:none}
.dhead{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.dhead input{flex:1;min-width:140px}
.dbody{flex:1;display:flex;min-height:0}
.dtoc{width:190px;flex:none;overflow:auto;border-right:1px solid var(--line);padding:8px 0}
.dtoc .dt{font-size:11px;color:#6f7d8c;padding:8px 12px 4px;letter-spacing:.4px}
.dtoc .hn{color:var(--dim);font-size:11px;margin-left:4px}
.dtoc a{display:block;padding:5px 12px;font-size:12.8px;color:#9fb0c0;text-decoration:none;line-height:1.45}
.dtoc a:hover{background:#131a22;color:#e8eef5}
.dtoc a.on{color:var(--acc);background:#12202f}
.dtoc a.l1{font-weight:600;color:#c8d4e0;margin-top:4px}
.dtext{flex:1;overflow:auto;padding:14px 20px 40px;font-size:14px;line-height:1.8;color:#d5dee7}
.dtext h4{margin:18px 0 8px;font-size:16px;color:#fff}
.dtext h5{margin:14px 0 6px;font-size:14.5px;color:#cfdae6}
.dtext p{margin:6px 0;white-space:pre-wrap}
.tblwrap{overflow-x:auto;margin:10px 0}
.dtext table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.dtext table.tbl th,.dtext table.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.dtext table.tbl th{background:#1b2333;color:#cbd5e1;font-weight:600;white-space:nowrap}
.dtext table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.dtext .dimg{max-width:100%;display:block;margin:12px 0;border-radius:10px;background:#fff;padding:6px}
.dtext pre{background:#0a0f14;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.55;color:#c9d6e3}
.dtext .tbl{background:#0a0f14;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12.5px;white-space:pre;color:#c9d6e3}
.dtext .empty{color:#6f7d8c;font-size:13px}
@media (max-width:640px){
  .drawer{width:100vw;border-left:0}
  .dbody{flex-direction:column}
  .dtoc{width:auto;max-height:168px;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;padding:6px}
  .dtoc .dt{display:none}
  .dtoc a{padding:4px 8px;font-size:12px;border-radius:6px;background:#131a22}
  .dtext{padding:12px 14px 60px}
}

<script>
const QUESTIONS = [{"id":"q001","ch":1,"type":"choice","text":"一个完整的数据结构通常应包含以下哪些要素（）","opts":[{"k":"A","t":"数据元素及其存储方式"},{"k":"B","t":"数据的逻辑结构和物理结构"},{"k":"C","t":"数据的逻辑结构、存储结构以及在其上定义的基本操作"},{"k":"D","t":"数据对象和数据元素之间的关系"}],"correct":["C"],"exp":"解析：一个完整的数据结构由三部分组成：逻辑结构（如线性、树形等）、存储结构（物理表示） 以及在其上定义的基本操作（如插入、删除等）。只有选项C同时包含这三个核心要素。","kp":["基本概念"]},{"id":"q002","ch":1,"type":"choice","text":"下列选项中，属于逻辑结构的是（）","opts":[{"k":"A","t":"顺序表"},{"k":"B","t":"哈希表"},{"k":"C","t":"有序表"},{"k":"D","t":"单链表"}],"correct":["C"],"exp":"解析：顺序表、哈希表和单链表是三种不同的数据结构，既描述逻辑结构，又描述存储结构和数据 运算。而有序表是指关键字有序的线性表，仅描述元素之间的逻辑关系，它既可链式存储，又可 顺序存储，所以属于逻辑结构。","kp":["哈希表"]},{"id":"q003","ch":1,"type":"choice","text":"以下关于数据结构的说法中，正确的是（）","opts":[{"k":"A","t":"数据的逻辑结构独立于其存储结构"},{"k":"B","t":"数据的存储结构独立于其逻辑结构"},{"k":"C","t":"数据的逻辑结构唯一决定其存储结构"},{"k":"D","t":"数据结构仅由其逻辑结构和存储结构决定"}],"correct":["A"],"exp":"解析：数据的逻辑结构是从面向实际问题的角度出发的，只采用抽象表达方式，独立于存储结构， 数据的存储方式有多种不同的选择；而数据的存储结构是逻辑结构在计算机上的映射，它不能独 立于逻辑结构而存在。数据结构包括三个要素，缺一不可。","kp":["基本概念"]},{"id":"q004","ch":1,"type":"choice","text":"在存储数据时，通常不仅要存储各数据元素的值，还要存储（）","opts":[{"k":"A","t":"数据的操作方法"},{"k":"B","t":"数据元素的类型"},{"k":"C","t":"数据元素之间的关系"},{"k":"D","t":"数据的存取方法"}],"correct":["C"],"exp":"解析：在存储数据时，不仅要存储数据元素的值，而且要存储数据元素之间的关系。","kp":["基本概念"]},{"id":"q005","ch":1,"type":"subj","text":"【综合应用题】对于两种不同的数据结构，逻辑结构或物理结构一定不相同吗？","answer":"应该注意到，数据的运算也是数据结构的一个重要方面。 对于两种不同的数据结构，它们的逻辑结构和物理结构完全有可能相同。比如二叉树和二叉 排序树，二叉排序树可以采用二叉树的逻辑表示和存储方式，前者通常用于表示层次关系，而后 者通常用于排序和查找。虽然它们的运算都有建立树、插入结点、删除结点和查找结点等功能， 但对于二叉树和二叉排序树，这些运算的定义是不同的，以查找结点为例，二叉树的平均时间复 杂度为 O（n），而二叉排序树的平均时间复杂度力 O（logzn）。","kp":["二叉排序树","复杂度分析"]},{"id":"q006","ch":1,"type":"subj","text":"【综合应用题】举例说明对相同的逻辑结构，同一种运算在不同存储方式下实现时，其运算效率不同。","answer":"线性表既可以用顺序存储方式实现，又可以用链式存储方式实现。在顺序存储方式下，在线 性表中插入和删除元素，平均要移动近一半的元素，时间复杂度为O（m）；而在链式存储方式下， 插入和删除的时间复杂度都是 O（1）。","kp":["线性表","复杂度分析"]},{"id":"q007","ch":1,"type":"choice","text":"一个算法应该具有（）等重要特性。","opts":[{"k":"A","t":"可维护性、可读性和可行性"},{"k":"B","t":"可行性、确定性和有穷性"},{"k":"C","t":"确定性、有穷性和可靠性"},{"k":"D","t":"可读性、正确性和可行性"}],"correct":["B"],"exp":"解析：一个算法应具有五个重要特性：有穷性、确定性、可行性、输入和输出。选项A、C和D中 第1章绪论 9 提到的特性（如可维护性、可读性、可靠性、正确性等）是很重要的，但它们并不是算法定义的 重要特性，更多的是关于软件开发中的附加要求。","kp":["其他"]},{"id":"q008","ch":1,"type":"choice","text":"下列关于算法的说法中，正确的是（）","opts":[{"k":"A","t":"算法的时间效率取决于算法执行所花的CPU 时间"},{"k":"B","t":"在算法设计中不允许用牺牲空间效率的方式来换取好的时间效率"},{"k":"C","t":"算法必须具备有穷性、确定性等五个特性"},{"k":"D","t":"通常用时间效率和空间效率来衡量算法的优劣"}],"correct":["C"],"exp":"解析：算法的时间效率是指算法的时间复杂度，即执行算法所需的计算工作量，选项A错误。算 法设计会综合考虑时间效率和空间效率两个方面，若某些应用场景对时间效率要求很高，而对 空间效率要求不高，则可用牺牲空间效率的方式来换取好的时间效率，选项B错误。评价一 个算法的\"优劣\"不仅要考虑算法的时空效率，还要从正确性、可读性、健壮性等方面来综 合评价。","kp":["复杂度分析"]},{"id":"q009","ch":1,"type":"choice","text":"某算法的时间复杂度为O（n'），表明该算法的（）","opts":[{"k":"A","t":"问题规模是n2"},{"k":"B","t":"执行时间等于n2"},{"k":"C","t":"执行时间与n2成正比"},{"k":"D","t":"问题规模与n2成正比"}],"correct":["C"],"exp":"解析：时间复杂度为O（n'），说明算法的时间复杂度 T（m）满足T（m）≤cn（其中c为比例常数），即 T（n）=0（n'），时间复杂度T（n）是问题规模n的函数，其问题规模仍然是n而不是n。","kp":["复杂度分析"]},{"id":"q010","ch":1,"type":"choice","text":"若某算法的空间复杂度为O（1），则表示该算法（）","opts":[{"k":"A","t":"不需要任何辅助空间"},{"k":"B","t":"所需辅助空间大小与问题规模n无关"},{"k":"C","t":"不需要任何空间"},{"k":"D","t":"所需空间大小与问题规模n无关"}],"correct":["B"],"exp":"解析：算法的空间复杂度为 O（1），表示执行该算法所需的辅助空间大小相比输入数据的规模来说是 一个常量，而不表示该算法执行时不需要任何空间或辅助空间。","kp":["复杂度分析"]},{"id":"q011","ch":1,"type":"choice","text":"下列关于时间复杂度的函数中，时间复杂度量小的是（）","opts":[{"k":"A","t":"Ti （n） =nlogn+5000n"},{"k":"B","t":"T2（n）=n-8000n"},{"k":"C","t":"Ts（n） =nlog2n-6000n"},{"k":"D","t":"T4（n） =200001ogzn"}],"correct":["D"],"exp":"解析：选项A的最高阶是 nlogzn，时间复杂度是O（nlogzn）。选项B 的最高阶是n'，时间复杂度是 O（n）。选项C的最高阶是 nlogzn，时间复杂度是 O（（nlogzn）。选项D的最高阶是1og2n，时间复杂 度是 O（logzn）。","kp":["复杂度分析"]},{"id":"q012","ch":1,"type":"choice","text":"以下算法的时间复杂度为（） void fun（int n）｛ int i=1； while（i<=n） 1=1*2； ｝","opts":[{"k":"A","t":"O（n）"},{"k":"B","t":"O（n'）"},{"k":"C","t":"O（nlogzn）"},{"k":"D","t":"（logzn）"}],"correct":["C"],"exp":"解析：基本运算为i++，设执行次数为1，有1 •≤n，即 n。因此有 ≤名h，则Tn）=O（Sn）。","kp":["复杂度分析"]},{"id":"q013","ch":1,"type":"choice","text":"下列算法的时间复杂度为（） void fun（int n）｛ int i=0； while（i i i n） 1=1++； ｝","opts":[{"k":"A","t":"O（n）"},{"k":"B","t":"O（nlogzn）"},{"k":"C","t":"0（v）"},{"k":"D","t":"O（vn）"}],"correct":["C"],"exp":"解析：基本运算为i++，设执行次数为1，有1 •≤n，即 n。因此有 ≤名h，则Tn）=O（Sn）。","kp":["复杂度分析"]},{"id":"q014","ch":1,"type":"choice","text":"某个程序段如下： for（i=n-1；i>1;i--） for（j=1; jsi; j++） if （A［j］>A［j+1］） A［j］与Alj+1］对换； 其中n为正整数，则最后一行语句的频度在最坏情况下是（）","opts":[{"k":"A","t":"O（n）"},{"k":"B","t":"O（nlogzn）"},{"k":"C","t":"O（n3）"},{"k":"D","t":"O（n ）"}],"correct":["D"],"exp":"解析：这是冒泡排序的算法代码，考查最坏情况下的元素交换次数（若觉得理解起来有困难，则可 在学完第8章后再回顾）。当所有相邻元素都逆序时，则最后一行的语句每次都会执行。此时， 所以在最坏情况下该语句的频度是O（r）。","kp":["冒泡排序"]},{"id":"q015","ch":1,"type":"choice","text":"下列程序段的时间复杂度（） if（n>=0）｛ for （int i=0; i<n； i++） for （int j=0;j<n; j++） printf（\"输入数据大于或等于零\\n\"） ｝ else｛ for（int j=0; j<n; j++） printf（\"输入数据小于零\\n\"） ｝","opts":[{"k":"A","t":"0（n2）"},{"k":"B","t":"O（n）"},{"k":"C","t":"O（1）"},{"k":"D","t":"O（nlogzn）"}],"correct":["A"],"exp":"解析：当程序段中有条件判断语句时，取分支路径上的最大时间复杂度。","kp":["复杂度分析"]},{"id":"q016","ch":1,"type":"choice","text":"下列算法中加下划线的语句的执行次数为（） int m=O，立，j； for（i=1;i<=n；i++） for（j=1；j<=2*i；j++） m++；","opts":[{"k":"A","t":"n（n+1）"},{"k":"B","t":"n"},{"k":"C","t":"n+l"},{"k":"D","t":"n2"}],"correct":["A"],"exp":"解析：m++语句的执行次数力","kp":["其他"]},{"id":"q017","ch":1,"type":"choice","text":"下列函数代码的时间复杂度是（） int Func （int n）｛ if （n==1） return 1； else return 2*Func （n/2）+n； ｝","opts":[{"k":"A","t":"O（n）"},{"k":"B","t":"O（nlogzn）"},{"k":"C","t":"O（logzn）"},{"k":"D","t":"O（n\"）"}],"correct":["C"],"exp":"解析：本题求的是递归调用的时间复杂度，递归调用可视为多重循环，每次递归执行的基本语句是 iE（n==1）return 1；，因此可以认为单层循环的执行次数 1，设递归次数为t，2'≤n，即 t≤logzn，共执行了logzn次递归调用，总执行次数T=logznx 1，所以时间复杂度为 O（logzn）。 10 2027年数据结构考研复习指导 循环变量i 单层循环语句 单层循环执行次数 if（n==1） return 1； n/2 if（n==1） return 1； n/4 if （n==1） return 1； 1 ⋯• I if（n==1） return 1；","kp":["递归","复杂度分析"]},{"id":"q018","ch":1,"type":"choice","text":"【2011 统考真题】设n是描述问题规模的非负整数，下列程序段的时间复杂度是（） ×=2； while（x<n/2） ×=2*×；","opts":[{"k":"A","t":"O（ogzn）"},{"k":"B","t":"O（n）"},{"k":"C","t":"O（nlogzn）

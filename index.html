rF0snvv0PCInL4/FZNnbWpGx6ecvX+PiEwWCokiLTtPS1LCzsfrbe/PNW7rW2tK8AjPQMzKzJs1c1Ll9a38/ybLW3Ny82/cesZWVmUwlLlfN1cmBmlP/luf5U2z83QehXDU1dxdHMvw6d/FqYFCwdKL0f3OMfgvFfB8Rjp4872BrRe3gwePx4uIT0zIy8/MLCgsLhUJhUXGxkoebs/ymz1UtKyv75ZtIXR0t++97mAAAAAAAAED5IRgF+LvFxCVoa2mWNk8G/gQ4RgAAAAAAAAB/IASjAAAAAAAAAAAAoHBKJgsDAAAAAAAAAAAAKAgEowAAAAAAAAAAAKBwEIwCAAAAAAAAAACAwkEwCgAAAAAAAAAAAAoHwSgAAAAAAAAAAAAoHASjAAAAAAAAAAAAoHAQjAIAAAAAAAAAAIDCQTAKAAAAAAAAAAAACgfBKAAAAAAAAAAAACgcBKMAAAAAAAAAAACgcBCMAgAAAAAAAAAAgMJBMAoAAAAAAAAAAAAKB8EoAAAAAAAAAAAAKBwEowAAAAAAAAAAAKBwEIwCAAAAAAAAAACAwkEwCgAAAAAAAAAAAAoHwSgAAAAAAAAAAAAoHASjAAAAAAAAAAAAoHAQjAIAAAAAAAAAAIDCQTAKAAAAAAAAAAAACgfBKAAAAAAAAAAAACgcBKMAAAAAAAAAAACgcBCMAgAAAAAAAAAAgMJBMAoAAAAAAAAAAAAKB8EoAAAAAAAAAAAAKBwEowAAAAAAAAAAAKBwEIwCAAAAAAAAAAAATdH8DxNx7ZbWwDJDAAAAAElFTkSuQmCC"}, {"t": "tbl", "s": "学习技能 | 核心问题 | 本资料中的落地方式"}, {"t": "p", "s": "Guided Learning | 现在该学什么？前置知识是否具备？ | 知识路径图 + 每章“掌握门”\nDual-Loop Solve | 先找条件，再推步骤，最后如何验算？ | 四个高频题的分析循环 + 求解循环\nAdaptive Questioning | 错题暴露的是记忆、过程还是迁移问题？ | 分层自测 + 错题回炉表 + 主动回忆卡"}, {"t": "tbl", "s": "Deep Research | 为什么这样设计？各章知识点如何关联？ | 跨章因果链与算法优化原则"}, {"t": "p", "s": "四步使用法\n先沿知识路径检查前置条件；如果不知道“顺序存取”和“指针”，不要直接背 KMP。\n学习每个高频算法时，先画结构或状态，再按“分析 → 求解 → 验算”完成例题。\n完成 20 分钟自测，把错误归类为概念遗忘、步骤错误或迁移失败。\n按主动回忆卡与间隔复习表完成二轮回炉，最后只看错题与速记表。\n使用原则\n这份资料不是从头读到尾的讲义。第一遍建立结构，第二遍遮住答案主动回忆，第三遍用题目暴露问题。只有能独立画图、手推和写代码，才视为掌握。"}]}, {"id": "ch1", "no": "第1章", "title": "绪论：概念与复杂度", "level": 1, "body": [{"t": "p", "s": "本章掌握门\n会说：数据结构、数据元素、逻辑结构、存储结构、ADT、算法五特性。\n会做：判断四种逻辑结构；估算常见操作和循环的时间复杂度。\n易错：把逻辑结构与存储结构混为一谈；把“程序”直接等同于“算法”。"}]}, {"id": "s1_1", "no": "1.1", "title": "数据结构的基本概念", "level": 2, "body": [{"t": "p", "s": "数据：所有能输入到计算机中、并能被程序处理的符号总称。\n数据元素：数据的基本单位，通常作为一个整体处理；一个数据元素可以由若干数据项组成。\n数据项：构成数据元素、不可再分的最小单位。例如学生的姓名、学号都可以是数据项。\n数据对象：性质相同的数据元素的集合，是数据的一个子集。\n数据结构：数据元素之间存在的一种或多种特定关系的集合，包含逻辑结构、存储结构和数据运算。\n四种逻辑结构与四种常见存储结构"}, {"t": "tbl", "s": "维度 | 类型 | 判断要点\n逻辑结构 | 集合、线性、树形、图形 | 看元素之间是无关、一对一、一对多还是多对多\n存储结构 | 顺序、链式、索引、散列 | 看元素在计算机中的组织和访问方式\n线性结构 | 线性表、栈、队列、串、数组 | 元素之间存在一对一的前驱后继关系\n常见误区 | 逻辑结构不等于存储结构 | 同一种逻辑结构可以用不同存储方式实现"}, {"t": "p", "s": "四种常见存储方式"}, {"t": "tbl", "s": "存储方式 | 关系如何表示 | 主要代价\n顺序存储 | 逻辑相邻的元素放在相邻存储单元 | 支持随机存取；插入删除可能移动大量元素\n链式存储 | 用指针显式连接逻辑相邻结点 | 改指针灵活；需要额外指针，不能随机存取\n索引存储 | 建立索引表记录关键字与地址 | 检索较快；索引表占额外空间并需维护\n散列存储 | 由关键字通过散列函数计算地址 | 等值查找快；存在冲突处理问题"}]}, {"id": "s1_2", "no": "1.2", "title": "抽象数据类型与算法", "level": 2, "body": [{"t": "p", "s": "抽象数据类型（ADT）强调“做什么”，不规定“怎样实现”。它由数据对象、数据关系以及定义在该对象上的一组操作组成，代码实现和内部存储可以变化。\n算法五个特性\n有穷性、确定性、可行性、输入、输出。注意：算法可以有零个输入，但必须有一个或多个输出；程序可以不满足有穷性，算法必须满足。\nADT 三元组与讲义写法\n抽象数据类型可用三元组 (D,S,P) 概括：D 是数据对象，S 是 D 上的关系集，P 是对 D 的基本操作集。ADT 描述对外提供什么操作以及操作满足什么条件，不规定这些操作必须用数组还是链表实现。"}, {"t": "tbl", "s": "组成 | 含义 | 答题示例\nD | 数据对象 | 全部学生记录\nS | 对象元素之间的关系 | 按学号排列的前驱后继关系\nP | 定义在 D 上的操作集合 | 插入、删除、查找、求长度"}, {"t": "p", "s": "ADT List {\n    数据对象：D = {a_i | a_i ∈ ElemType, i = 1,2,…,n}\n    数据关系：R = {<a_(i-1), a_i> | i = 2,…,n}\n    基本操作：InitList、ListInsert、ListDelete、LocateElem\n             （写明初始条件和操作结果）"}, {"t": "code", "s": "} ADT List\nADT 与结构体  ADT 是逻辑接口，C 语言的 struct 只是某一种存储实现。答题说“ADT 包含数据对象、关系和操作”比只写“struct 包含数据域和指针域”更完整。\n算法的四项评价标准"}, {"t": "tbl", "s": "评价标准 | 核心含义 | 常见判断\n正确性 | 满足问题要求，结果可靠 | 边界输入、典型输入、非法输入是否处理\n可读性 | 结构清楚，便于理解和维护 | 命名、注释、控制流程是否清晰\n健壮性 | 非法输入不会导致错误运行 | 越界、空表、分配失败是否检查\n高效性 | 时间和空间代价合理 | 复杂度是否与问题规模匹配"}, {"t": "p", "s": "算法的五个特性回答“它是否算算法”，四项评价回答“它好不好”。有穷性、确定性、可行性、输入、输出是基本门槛；正确性、可读性、健壮性和高效性用于比较不同算法。\n选择题速判  输入可以有零个，输出至少一个；程序可以不终止，但算法必须有穷。复杂度是评价标准之一，不代表复杂度越小，算法在所有实际输入下都一定越快。"}]}, {"id": "s1_3", "no": "1.3", "title": "时间与空间复杂度", "level": 2, "body": [{"t": "p", "s": "时间复杂度描述算法执行时间的增长趋势，不是精确秒数。先找执行次数最多的基本语句，再保留最高阶并去掉常数系数。最坏情况常用于评价算法保证。"}, {"t": "tbl", "s": "复杂度 | 典型场景 | 考试提醒\nO(1) | 顺序表按下标存取、单链表已定位后插入 | “已定位”是关键前提\nO(log n) | 折半查找、部分树结构操作 | 不是所有“查找”都是 O(log n)\nO(n) | 顺序扫描、单链表定位、求长度 | 与问题规模线性增长\nO(n log n) | 高效排序、部分树算法 | 看清比较和分层过程\nO(n²) | 嵌套循环、顺序表插入删除最坏情况 | 不要与 O(nm) 混淆\nO(nm) | BF 串匹配最坏情况 | 主串长 n、模式串长 m\nO(n+m) | KMP 串匹配 | 求 next 为 O(m)，匹配为 O(n)"}, {"t": "p", "s": "答题模板\n某算法共执行 f(n) 次基本操作，故 T(n)=O(f(n))。若只问存储复杂度，再说明额外空间是否随 n 增长；原地算法通常为 O(1) 辅助空间。\n复杂度代码速判"}, {"t": "code", "s": "/* 1. 单层循环 */\nfor (i = 0; i < n; ++i) x++;\n/* 2. 双层循环 */\nfor (i = 1; i < n; ++i)\n    for (j = 1; j <= n - i; ++j) x++;\n/* 3. 循环变量成倍增长 */\nfor (i = 1; i < n; i *= 2) x++;\n/* 4. 循环变量由累加值控制 */\nsum = 1;\nfor (i = 0; sum < n; ++i) sum += 1;\n四段代码依次为 O(n)、O(n²)、O(log n)、O(n)。第 2 段总次数为 n(n-1)/2，仍取最高阶 O(n²)；第 4 段每次只增加 1，循环约 n 次，不要因为同时出现 i、sum 就误判。\n空间复杂度\n空间复杂度只计算算法运行所需的额外辅助空间。只用若干临时变量通常为 O(1)；需要长度为 n 的辅助数组通常为 O(n)；递归算法的辅助空间至少与递归深度有关。"}]}, {"id": "s1_4", "no": "1.4", "title": "复杂度强化：递推、渐近界与均摊", "level": 2, "body": [{"t": "p", "s": "前文给出了常见循环的直接判断。考试更容易把复杂度放进递推式、多个规模变量或均摊语境中；这一节补齐三种判断方法，并把“单次代价”和“总代价”分开表述。\n递推式如何转成复杂度\n先写出第 n 次操作与更小规模操作之间的关系，再展开或观察层数。数据结构题通常只需识别下面四类模式。"}, {"t": "tbl", "s": "递推关系 | 典型算法 | 展开结论 | 答题要点\nT(n)=T(n-1)+1 | 单层递归、顺序扫描 | T(n)=O(n) | 每一层只减少 1，共有 n 层\nT(n)=T(n/2)+1 | 折半查找 | T(n)=O(log n) | 每次规模减半，层数约为 log₂n"}, {"t": "p", "s": "T(n)=2T(n/2)+n | 归并式分治 | T(n)=O(n log n) | 每层合并代价 n，共 log₂n 层"}, {"t": "tbl", "s": "T(n)=T(n-1)+n | 每层做线性工作 | T(n)=O(n²) | 总代价 1+2+…+n"}, {"t": "p", "s": "展开检查  写出前两三层，确认“每层代价 × 层数”即可；不要只看到递归就写成 O(1)。递归调用本身也占时间，递归栈还影响空间复杂度。\nO、Ω、Θ 与多个规模变量"}, {"t": "tbl", "s": "记号 | 直观含义 | 考试表达\nO(g(n)) | 增长不超过 g 的数量级 | 最坏情况常用上界 O\nΩ(g(n)) | 增长至少达到 g 的数量级 | 最好情况常用下界 Ω\nΘ(g(n)) | 上下界同阶 | 平均或紧确复杂度可用 Θ"}, {"t": "p", "s": "常见增长速度从慢到快为：1、log₂n、√n、n、n log₂n、n²、2ⁿ、n!。比较时关注 n 足够大后的趋势，常数和低阶项不改变大 O。"}, {"t": "code", "s": "for (i = 1; i * i <= n; ++i) x++;   /* O(sqrt(n)) */\nfor (i = 1; i <= n; ++i)             /* 两个循环并列：加起来 */\n    x++;\nfor (j = 1; j <= m; ++j)\n    y++;                              /* 总计 O(n + m)，不是 O(nm) */\n多变量规则  并列循环做加法，嵌套循环做乘法；n 和 m 相互独立时保留两个变量。只有题目明确 m 与 n 同阶，才可合并成单变量阶。\n均摊代价与单次代价\n顺序表满时若把容量扩大为原来的 2 倍，并把旧元素搬到新数组：第 n 次追加在恰好扩容时单次代价是 O(n)，但从空表连续追加 n 次，复制总量为 1+2+4+…，不超过 2n，因此追加的均摊复杂度是 O(1)。\n不要混写  “某一次扩容是 O(n)”与“连续 n 次追加的均摊代价是 O(1)”可以同时成立。答题时要先写清讨论的是单次最坏，还是操作序列的均摊。\n空间复杂度按算法运行时新增的辅助空间计算：输入本身通常不计；长度固定的临时数组是 O(n)；递归算法还要把递归深度对应的调用栈计入 O(深度)。\n一分钟自检  ① T(n)=2T(n/2)+n 是 O(n log n)；② 两个独立循环 for(i<n) 与 for(j<m) 并列时为 O(n+m)；③ 动态顺序表追加是均摊 O(1)，单次扩容仍为 O(n)。"}]}, {"id": "s1_5", "no": "1.5", "title": "60 秒检查", "level": 2, "body": [{"t": "p", "s": "同一种逻辑结构只能用一种存储结构实现。\n算法必须有输出，但输入可以为零个。\n顺序表按下标读取通常属于随机存取。\nO(n²) 的算法在任何输入规模下都一定比 O(n) 慢。\n数据结构只研究数据元素的值，不研究元素之间的关系。\n自评：以上陈述应为 ×、√、√、×、×。重点区分逻辑关系与存储实现，复杂度比较只描述增长趋势，不等同于小规模输入的实际运行秒数。"}]}, {"id": "ch2", "no": "第2章", "title": "线性表", "level": 1, "body": [{"t": "p", "s": "本章掌握门\n会说：顺序表、链表、头结点、存储密度及各自复杂度。\n会做：画四类链表形态；手写顺序表和链表的插入、删除代码。\n易错：单链表先改前驱 next；把“已定位后的 O(1)”误写成“插入总是 O(1)”。"}]}, {"id": "s2_1", "no": "2.1", "title": "线性表的定义", "level": 2, "body": [{"t": "p", "s": "线性表由 n（n≥0）个同类型数据元素组成，除首元素无前驱、末元素无后继外，其余元素有且仅有一个前驱和一个后继。线性表可以采用顺序存储或链式存储。\n引用型操作与加工型操作\n引用型操作只读取或使用表中的信息，不改变数据元素之间的关系，例如判空、求长度、按位取值、按值定位和遍历。加工型操作会改变线性表的状态，例如置空、修改元素、插入和删除。"}, {"t": "tbl", "s": "操作类型 | 是否改变结构 | 典型操作\n引用型 | 否 | ListEmpty、ListLength、GetElem、LocateElem、Traverse\n加工型 | 是 | ClearList、SetElem、ListInsert、ListDelete、DestroyList"}]}, {"id": "s2_2", "no": "2.2", "title": "顺序表", "level": 2, "body": [{"t": "p", "s": "地址计算与操作代价\n若首元素地址为 LOC(a₁)，每个元素占 c 个存储单元，则第 i 个元素的地址为：\nLOC(ai) = LOC(a1) + (i - 1) * c\n插入到第 i 位：从 an 到 ai 依次后移，共移动 n - i + 1 个元素\n删除第 i 位：从 ai+1 到 an 依次前移，共移动 n - i 个元素"}, {"t": "tbl", "s": "操作 | 顺序表 | 说明\n按位取值 | O(1) | 随机存取，可直接由地址公式计算\n查找给定值 | O(n) | 通常顺序扫描\n插入 | 平均 O(n) | 需要移动元素并检查容量\n删除 | 平均 O(n) | 需要保持后续元素连续\n存储密度 | 1 | 只存数据元素，不额外存链接指针"}, {"t": "p", "s": "平均与最坏移动次数\n长度为 n 的顺序表：插入平均移动 n/2 个元素，最坏 n 个；删除平均移动 (n-1)/2 个元素，最坏 n-1 个。\n顺序表插入"}, {"t": "code", "s": "Status ListInsert(SqList *L, int i, ElemType e) {\n    if (i < 1 || i > L->length + 1) return ERROR;\n    if (L->length >= MAXSIZE) return OVERFLOW;\n    for (int j = L->length; j >= i; --j)\n        L->data[j] = L->data[j - 1];   /* 从后往前移 */\n    L->data[i - 1] = e;\n    ++L->length;\n    return OK;\n}\n顺序表删除\nStatus ListDelete(SqList *L, int i, ElemType *e) {\n    if (i < 1 || i > L->length) return ERROR;\n    *e = L->data[i - 1];\n    for (int j = i; j < L->length; ++j)\n        L->data[j - 1] = L->data[j];   /* 从前往后移 */\n    --L->length;\n    return OK;\n}\n移动次数怎么记\n长度为 n 的顺序表，在第 i 位插入要移动 n-i+1 个元素；删除第 i 位要移动 n-i 个元素。插入是从最后一位往前搬，删除是从被删元素的下一位开始往前搬。\n课件顺序表接口：elem 指针与 0 下标\n讲义实现常把顺序表定义为“动态数组首地址 elem + 当前长度 length”。若题目的位序从 1 开始，则第 i 个元素存放在 elem[i-1]；不要把位序 i 直接当成 C 数组下标。\ntypedef struct {\n    ElemType *elem;   /* 动态数组首地址 */\n    int length;       /* 当前元素个数   */\n} SqList;\nL->elem[i - 1]       /* 1-based 位序 i 对应的 0 下标 */\n两种建表方式等价  静态数组 data[MAXSIZE] 与动态数组 elem 都可表示顺序表；区别主要在容量管理和是否允许运行期扩容。地址公式、插入删除移动方向与平均移动次数不变。"}]}, {"id": "s2_3", "no": "2.3", "title": "单链表", "level": 2, "body": [{"t": "p", "s": "结点、头指针与头结点"}, {"t": "code", "s": "typedef struct LNode {\n    ElemType data;\n    struct LNode *next;\n} LNode, *LinkList;\nHEAD -> [head node | next] -> [a1 | next] -> [a2 | next] -> NULL\n头指针保存链表入口；头结点位于首元结点之前，数据域通常无业务意义。头结点让“在第 1 个元素前插入”和“删除首元结点”与一般位置操作统一。统计表长时，头结点不计入数据元素个数。\n按位取值\nLNode *p = L->next;\nint j = 1;\nwhile (p != NULL && j < i) {\n    p = p->next;\n    ++j;\n}\nif (p == NULL || j > i) return ERROR;\n*e = p->data;\n插入与删除\n/* 在 p 所指结点之后插入 s */\ns->next = p->next;\np->next = s;\n/* 删除 p 的后继结点 q */\nq = p->next;\np->next = q->next;\nfree(q);\n指针顺序题\n单链表插入必须先让新结点接住原来的后继，再修改前驱的 next。若先做 p->next=s，原来的 p->next 就丢失，后面的结点可能再也找不到。\n单链表定位第 i-1 个结点需要 O(n)，但结点定位后，插入或删除只要 O(1)。所以不能笼统写成“链表插入删除都是 O(1)”，应写“已知前驱位置时为 O(1)”。"}]}, {"id": "s2_4", "no": "2.4", "title": "双向链表与循环链表", "level": 2, "body": [{"t": "code", "s": "typedef struct DuLNode {\n    ElemType data;\n    struct DuLNode *prior;\n    struct DuLNode *next;\n} DuLNode, *DuLinkList;\nNULL <- [prior|data|next] <-> [prior|data|next] <-> ... -> NULL\n双向链表插入与删除\n/* p 为插入位置的前驱结点，s 为新结点 */\ns->next = p->next;\ns->prior = p;\nif (p->next != NULL) p->next->prior = s;\np->next = s;\n/* q 为待删除结点 */\nq->prior->next = q->next;\nif (q->next != NULL) q->next->prior = q->prior;\nfree(q);\n双向链表比单链表多一个 prior 指针，插入和删除要同时维护两个方向。在有头结点并保证结点存在的前提下，双向链表删除某已知结点可直接 O(1) 完成。\n四种链表的空表特征"}, {"t": "tbl", "s": "结构 | 一般形态 | 空表形态或判断\n单链表 | 头结点 -> a1 -> ... -> an -> NULL | 头结点 -> NULL\n单循环链表 | an->next 回指头结点 | 头结点->next 指向自身\n双向链表 | 前后指针分别连接两个方向，首尾为空 | 头结点 prior、next 均为 NULL\n双向循环链表 | 首尾双向闭合 | 头结点 prior、next 均指向自身"}, {"t": "p", "s": "静态链表\n静态链表用数组保存结点，每个结点的 next 域保存后继所在数组下标而不是内存地址。它适合不直接支持指针的语言；0 下标可预留为备用链入口或头结点，-1 常表示空指针。\n头插、尾插、清空与销毁\n带头结点单链表采用头插法时，每读入一个元素就插在头结点之后，最终表内顺序与输入顺序相反。若要得到 a₁,a₂,…,aₙ，应按逆序 aₙ,…,a₁ 输入，或先头插再逆置。尾插法需要维护尾指针，才能避免每次重新寻找表尾。"}, {"t": "tbl", "s": "操作 | 处理对象 | 操作后的状态\nClearList | 释放除头结点外的数据结点 | 保留头结点，成为空表\nDestroyList | 释放全部结点，包括头结点 | 整个链表结构被销毁\nHeadInsert | 逐个插入头结点之后 | 输入顺序被反转\nTailInsert | 在尾结点之后追加 | 保持输入顺序"}, {"t": "code", "s": "void ClearList(LinkList L) {\n    LNode *p;\n    while (L->next != NULL) {\n        p = L->next;\n        L->next = p->next;\n        free(p);\n    }\n}   /* 头结点仍保留，可用于继续插入 */\n清空不等于销毁  清空后链表仍可继续使用；销毁后头指针也不能再解引用。答题时先看函数名和题目要求，避免清空后把 L 置空。"}]}, {"id": "s2_5", "no": "2.5", "title": "顺序表与链表的选择", "level": 2, "body": [{"t": "tbl", "s": "比较项 | 顺序表 | 链表\n存储空间 | 连续、需预先分配 | 动态申请，结点不要求连续\n按位存取 | O(1)，随机存取 | O(n)，顺序存取\n插入删除 | 通常 O(n)，需移动元素 | 已知位置后 O(1)，需改指针\n存储密度 | 1 | 小于 1，需要额外指针空间\n适用场景 | 频繁按位访问、长度较稳定 | 频繁在已知结点附近插入删除、长度变化大"}, {"t": "p", "s": "案例分析口诀\n频繁随机访问、表长稳定：优先顺序表。频繁在表头或已定位位置插入删除：优先链表。经常只在表尾插入删除：顺序表通常更合适；在链表尾部操作还要先找到尾结点。"}]}, {"id": "s2_6", "no": "2.6", "title": "线性表应用", "level": 2, "body": [{"t": "p", "s": "集合去重与有序归并\n把 B 中元素逐个取出，在 A 中查找；若不存在再插入。两层循环的最坏复杂度为 O(nm)。若 A、B 已经有序，可以用双指针归并，使总复杂度降为 O(n+m)。"}, {"t": "code", "s": "/* 有序表归并：结果允许重复元素 */\nwhile (i <= A.length && j <= B.length) {\n    if (A.data[i] <= B.data[j]) C.data[k++] = A.data[i++];\n    else                         C.data[k++] = B.data[j++];\n}\nwhile (i <= A.length) C.data[k++] = A.data[i++];\nwhile (j <= B.length) C.data[k++] = B.data[j++];\n这里 A、B 都是“非递减有序表”：允许相邻元素相等，禁止从后往前减小。若做纯集合合并，相等元素只能保留一次。\n稀疏一元多项式\n若多项式为 3x¹⁰⁰ + 5x²⁰⁰⁰⁰，只存全部系数会浪费大量空间。可把每个非零项定义为“系数 + 指数”的结构体，再用线性表按指数顺序存储。\n讲义例题：稀疏多项式相加\n设 P(x)=3x³+2x+5，Q(x)=x²+4x+2。按指数从高到低合并同类项：三次项只有 3x³，二次项只有 x²，一次项 2x+4x=6x，常数项 5+2=7，因此 P(x)+Q(x)=3x³+x²+6x+7。\n用“系数 + 指数”的线性表保存时，两个表都按指数有序。归并过程中指数相同则系数相加、结果为零可删去该项；指数不同则把较大指数项先写入结果。时间复杂度为 O(m+n)，额外结果空间与结果项数成正比。"}]}, {"id": "s2_7", "no": "2.7", "title": "高频链表算法", "level": 2, "body": [{"t": "p", "s": "快慢指针、逆置与删除指定值"}, {"t": "code", "s": "/* 求中间结点：偶数长度返回上中位结点 */\np = q = head->next;\nwhile (q != NULL && q->next != NULL) {\n    p = p->next;\n    q = q->next->next;\n}\n/* 就地逆置：从原表取结点，头插到新表 */\np = head->next;\nhead->next = NULL;\nwhile (p != NULL) {\n    q = p->next;\n    p->next = head->next;\n    head->next = p;\n    p = q;\n}\n/* 删除所有值为 x 的结点 */\npre = head; p = head->next;\nwhile (p != NULL) {\n    if (p->data == x) {\n        pre->next = p->next;\n        free(p);\n        p = pre->next;\n    } else {\n        pre = p;\n        p = p->next;\n    }\n}\n快慢指针一次遍历即可求中点，额外空间 O(1)；逆置只允许修改 next，不建立新数据结点；删除全部指定值时必须保留前驱，否则删除后会无法重新连接后继。"}]}, {"id": "s2_8", "no": "2.8", "title": "线性表强化：均摊、边界与经典算法", "level": 2, "body": [{"t": "p", "s": "线性表复习不能停在“顺序表和链表谁快”。考试常同时检查地址公式、平均移动次数、空表与单结点边界，以及能否在 O(n) 时间内用一个前驱或两个指针完成变换。\n顺序表地址、移动与扩容"}, {"t": "tbl", "s": "前提 | 第 i 个元素的地址 | 使用提醒\n下标从 1 开始 | LOC(aᵢ)=LOC(a₁)+(i-1)c | 教材最常见的写法\n下标从 0 开始 | LOC(aᵢ)=LOC(a₀)+ic | C 语言数组常用\n每个元素占 c 字节 | 地址差要先乘 c | 不能只加上元素序号差"}, {"t": "p", "s": "若在 n+1 个合法插入位置中等概率插入，平均移动次数为 [n+(n-1)+…+1+0]/(n+1)=n/2；若在 n 个位置中等概率删除，平均移动次数为 [(n-1)+(n-2)+…+1+0]/n=(n-1)/2。\n动态顺序表  扩容本身需要申请新连续空间、复制旧元素并释放旧空间，单次最坏 O(n)；倍增扩容的序列均摊 O(1)。链表随机插入虽然常为 O(1)，定位前驱仍可能需要 O(n)。\n单链表的四个边界"}, {"t": "tbl", "s": "边界场景 | 检查内容 | 常见错误\n空表 | 头结点 next 为空；遍历立即结束 | 先解引用 p->next\n只有一个结点 | 删除后头结点回到空表态 | 删除后未更新尾指针或长度\n在表头操作 | 有头结点时先定位到 head | 误把首元结点当成 head\n在表尾操作 | 删除尾结点要找到其前驱 | 以为有 rear 就永远 O(1)"}, {"t": "p", "s": "头指针是访问链表的入口变量；头结点是额外分配的真实结点。头指针不能为空且指向头结点；头结点的 next 为空时表示空表。首元结点是第一个真正保存业务数据的结点。\n环检测与入环点\n快指针每次走两步、慢指针每次走一步。若有环，二者一定在环内相遇；相遇后把一个指针放回首元结点，两指针都改成每次一步，再次相遇的位置就是入环点。整个过程只增加两个指针，额外空间 O(1)。\nLNode *CycleEntry(LNode *head) {"}, {"t": "code", "s": "LNode *slow = head->next, *fast = head->next;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n        if (slow == fast) break;\n    }\n    if (!fast || !fast->next) return NULL;\n    slow = head->next;\n    while (slow != fast) {\n        slow = slow->next;\n        fast = fast->next;\n    }\n    return slow;\n}\n指针题检查法  每改一次 next，都问三个问题：是否先保存了后继？新结点是否已经接好？操作结束后空表、单结点、表头、表尾是否仍正确？\n链表高频算法补强"}, {"t": "tbl", "s": "题目 | 关键不变量 | 时间 / 额外空间\n删除倒数第 k 个结点 | 快指针先走 k 步，再同步走 | O(n) / O(1)\n两有序单链表归并 | 哑结点 + tail，每次接较小结点 | O(n+m) / O(1)\n就地逆置 | 摘下当前结点，头插到结果链表 | O(n) / O(1)\n删除全部值 x | 始终保留 p 的前驱 pre | O(n) / O(1)\n求两个有序表交集 | 双指针，相等才输出并同时后移 | O(n+m) / O(1)"}, {"t": "p", "s": "有序归并时若允许重复值，相等元素两个都接上；若求纯集合，相等元素只保留一个，并在两个表中都后移。题目中的“有序”要区分非递减与严格递增。\n结论口径  “链表插入删除为 O(1)”只适用于已经掌握前驱或待删结点地址的情况；若题目从表头按位查找，完整操作代价仍是 O(n)。"}]}, {"id": "s2_9", "no": "2.9", "title": "指针改图训练", "level": 2, "body": [{"t": "p", "s": "在单链表结点 p 之后插入新结点 s，先写哪一条指针语句？\n删除 p 的后继结点 q，至少需要修改哪一条指针？\n在双向链表中把 s 插入 p 之后，需要修改哪四条指针？\n两个长度分别为 n、m 的非递减有序表归并为一个有序表，最优复杂度是多少？\n核对\n1. 先 s->next=p->next。2. p->next=q->next，然后 free(q)。3. s->next=p->next；s->prior=p；p->next->prior=s；p->next=s。4. 双指针归并只需 O(n+m)。"}]}, {"id": "ch3", "no": "第3章", "title": "栈、队列与递归", "level": 1, "body": [{"t": "p", "s": "本章掌握门\n会说：LIFO、FIFO、栈空栈满、队空队满、递归出口。\n会做：手推入栈出栈、链队列出入队、循环队列取模；完成中缀转后缀。\n易错：循环队列少用一个单元；删除链队列最后一个元素后忘记重置 rear。"}]}, {"id": "s3_1", "no": "3.1", "title": "栈：后进先出", "level": 2, "body": [{"t": "p", "s": "栈只允许在同一端插入和删除，操作端称为栈顶，另一端称为栈底。插入叫入栈或压栈，删除叫出栈或弹栈。典型时间复杂度均为 O(1)。\n顺序栈条件"}, {"t": "code", "s": "typedef struct {\n    ElemType data[MAXSIZE];\n    int top;\n} SqStack;\n初始化：S.top = -1;\n空栈：  S.top == -1;\n满栈：  S.top == MAXSIZE - 1;\n入栈：S.data[++S.top] = e;\n出栈：e = S.data[S.top--];\n若教材采用“两个指针 base 与 top”的定义，则空栈为 top == base，栈满为 top - base == MAXSIZE。判定条件要与题目给出的存储定义一致。"}, {"t": "tbl", "s": "top 约定 | 栈空 | 栈满 | 入栈 / 出栈"}, {"t": "code", "s": "top 指向当前栈顶 | top == -1 | top == MAXSIZE-1 | data[++top]=x; / x=data[top--]\ntop 指向栈顶上一空位 | top == 0 | top == MAXSIZE | data[top++]=x; / x=data[--top]\n数组 V[1..n]，top 向下生长 | top == n+1 | top == 1 | --top; V[top]=x; / x=V[top++]\n课件顺序栈口径：base/top 指向下一空位\n讲义版顺序栈用 base 指向数组首地址，top 指向当前栈顶元素的下一个空位。因此空栈为 top==base，满栈为 top-base==stackSize；入栈写 *top++=e，出栈写 e=*--top。\n空栈：  S.top == S.base\n满栈：  S.top - S.base == S.stackSize\n入栈：  *S.top++ = e;\n出栈：  e = *--S.top;\n取栈顶：e = *(S.top - 1);   /* 不移动 top */\n与整数 top 版本互换算  若用整数 top 且 top 指向下一空位，则空栈 top==0、满栈 top==MAXSIZE；若 top 指向当前栈顶，则空栈 top==-1、满栈 top==MAXSIZE-1。公式必须与定义成套使用。\n链栈\n链栈通常把栈顶放在链表首端，所有插入和删除都在头结点之后完成，避免为了找尾结点而遍历。画面箭头时可理解为由栈顶向栈底连接。"}]}, {"id": "s3_2", "no": "3.2", "title": "栈的典型应用", "level": 2, "body": [{"t": "p", "s": "括号匹配\n遇左括号入栈；遇右括号先检查栈非空，再弹出栈顶并核对类型。扫描结束后栈必须为空，否则说明还有左括号未匹配；右括号出现时若栈空，说明右括号多余。"}, {"t": "code", "s": "int BracketMatch(const char *s) {\n    SqStack st;\n    InitStack(&st);\n    for (int i = 0; s[i] != '\\0'; ++i) {\n        char c = s[i];\n        ElemType top;\n        if (c == '(' || c == '[' || c == '{') {\n            Push(&st, (ElemType)c);\n        } else if (c == ')' || c == ']' || c == '}') {\n            if (Pop(&st, &top) != OK) return 0;\n            if ((c == ')' && (char)top != '(') ||\n                (c == ']' && (char)top != '[') ||\n                (c == '}' && (char)top != '{')) return 0;\n        }\n    }\n    return StackEmpty(&st);\n}\n数制转换\n十进制转任意进制采用“取余入栈、商继续除”，最后从栈顶依次弹出余数，即可得到从高位到低位的目标进制数。\nvoid ConvertBase(unsigned int n, int base) {\n    SqStack st;\n    InitStack(&st);\n    do {\n        Push(&st, n % base);\n        n /= base;\n    } while (n != 0);\n    while (!StackEmpty(&st)) {\n        int digit;\n        Pop(&st, &digit);\n        putchar(digit < 10 ? '0' + digit : 'A' + digit - 10);\n    }\n}"}]}, {"id": "s3_3", "no": "3.3", "title": "队列：先进先出", "level": 2, "body": [{"t": "p", "s": "链队列\nFRONT -> [head node] -> [a1] -> [a2] -> ... -> [an]\n                                      REAR --------^\n空队列：front == rear\n入队：修改 rear 所指结点的 next，再令 rear = 新结点\n出队：删除 front->next，并将 front->next 指向其后继\n链队列的隐藏陷阱\n删除队列中最后一个数据结点后，front 和 rear 会分离。必须把 rear 重新指回 front，否则空队列条件 front == rear 不成立，后续入队和出队都会出错。\n循环队列\n顺序队列如果每次出队都整体搬移，效率低；循环队列用取模让 rear 和 front 在数组中循环移动。为区分“空”和“满”，通常少用一个单元。\n容量为 M："}, {"t": "code", "s": "初始化：front = rear = 0;\n队空：  front == rear;\n队满：  (rear + 1) % M == front;\n队长：  (rear - front + M) % M;\n入队后：rear  = (rear  + 1) % M;\n出队后：front = (front + 1) % M;"}, {"t": "tbl", "s": "题型 | 公式或结论\n最大可存数据元素数 | M-1（采用浪费一个单元判满时）"}, {"t": "p", "s": "已知 front、rear、M 求长度 | (rear - front + M) % M"}, {"t": "tbl", "s": "下一个 rear 下标 | (rear + 1) % M\n判断空队 | front == rear\n判断满队 | (rear + 1) % M == front"}, {"t": "p", "s": "顺序队列的假溢出\n顺序队列出队时若只移动 front 而不搬移元素，rear 会不断逼近数组末端；即使 front 前方仍有空单元，也可能无法继续入队，这就是假溢出。循环队列用取模复用空间解决。\n出栈序列合法性\n最稳妥的方法是模拟：按待验证出栈顺序逐项检查，若栈顶正等于当前待出元素就弹出；否则继续从入栈序列压入；入栈耗尽仍无法弹出则非法。速判规则：任一较大元素之后出现且比它小的元素，必须按从大到小排列。"}, {"t": "code", "s": "int IsPopSequence(const int in[], const int out[], int n) {\n    SqStack st;\n    InitStack(&st);\n    int i = 0, j = 0, top;\n    while (j < n) {\n        if (!StackEmpty(&st) && GetTop(&st, &top) == OK &&\n            top == out[j]) {\n            Pop(&st, &top);\n            ++j;\n        } else if (i < n) {\n            Push(&st, in[i++]);\n        } else {\n            return 0;\n        }\n    }\n    return StackEmpty(&st);\n}\n合法序列数量\n1,2,…,n 依次入栈、过程中允许随时出栈，合法的出栈序列总数为 Catalan 数：C(2n,n)/(n+1)。n=3 时共有 5 种。"}]}, {"id": "s3_4", "no": "3.4", "title": "递归", "level": 2, "body": [{"t": "p", "s": "递归函数在定义中直接或间接调用自身。必须同时具备递归出口和向出口推进的递归关系，否则会持续压栈，最终导致栈溢出。递归调用和返回依赖系统栈保存现场。\n阶乘与斐波那契\nlong long fact(int n) {"}, {"t": "code", "s": "if (n == 0) return 1;          /* 递归出口 */\n    return n * fact(n - 1);        /* 递归关系 */\n}\nlong long fib(int n) {\n    if (n == 1 || n == 2) return 1;\n    return fib(n - 1) + fib(n - 2);\n}\n分析 fact(4) 时按 4→3→2→1→0 逐层调用，到达 fact(0) 后开始逐层返回；斐波那契的每次非出口调用会分成左右两支，应画递归树而不是一条直线。\n递归工作栈、汉诺塔与二进制输出\n递归要同时满足三点：原问题能转化为规模更小的同类问题；转化后的参数确实向出口推进；存在明确的终止条件。每次调用会把实参、局部变量和返回地址形成工作记录压入递归工作栈，返回时按“后调用先返回”的次序恢复现场。\nvoid Hanoi(int n, char A, char B, char C) {\n    if (n == 1) {\n        move(A, 1, C);\n    } else {\n        Hanoi(n - 1, A, C, B);\n        move(A, n, C);\n        Hanoi(n - 1, B, A, C);\n    }\n}\n汉诺塔的移动次数满足 f(n)=2f(n-1)+1、f(1)=1，展开得 f(n)=2ⁿ-1，所以时间 O(2ⁿ)；递归深度为 n，工作栈空间 O(n)。\nvoid PrintBits(unsigned int n) {\n    if (n == 0) return;\n    PrintBits(n / 2);      /* 先递归处理高位 */\n    printf(\"%u\", n % 2);  /* 返回时再输出当前低位 */\n}\nvoid PrintBinary(unsigned int n) {\n    if (n == 0) printf(\"0\");\n    else PrintBits(n);\n}\n递归顺序  先递归、后输出，才能得到从高位到低位的二进制；如果先求 n/2 再输出，当前层的 n%2 已经丢失。递归题要写清“调用阶段做什么、返回阶段做什么”。"}]}, {"id": "s3_5", "no": "3.5", "title": "表达式转换与后缀式求值", "level": 2, "body": [{"t": "p", "s": "中缀转后缀\n操作数按原顺序直接输出；运算符进入运算符栈。当前运算符优先级不高于栈顶时，先弹出栈顶并输出；左括号直接入栈，右括号弹出到左括号为止。使用结束符 # 时，最后让两个 # 相遇，确保栈清空。"}, {"t": "tbl", "s": "运算符 | 相对优先级 | 处理要点\n* / | 高 | 通常先于 + - 弹出\n+ - | 中 | 遇到同级的先前运算符通常先弹栈\n( | 括号边界 | 入栈，阻止括号内外运算符直接结算\n) | 括号结束 | 弹出到左括号为止，后缀式不保留括号\n# | 最低 | 表达式结束哨兵，最后清空运算符栈"}, {"t": "p", "s": "完整示例\n中缀：A + B * (C - D) - E / F\n后缀：A B C D - * + E F / -\n检查方法：操作数之间的相对次序不能改变；每个运算符的两个操作数必须紧挨在它左侧的已完成结果中。\n后缀式求值\n从左到右扫描后缀式：遇到操作数入栈；遇到二元运算符时，先弹出的是第二操作数，后弹出的是第一操作数，计算后再把结果压回栈中。\n例：5 3 2 * + 8 4 / - 的计算过程为 3*2=6，5+6=11，8/4=2，11-2=9。减法与除法有方向，不能把两个操作数的弹出顺序写反。"}]}, {"id": "s3_6", "no": "3.6", "title": "队列的典型应用", "level": 2, "body": [{"t": "p", "s": "打印机缓冲区：多个任务按提交顺序依次处理，符合先进先出。\n医院或加油站排队：乘客、车辆先到先服务；多服务窗口可建模为多个队列。\n层次遍历与模拟：队列保存“等待下一轮处理”的元素，保证按层、按时间推进。\n讲义应用补充：回溯、层序与缓冲区"}, {"t": "tbl", "s": "应用 | 选用结构 | 原因\n迷宫回溯 | 栈 | 无路可走时退回最近保存的位置\n树的层次遍历 | 队列 | 先访问的结点先扩展其子结点\n打印任务缓冲 | 队列 | 多个任务按到达顺序依次处理\n杨辉三角逐层生成 | 队列 | 保存当前层，按层计算下一层"}]}, {"id": "s3_7", "no": "3.7", "title": "栈与队列手推训练", "level": 2, "body": [{"t": "p", "s": "元素 1、2、3、4 依次入栈，出栈顺序为 2、4、3、1，栈的容量最少是多少？\n循环队列 M=8，front=6，rear=2，队列长度是多少？再插入一个元素后 rear 是多少？\n链队列只有一个数据结点，删除它后 front 与 rear 应处于什么关系？\n计算后缀式 5 3 2 * + 8 4 / - 的值。\n手推答案\n1. 容量最少为 2。2. 当前长度 (2-6+8)%8=4；下一次 rear=(2+1)%8=3。3. 释放结点后应令 rear=front，恢复空队列条件。4. 结果是 9。"}]}, {"id": "s3_8", "no": "3.8", "title": "栈、队列与递归强化", "level": 2, "body": [{"t": "p", "s": "栈和队列的公式不难，真正失分多来自指针定义与容量约定不一致。下面先把共享栈、循环队列的常见方案放在同一张表里，再补递归栈、后缀式合法性和表达式边界。\n共享栈：两端向中间生长\n两个顺序栈共享数组 data[0..M-1]：栈 1 从左向右生长，top1 初始为 -1；栈 2 从右向左生长，top2 初始为 M。只有 top1+1==top2 才表示共享空间已满。"}, {"t": "code", "s": "typedef struct {\n    ElemType data[M];\n    int top1;   /* 初始 -1 */\n    int top2;   /* 初始 M  */\n} SharedStack;\nS.top1 == -1 && S.top2 == M   /* 两个栈都空 */\nS.top1 + 1 == S.top2          /* 共享空间已满 */\nS.data[++S.top1] = x;         /* 栈 1 入栈 */\nS.data[--S.top2] = x;         /* 栈 2 入栈 */\n容量理解  共享栈不会增加总容量，只是让两个栈按需分配剩余空间；当一栈很浅、另一栈很深时利用率更高。\n循环队列三种判满方案"}, {"t": "tbl", "s": "方案 | 队空条件 | 队满条件 | 可用元素数\n少用一个单元 | front==rear | (rear+1)%M==front | M-1\n维护 size | size==0 | size==M | M\n维护 tag | front==rear 且 tag=0 | front==rear 且 tag=1 | M"}, {"t": "p", "s": "采用 size 或 tag 时，数组 M 个单元全部可存数据；采用牺牲单元方案时只能存 M-1 个。若题目只给 front、rear 和 M，没有 size 或 tag，通常默认牺牲一个单元。\n先读定义再套公式  rear 有的教材指向队尾元素，有的指向下一个空位。入队、出队代码与长度公式必须和题目给出的定义配套，不能把两种约定混用。\n递归的栈帧与复杂度"}, {"t": "tbl", "s": "递归问题 | 时间复杂度 | 递归栈空间 | 优化方向\n阶乘 fact(n) | O(n) | O(n) | 可改循环，额外空间 O(1)\n朴素斐波那契 fib(n) | 指数级，约 O(φⁿ) | O(n) | 迭代或记忆化，避免重复子问题\n递归折半查找 | O(log n) | O(log n) | 也可改迭代\n递归遍历单链表 | O(n) | O(n) | 改迭代可把辅助空间降为 O(1)"}, {"t": "p", "s": "递归入口到出口的最大层数决定栈空间。递归关系正确但缺少出口、出口不可达，或参数没有向出口缩小，都会造成无限递归。\n后缀式、括号与序列合法性\n后缀式合法性可用计数法检查：操作数记为 +1，二元运算符记为 -1；从左向右扫描时计数始终至少为 1，结束时恰好为 1。任何一步小于 1 都说明运算符缺操作数，结束大于 1 说明还有操作数未参与运算。\n运算顺序  后缀求值弹出两个操作数时，先弹出的是右操作数，后弹出的是左操作数；减法和除法尤其不能反过来。中缀转后缀遇到同级左结合运算符时，先弹出栈顶再入栈。\n元素 1..n 依次入栈、允许中途出栈时，合法出栈序列共有 Catalan(n)=C(2n,n)/(n+1) 种。具体判断某个序列时优先模拟，不要只凭肉眼寻找递减关系。"}]}, {"id": "s3_9", "no": "3.9", "title": "讲义典型题与递归链表补强", "level": 2, "body": [{"t": "p", "s": "以下题目来自讲义中与栈、队列、递归直接相关的思考题。先写状态变化，再给结论，能避免只记答案而无法迁移。"}, {"t": "tbl", "s": "题型 | 关键推导 | 结论\n基本栈操作序列 | push(1),pop,push(2),push(3),pop,pop,push(4),pop | 出栈序列 1,3,2,4\n栈转队列的最小容量 | e1..e6 依次经栈进入队列，输出 e2,e4,e3,e6,e5,e1 | 栈容量至少为 3\n循环队列跟踪 | M=6，入 ABCD，出 2 次，再入 EFG | 队列 C,D,E,F,G，已满\n递归计数 | X(n)=1（n≤3），否则 X(n-2)+X(n-4)+1 | X(8)=9，X(9)=9，合计调用 18 次"}, {"t": "p", "s": "递归扫描带头结点单链表时，从 L->next 开始。求结点数与求和的递归出口都是 p==NULL；对非空表，平均值可由“总和 ÷ 结点数”得到。"}, {"t": "code", "s": "int CountL(LNode *p) {\n    if (p == NULL) return 0;\n    return 1 + CountL(p->next);\n}\ndouble SumL(LNode *p) {\n    if (p == NULL) return 0.0;\n    return p->data + SumL(p->next);\n}\n/* 非空链表平均值：SumL(L->next) / CountL(L->next) */\n复杂度结论  递归求链表结点数、总和或最大值均为时间 O(n)、工作栈 O(n)。分别调用一次 CountL 和一次 SumL 仍是 O(n)+O(n)=O(n)，不要误写成 O(n²)。"}]}, {"id": "ch4", "no": "第4章", "title": "串、数组与模式匹配", "level": 1, "body": [{"t": "p", "s": "本章掌握门\n会说：空串与空格串、子串边界、三种串存储、BF 与 KMP。\n会做：手算 next/nextval；说明 BF 回溯；完成环状病毒串的拆分匹配。\n易错：误以为 KMP 的主串指针也会回溯；把 next 前两项算错；把环状性错误地加给主串。"}]}, {"id": "s4_1", "no": "4.1", "title": "串的基本概念与操作", "level": 2, "body": [{"t": "p", "s": "串是由零个或多个字符组成的有限序列。串长是字符个数；空串不含字符，空格串至少包含一个空格字符，两者不相等。判断两个串相等必须同时满足长度相等、对应位置字符全部相等。"}, {"t": "tbl", "s": "操作 | 作用 | 常见考点\nStrAssign | 赋串值或建立串 | C 字符数组通常不能直接整体赋值\nStrCopy | 复制串 | 复制后得到独立的串值\nStrLength | 求串长 | 定长存储时长度常在 0 下标\nStrCompare | 按字符编码次序比较 | 长度不是唯一判断依据\nSubString | 求连续子串 | 不是一般子序列，字符必须连续\nIndex | 定位模式串第一次出现位置 | 从 pos 开始查找，未找到返回 0\nConcat | 连接两个串 | 注意容量与截断\nReplace | 替换子串 | 看清一次替换还是迭代替换"}, {"t": "p", "s": "子串位置边界\n设主串长度为 n，从第 pos 位开始取长度为 len 的子串，必须满足：\n1 <= pos <= n\n0 <= len <= n - pos + 1\n若已知 len，则 pos 的最大值为 n - len + 1"}]}, {"id": "s4_2", "no": "4.2", "title": "串的三种存储结构", "level": 2, "body": [{"t": "tbl", "s": "存储方式 | 结构特征 | 优点与代价\n定长顺序存储 | 字符数组，通常 0 下标保存长度，超出最大长度截断 | 访问快；长度受上限约束\n堆分配存储 | 运行时按串长分配连续空间，C 语言常用 '\\0' 结束 | 长度灵活；需要动态管理空间\n块链存储 | 每个结点存一个字符块，再用指针连接块 | 减少单字符结点的指针浪费"}, {"t": "p", "s": "定长存储的数字\n若最大串长为 255，且用 0 下标保存长度，则字符数组通常需要 MAXSTRLEN+1，即 256 个单元。实际串长仍不能超过 255；连接后超出上限的部分会被截断。"}]}, {"id": "s4_3", "no": "4.3", "title": "BF 朴素模式匹配", "level": 2, "body": [{"t": "p", "s": "主串 S 长度为 n，模式串 T 长度为 m。BF 从主串第 pos 位开始逐字符比较：相等则两指针同时后移；失配则模式串回到第 1 位，主串回到本次起点的下一位。"}, {"t": "code", "s": "int IndexBF(const SString S, const SString T, int pos) {\n    int i = pos, j = 1;\n    while (i <= S[0] && j <= T[0]) {\n        if (S[i] == T[j]) {\n            ++i;\n            ++j;\n        } else {\n            i = i - j + 2;   /* 下一次从原起点后一位开始 */\n            j = 1;\n        }\n    }\n    if (j > T[0]) return i - T[0];\n    return 0;\n}\nBF 结果速记\n成功时返回匹配子串在主串中的起始下标，失败返回 0；1-based 失配时 i=i-j+2、j=1。最好接近 O(n)，最坏为 O(nm)：可能每次都匹配到模式串末尾才失配。"}]}, {"id": "s4_4", "no": "4.4", "title": "KMP：利用已匹配信息", "level": 2, "body": [{"t": "p", "s": "KMP 的核心是主串指针 i 不回溯。失配时保留 i，只根据模式串自身的 next 值移动 j，把模式串中已经确认相同的真前缀直接对齐到当前后缀位置。时间复杂度为 O(n+m)。\nnext 的手算规则\n按 1-based 计数，固定 next[1]=0、next[2]=1。\n求 next[j]（j≥3）时，只看模式串第 j 位之前的串。\n找“最长相等真前缀与真后缀”的长度 k，则 next[j]=k+1。\n不允许把整个 j-1 位前缀取进来，必须是真前缀。\n找不到非空相等前后缀时，next[j]=1。\n手算样例：ABABACA\n模式串：A B A B A C A\nnext：  0 1 1 2 3 4 1\n验证：第 6 位 C 之前的 ABABA，最长相等真前后缀为 ABA，长度 3，所以 next[6]=4。\nnextval 的手算规则\nnextval 用来跳过“回溯后仍与当前失配位置相同的字符”。从第 1 位开始计算：\nnextval[1] = 0\n若 T[j] == T[next[j]]：\n    nextval[j] = nextval[next[j]]\n否则：\n    nextval[j] = next[j]\n对 ABABACA，对应的 nextval 为：0 1 0 1 0 4 0。遇到相同字符就继续沿用前一个改进值，目的是避免主串当前字符与同值模式字符重复比较。\nKMP 匹配代码框架"}, {"t": "code", "s": "int IndexKMP(const SString S, const SString T, int pos) {\n    int next[MAXSTRLEN + 1];\n    GetNext(T, next);\n    int i = pos, j = 1;\n    while (i <= S[0] && j <= T[0]) {\n        if (j == 0 || S[i] == T[j]) {\n            ++i;\n            ++j;\n        } else {\n            j = next[j];\n        }\n    }\n    if (j > T[0]) return i - T[0];\n    return 0;\n}\n复杂度与考场表述\n求 next 的代价为 O(m)，模式匹配过程为 O(n)，总复杂度 O(n+m)。不要写成 O(n²)，也不要把主串指针回溯写进 KMP。"}]}, {"id": "s4_5", "no": "4.5", "title": "环状病毒 DNA 检测", "level": 2, "body": [{"t": "p", "s": "病毒 DNA 可视作环状串，患者 DNA 是线性主串。若病毒序列长为 m，可把病毒串连续复制两次，再分别截取 m 个起点对应的 m 个子串，每个子串都作为模式串与患者 DNA 做匹配。只要一个匹配成功，就判定为感染。\n例如病毒串为 ABA，则需检测 ABA、BAA、AAB。不能直接在患者 DNA 上首尾绕回，因为患者 DNA 是线性的；环状性来自病毒序列，而不是主串。"}]}, {"id": "s4_6", "no": "4.6", "title": "串匹配手推训练", "level": 2, "body": [{"t": "p", "s": "先独立计算模式串 AABAA 的 next 与 nextval，再对照下面的结果检查。计算每一位时只观察它之前的子串。\nAABAA 手算答案\nnext：0、1、2、1、2。\nnextval：0、0、2、0、0。\nKMP 已经确认失配位置之前的主串片段与模式串前缀相同，因此把模式串滑动到合适的真前后缀重叠位置即可继续比较。"}]}, {"id": "s4_7", "no": "4.7", "title": "数组强化：地址计算、压缩存储与稀疏矩阵", "level": 2, "body": [{"t": "p", "s": "原稿第 4 章已充分覆盖串和 KMP，但章名中的“数组”还需要单独补齐。数组题通常只考两个动作：按存储次序计算地址，以及把特殊矩阵的非零区域映射到一维数组。\n二维数组的地址公式\n设二维数组 A 有 m 行、n 列，每个元素占 c 个存储单元，首元素地址为 LOC(A)。先确定是行优先还是列优先，再数目标元素前面有多少个元素。"}, {"t": "tbl", "s": "存储方式 | 0 下标的一维偏移 | 1 下标的一维偏移\n行优先 | i*n+j | (i-1)*n+(j-1)\n列优先 | j*m+i | (j-1)*m+(i-1)"}, {"t": "p", "s": "LOC(A[i][j]) = LOC(A[0][0]) + (i*n + j) * c   /* 行优先、0 下标 */\nLOC(A[i][j]) = base + ((i-1)*n + (j-1)) * c  /* 行优先、1 下标 */\nLOC(A[i][j]) = base + (j*m + i) * c          /* 列优先、0 下标 */\n算例  A[0..9][0..9] 采用行优先，首地址 1000，每个元素 4 字节，则 A[3][5] 前有 3×10+5=35 个元素，地址为 1000+35×4=1140。\n特殊矩阵的压缩下标\n压缩存储的核心是：利用矩阵元素的相等关系或零元素规律，只存独立元素，并把二维下标 (i,j) 映射为一维下标 k。下面均采用 0 下标的矩阵元素，并说明一维数组从 0 下标开始。"}, {"t": "tbl", "s": "矩阵类型 | 非零或独立元素数 | 常用映射"}, {"t": "p", "s": "n 阶对称矩阵 | n(n+1)/2 | 只存下三角；A[i][j] 与 A[j][i] 共用"}, {"t": "tbl", "s": "n 阶下 / 上三角 | n(n+1)/2 | 按下三角行优先：k=i(i+1)/2+j\nn 阶三对角矩阵 | 3n-2 | 只存 |i-j|≤1；k=i+j"}, {"t": "p", "s": "n 阶对角矩阵 | n | 只存主对角线 A[i][i]\n对称矩阵保存下三角时：若 i≥j，k=i(i+1)/2+j；若 i<j，先交换 i、j 再代入。若一维数组从 1 开始编号，则最终下标再整体加 1。"}, {"t": "code", "s": "/* 对称矩阵，0 下标，只存下三角 */\nif (i >= j) k = i*(i+1)/2 + j;\nelse        k = j*(j+1)/2 + i;\n/* 三对角矩阵，0 下标，按行存非零带 */\nk = i + j;                 /* 0 <= k <= 3n-3 */\n地址题顺序  先判断行优先/列优先，再判断下标从 0 还是 1 开始，最后判断压缩数组自身从哪一位编号。三个约定任一处看错，结果就会只差 1。\n稀疏矩阵的三元组表示\n稀疏矩阵通常只记录非零元素，三元组为 (行号, 列号, 值)，另存总行数、总列数和非零元素个数 t。若矩阵有 r 行、c 列，三元组的存储量为 O(t)，而不必保存全部 rc 个零。\n普通转置可以按列扫描三元组：每处理一列都要遍历全部 t 个元素，最坏 O(c·t)。快速转置先统计每列的非零个数和起始位置，再一次扫描放入新三元组，复杂度可写成 O(r+c+t)。\n选择结构  普通二维数组适合非零元素较多的矩阵，访问 O(1)；三元组适合稀疏矩阵，节省空间，但随机访问某个位置需要查找，不能直接按下标 O(1) 定位。\n字符串与 KMP 的补充边界"}, {"t": "tbl", "s": "规则 | 结论或公式 | 易错点\n空串与空格串 | 长度分别为 0 与至少 1 | 二者不相等\nBF 最坏比较次数 | 上界 m(n-m+1) | 可写作 O(nm)\nKMP 总复杂度 | O(n+m) | 主串指针不回退\n模式串长度大于主串 | 不可能匹配 | 直接在入口返回失败\n0 下标前缀函数 | ABABACA 对应 0 0 1 2 3 0 1 | 不要与 1 下标 next 数组混套"}, {"t": "p", "s": "同一 KMP 算法常有 1 下标 next[j] 与 0 下标 prefix[j] 两种写法。前者的首项是哨兵 0，后者首项是 0 表示长度为 0；两者数值含义不同，考试中必须沿用题目给出的定义。\n环状串主次关系  病毒串是环状时，可以复制病毒串并取 m 个长度 m 的线性子串；患者 DNA 本身仍是线性的。不要把“环状”错误地施加到主串匹配上。\n广义表速览：按课程要求选读\n广义表是线性表的推广，元素既可以是原子，也可以是另一个广义表。表长看最外层元素个数；表深看嵌套层数。常见函数中 Head 取第一个元素，Tail 去掉第一个元素后形成的新表。\n取 L=(a,(b,c),((d)))，按常见约定原子深度为 0、空表深度为 1、非空表深度为 1+元素最大深度，则 Length(L)=3、Depth(L)=3；Head(L)=a，Tail(L)=((b,c),((d)))。\n是否必学  若老师的大纲只写“串、数组、模式匹配”，可把本节当作防止题型突袭的速览；若明确包含广义表，再补画存储表示与递归遍历。\nDual-Loop Solve 解题示范\n双循环解题把“找条件”和“推答案”分开。分析循环先确认对象、关系、边界与不变量；求解循环再选择表示方法、执行步骤并做反向验算。以下四题覆盖链表、队列、表达式和串匹配。\n案例 1：单链表插入的指针顺序\n分析循环\n目标：在结点 p 之后插入 s。已知量：p 是前驱，s 是新结点。关键风险：p->next 同时承担“旧后继入口”和“新连接位置”两个作用，一旦先覆盖，旧后继地址就会丢失。\n保存语义：先让 s->next 接住 p 原来的后继。\n建立新边：再令 p->next = s。\n检查边界：s 已分配、p 非空、表长加一。\n反向验算：从 p 出发应依次到达 s 和原来的后继。\n求解循环"}, {"t": "code", "s": "s->next = p->next;\np->next = s;\n++length;\n若题目要求先写一条、再写一条，必须按这个顺序。\n案例 2：循环队列长度与下一次移动\n分析循环\n已知 M=8、front=5、rear=2。关键不变量：front 指向队头，rear 指向队尾的下一个位置；所有下标移动都必须落在 0—7，因此需要模 M。\n当前长度 = (rear - front + M) % M = (2-5+8)%8 = 5。\n入队位置就是当前 rear=2；写入后 rear=(2+1)%8=3，长度变为 6。\n若执行出队，则读取 front=5 的元素，随后 front=(5+1)%8=6。\n验算：采用浪费一个单元判满，当前容量仍可继续插入，未触发队满。\n案例 3：中缀表达式转后缀\n分析循环\n目标表达式：A+B*(C-D)-E/F。约束有三条：操作数次序不变；乘除优先于加减；括号内运算必须先完成。运算符栈保存“暂时不能输出”的运算符。\nA 直接输出；+ 入栈；B 输出；* 优先于 +，入栈。\n左括号入栈；C 输出；- 在括号内、高于左括号，入栈；D 输出。\n遇到右括号，弹出 -；再遇 *，继续弹出 *；此时输出为 A B C D - *。\n+ 与当前的 - 比较：先弹出 +。随后 E 输出、/ 入栈、F 输出。\n扫描结束，依次弹出 /、-，得到 A B C D - * + E F / -。\n验算\n后缀式中操作数顺序仍是 A、B、C、D、E、F；括号消失但 C-D 已被优先计算。遇到减法、除法时，先弹出的是第二操作数。\n案例 4：KMP 的 next 计算\n分析循环\n模式串 T=ABABACA。next[j] 只依赖 T 在 j 之前的子串，与主串无关。先固定 next[1]=0、next[2]=1，再找每个前缀的“最长相等真前后缀”。\nj | 字符 | j 之前的串 | 最长真前后缀 | next[j]"}, {"t": "tbl", "s": "1 | A | 无 | 无 | 0\n2 | B | A | 无 | 1\n3 | A | AB | 无 | 1\n4 | B | ABA | A | 2\n5 | A | ABAB | AB | 3\n6 | C | ABABA | ABA | 4\n7 | A | ABABAC | 无 | 1"}, {"t": "p", "s": "求解结论\nnext = 0、1、1、2、3、4、1。验算重点：第 6 位 C 之前是 ABABA，最长相等真前后缀为 ABA，长度 3，故 next[6]=4。\nDeep Research 横向总结\n复习的终点不是背完四章，而是能回答“为什么这样设计”。下面从约束、代价和优化方向把四章串起来，在案例分析题中尤其有用。"}, {"t": "tbl", "s": "现象 | 原因 | 考场应用\n顺序表按位访问快 | 地址连续，可由公式直接计算位置 | 频繁随机访问、表长稳定时优先选择\n链表插入删除灵活 | 只改局部指针，不搬移数据 | 频繁在已定位位置或表头操作时选择\n顺序队列出队效率低 | 若保持连续队头，后续元素需整体前移 | 用循环队列把移动变为 front/rear 取模\n栈可表示递归 | 未完成的调用需要按后进先出顺序恢复 | 解释递归、括号匹配、后缀式求值和迷宫回溯\nBF 最坏为 O(nm) | 失配后主串起点回退，前面字符可能重复比较 | 先判断失败信息能否复用，再考虑 KMP\nKMP 降为 O(n+m) | 预处理模式串的重叠前缀，主串指针不回退 | 用 next/nextval 说明“避免重复工作”的优化思想"}, {"t": "p", "s": "四条设计与优化原则\n结构要服从操作分布：没有绝对更好的表，只有更适合当前访问和修改模式的表。\n先保证不变量，再追求代码短：链表不丢链、队列不混淆空满、KMP 前后缀约束都是不变量。\n复杂度优化来自消除重复工作：循环队列消除搬移，KMP 消除主串回溯。\n案例题必须同时说明逻辑结构、存储结构、关键操作和代价，不能只写算法名称。\n跨章因果链\n线性关系决定基本操作 → 存储方式决定访问与修改代价 → 运算需求决定数据结构 → 复杂度评价暴露重复工作 → 算法优化利用额外信息减少重复。"}]}, {"id": "errs", "no": "", "title": "考前易错清单", "level": 1, "body": [{"t": "tbl", "s": "易错点 | 正确认识\n链表插入删除总是 O(1) | 只有结点已定位、且能直接修改相关指针时才是 O(1）\n头结点就是首元结点 | 头结点不含业务数据，首元结点才是 a1"}, {"t": "p", "s": "循环队列 front==rear 一定为空 | 在约定浪费一个单元时为空；若另有计数或标志位，要按题意\n双向链表插入先改前驱 next 更保险 | 应先接好能保证不丢链的指针，再完成剩余修改"}, {"t": "tbl", "s": "空格串等于空串 | 空串长度为 0；空格串至少含一个空格字符\nKMP 的 i 也会回退 | KMP 中主串指针 i 不回溯，移动的是模式串指针 j"}, {"t": "p", "s": "next[2] 要计算 | 按课堂 1-based 约定，next[1]=0、next[2]=1 是固定的"}, {"t": "tbl", "s": "存储密度只看数组是否连续 | 还要考虑每个结点中数据与指针所占比例"}, {"t": "p", "s": "大题作答顺序\n1. 先写结构定义和指针含义；2. 再画插入或删除前后的状态；3. 写清先改哪条指针；4. 最后标复杂度，并说明复杂度的前提条件。只背代码不画图，最容易把 next 和 prior 写反。"}]}, {"id": "quiz", "no": "", "title": "自测题 · 20 分钟", "level": 1, "body": [{"t": "p", "s": "诊断说明"}, {"t": "tbl", "s": "题组 | 主要检查 | 答错时优先回看\n判断题 1—6 | 概念辨认与边界条件 | 第 2 章头结点、第 3 章链队列、第 4 章空串与 KMP\n计算题 1—4 | 公式与过程执行 | 顺序表地址、移动次数、循环队列长度\n计算题 5—6 | 算法识别与复杂度 | next/nextval 手算、BF 与 KMP 的比较\n简答题 1—5 | 解释、代码与迁移 | 链表指针顺序、双向链表、表达式转换和 KMP 原理"}, {"t": "p", "s": "一、判断题\n顺序表的存储密度一般等于 1。\n链表只要执行插入，时间复杂度就一定是 O(1)。\n空串和只含一个空格的串相等。\n链栈的插入和删除通常都在栈顶进行。\nKMP 匹配过程中，主串指针 i 不会因为失配而回溯。\n删除链队列最后一个数据结点后，rear 仍需指回头结点。\n二、填空与计算\n顺序表首元素地址为 100，每个元素占 4 字节，第 6 个元素的地址是多少？\n长度为 20 的顺序表删除第 5 个元素，需要移动多少个元素？\n长度为 20 的顺序表在第 5 位之前插入元素，需要移动多少个元素？\n循环队列容量 M=8，front=5，rear=2，当前队列长度是多少？\n模式串 ABAABC 的 next 与 nextval 分别是什么？\nBF 算法最坏复杂度和 KMP 总复杂度分别是什么？\n三、简答与手写\n为什么单链表通常设置头结点？写出两个作用。\n写出在双向链表中把结点 s 插入到结点 p 之后的指针修改过程。\n写出链队列删除最后一个数据结点时必须补充的处理。\n用自己的话说明 KMP 为什么能把最坏复杂度降到 O(n+m)。\n中缀表达式 A+B*(C-D)-E/F 的后缀式是什么？\n参考答案与解析\n判断题"}, {"t": "tbl", "s": "题号 | 答案 | 说明\n1 | √ | 顺序表只存数据元素，存储密度为 1\n2 | × | 定位前驱本身可能需 O(n)\n3 | × | 空串长度为 0；空格串长度至少为 1\n4 | √ | 链栈把栈顶设在链表首端，操作 O(1)\n5 | √ | KMP 失配时只移动模式串指针 j\n6 | √ | 否则空队条件 front==rear 被破坏"}, {"t": "p", "s": "填空与计算"}, {"t": "tbl", "s": "题号 | 答案 | 过程\n1 | 120 | 100 + (6-1)×4 = 120\n2 | 15 | n-i = 20-5 = 15\n3 | 16 | n-i+1 = 20-5+1 = 16\n4 | 5 | (2-5+8)%8 = 5\n5 | next=0,1,1,2,2,3；nextval=0,1,0,2,1,3 | 按 1-based 规则逐位求最长相等真前后缀\n6 | BF：O(nm)；KMP：O(n+m) | BF 可能反复回溯主串；KMP 的 i 不回溯"}, {"t": "p", "s": "简答与手写\n1. 头结点统一首元位置和一般位置的插入删除；简化空表处理；让头指针始终非空，减少空表特判。写出其中两点即可。\n2. s->next=p->next；s->prior=p；若 p->next 非空，则 p->next->prior=s；最后 p->next=s。\n3. 释放被删结点后，若队列变空，则必须令 rear=front，使空队列条件恢复。\n4. KMP 预先计算模式串自身的相等真前后缀，失配时利用已有匹配信息移动 j，主串 i 不回溯，从而避免重复扫描。预处理 O(m)，匹配 O(n)。\n5. A B C D - * + E F / -。减法、除法均保持原操作数方向。\n最后检查\n如果以上题能在 20 分钟内独立完成，再把第 2 章四类链表形态、第 3 章四种队列空满条件和第 4 章 KMP 手算各默写一遍，就完成了本次期中复习的主线。\nActive Recall 主动回忆卡\n先遮住右栏，口头或手写回答，再揭开核对。答不完整就把该行记入错题本，不要用“看过一遍”代替“能独立复述”。"}, {"t": "tbl", "s": "问题 | 标准答案\n数据结构的三种构成要素？ | 逻辑结构、存储结构、数据运算\n顺序表地址公式？ | LOC(ai)=LOC(a1)+(i-1)×c"}, {"t": "p", "s": "顺序表第 i 位插入、删除的移动次数？ | 插入 n-i+1；删除 n-i"}, {"t": "tbl", "s": "头结点与首元结点的区别？ | 头结点不含业务数据；首元结点是 a1\n单链表插入的两条指针语句？ | s->next=p->next；p->next=s"}, {"t": "p", "s": "双向链表插入为什么要先接后继？ | 避免覆盖 p->next 后丢失原后继地址"}, {"t": "tbl", "s": "链队列删到空时还要做什么？ | 令 rear=front，恢复空队条件\n循环队列长度公式？ | (rear-front+M)%M\n循环队列判满公式？ | (rear+1)%M==front"}, {"t": "p", "s": "中缀 A+B*(C-D)-E/F 的后缀式？ | A B C D - * + E F / -\nBF 最坏复杂度与 KMP 总复杂度？ | BF：O(nm)；KMP：O(n+m)\nKMP 为什么能让 i 不回溯？ | 利用模式串相等真前后缀，直接移动 j\n间隔复习与掌握标准"}, {"t": "tbl", "s": "时间点 | 任务 | 通过标准\nD+0 今天 | 读完四章并合上书复述知识路径 | 能不看资料画出四章依赖图\nD+1 明天 | 默写地址、移动次数、循环队列和 BF 公式 | 公式与适用前提全部正确\nD+3 第 3 天 | 重做本套自测与四类链表形态 | 17 题中至少 14 题独立通过\nD+5 第 5 天 | 限时重做错题并手推 KMP、后缀式 | 旧错题不再重复；能解释错因\nD+6 考前 | 只看易错清单、主动回忆卡和 10 分钟速记 | 能连续复述 10 张卡不中断"}, {"t": "p", "s": "错题必须分型\n概念题错：回到术语和定义；计算题错：重写过程与公式；代码题错：画图后逐条写指针；案例题错：按“选择结构—说明原因—给出复杂度”重答。不要把所有错误都归为“粗心”。"}]}, {"id": "tables", "no": "", "title": "考前速记（公式与对比）", "level": 1, "body": [{"t": "tbl", "s": "必记项目 | 考场写法\n顺序表地址 | LOC(ai)=LOC(a1)+(i-1)×c\n顺序表移动 | 插入：n-i+1；删除：n-i\n单链表插入 | 先 s->next=p->next，再 p->next=s\n循环队列 | 满：(rear+1)%M==front；长：(rear-front+M)%M\nBF 失配 | i=i-j+2，j=1（1-based）"}, {"t": "p", "s": "KMP | 固定 next[1]=0、next[2]=1；总复杂度 O(n+m)"}]}, {"id": "apxA", "no": "附录A", "title": "核心 C 代码库", "level": 1, "body": [{"t": "p", "s": "代码库覆盖顺序表、单链表、双向链表、静态链表、顺序栈、链栈、循环队列、链队列、串的基本操作、BF 与 KMP。函数与变量采用统一命名，可直接作为课程实验与手写代码题的参考。\n代码约定\n位序与 next 数组按课堂 1-based 约定；数组存储仍使用 C 的 0-based 下标。元素类型 ElemType 默认定义为 int，可按实验要求替换。代码已用 GCC C11 编译并通过核心功能测试。\nA.1  统一类型、状态码与容量\n以下代码按 C 语言编写，函数名加结构前缀，避免顺序表与链表操作重名。"}, {"t": "code", "s": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <ctype.h>\n#define MAXSIZE 100\ntypedef int ElemType;\ntypedef enum { ERROR = 0, OK = 1, OVERFLOW = -2 } Status;\nA.2  顺序表：结构与基础操作\n下标统一采用 0-based，位序 i 从 1 开始，长度 length 表示当前元素个数。\ntypedef struct {\n    ElemType data[MAXSIZE];\n    int length;\n} SqList;\nStatus SqInitList(SqList *L) {\n    if (L == NULL) return ERROR;\n    L->length = 0;\n    return OK;\n}\nint SqListEmpty(const SqList *L) {\n    return L->length == 0;\n}\nint SqListLength(const SqList *L) {\n    return L->length;\n}\nStatus SqGetElem(const SqList *L, int i, ElemType *e) {\n    if (i < 1 || i > L->length) return ERROR;\n    *e = L->data[i - 1];\n    return OK;\n}\nint SqLocateElem(const SqList *L, ElemType e) {\n    for (int i = 0; i < L->length; ++i)\n        if (L->data[i] == e) return i + 1;\n    return 0;\n}\nA.3  顺序表：插入与删除\n插入时从后往前搬，删除时从前往后搬；两者都要先检查位序和容量。\nStatus SqListInsert(SqList *L, int i, ElemType e) {\n    if (i < 1 || i > L->length + 1) return ERROR;\n    if (L->length >= MAXSIZE) return OVERFLOW;\n    for (int j = L->length - 1; j >= i - 1; --j)\n        L->data[j + 1] = L->data[j];\n    L->data[i - 1] = e;\n    ++L->length;\n    return OK;\n}\nStatus SqListDelete(SqList *L, int i, ElemType *e) {\n    if (i < 1 || i > L->length) return ERROR;\n    *e = L->data[i - 1];\n    for (int j = i; j < L->length; ++j)\n        L->data[j - 1] = L->data[j];\n    --L->length;\n    return OK;\n}\nA.4  单链表：结点与生命周期管理\nLinkList 指向头结点；头结点不计入表长，释放时不能按数据结点数量循环。\ntypedef struct LNode {\n    ElemType data;\n    struct LNode *next;\n} LNode, *LinkList;\nStatus LinkInitList(LinkList *L) {\n    *L = (LNode *)malloc(sizeof(LNode));\n    if (*L == NULL) return OVERFLOW;\n    (*L)->next = NULL;\n    return OK;\n}\nvoid LinkClearList(LinkList L) {\n    LNode *p = L->next, *q;\n    while (p != NULL) {\n        q = p->next;\n        free(p);\n        p = q;\n    }\n    L->next = NULL;\n}\nvoid LinkDestroyList(LinkList *L) {\n    if (L == NULL || *L == NULL) return;\n    LinkClearList(*L);\n    free(*L);\n    *L = NULL;\n}\nint LinkLength(const LinkList L) {\n    int len = 0;\n    for (LNode *p = L->next; p != NULL; p = p->next) ++len;\n    return len;\n}\nA.5  单链表：取值与查找\n链表只能顺序存取，第 i 个结点要通过 next 逐结点定位。\nStatus LinkGetElem(const LinkList L, int i, ElemType *e) {\n    if (i < 1) return ERROR;\n    LNode *p = L->next;\n    int j = 1;\n    while (p != NULL && j < i) {\n        p = p->next;\n        ++j;\n    }\n    if (p == NULL) return ERROR;\n    *e = p->data;\n    return OK;\n}\nLNode *LinkLocateElem(const LinkList L, ElemType e) {\n    LNode *p = L->next;\n    while (p != NULL && p->data != e) p = p->next;\n    return p;\n}\nA.6  单链表：插入与删除\n插入必须先接后继；删除要保存待删结点，修改前驱后再 free。\nStatus LinkInsert(LinkList L, int i, ElemType e) {\n    if (i < 1) return ERROR;\n    LNode *p = L;\n    int j = 0;\n    while (p != NULL && j < i - 1) {\n        p = p->next;\n        ++j;\n    }\n    if (p == NULL) return ERROR;\n    LNode *s = (LNode *)malloc(sizeof(LNode));\n    if (s == NULL) return OVERFLOW;\n    s->data = e;\n    s->next = p->next;\n    p->next = s;\n    return OK;\n}\nStatus LinkDelete(LinkList L, int i, ElemType *e) {\n    if (i < 1) return ERROR;\n    LNode *p = L;\n    int j = 0;\n    while (p->next != NULL && j < i - 1) {\n        p = p->next;\n        ++j;\n    }\n    if (p->next == NULL) return ERROR;\n    LNode *q = p->next;\n    *e = q->data;\n    p->next = q->next;\n    free(q);\n    return OK;\n}\nA.7  单链表：头插法与尾插法建表\n头插法使元素次序反转；尾插法保持输入次序，需要维护尾指针。\nStatus LinkCreateHead(LinkList *L, const ElemType a[], int n) {\n    if (LinkInitList(L) != OK) return OVERFLOW;\n    for (int i = 0; i < n; ++i) {\n        LNode *s = (LNode *)malloc(sizeof(LNode));\n        if (s == NULL) return OVERFLOW;\n        s->data = a[i];\n        s->next = (*L)->next;\n        (*L)->next = s;\n    }\n    return OK;\n}\nStatus LinkCreateTail(LinkList *L, const ElemType a[], int n) {\n    if (LinkInitList(L) != OK) return OVERFLOW;\n    LNode *tail = *L;\n    for (int i = 0; i < n; ++i) {\n        LNode *s = (LNode *)malloc(sizeof(LNode));\n        if (s == NULL) return OVERFLOW;\n        s->data = a[i];\n        s->next = NULL;\n        tail->next = s;\n        tail = s;\n    }\n    return OK;\n}\nA.8  单链表：逆置、中间结点与删除指定值\n逆置使用头插；快慢指针在偶数长度时返回上中位结点；删除全部 x 时保留前驱。\nvoid LinkReverse(LinkList L) {\n    LNode *p = L->next, *q;\n    L->next = NULL;\n    while (p != NULL) {\n        q = p->next;\n        p->next = L->next;\n        L->next = p;\n        p = q;\n    }\n}\nLNode *LinkMiddle(LinkList L) {\n    LNode *slow = L->next, *fast = L->next;\n    while (fast != NULL && fast->next != NULL) {\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n    return slow;\n}\nvoid LinkDeleteValue(LinkList L, ElemType x) {\n    LNode *pre = L, *p = L->next, *q;\n    while (p != NULL) {\n        if (p->data == x) {\n            q = p;\n            pre->next = p->next;\n            p = pre->next;\n            free(q);\n        } else {\n            pre = p;\n            p = p->next;\n        }\n    }\n}\nA.9  双向链表：插入与删除\n先维护新结点两条边，再修改后继的 prior，最后断开前驱的旧 next。\ntypedef struct DuLNode {\n    ElemType data;\n    struct DuLNode *prior;\n    struct DuLNode *next;\n} DuLNode, *DuLinkList;\nStatus DuInsertAfter(DuLNode *p, ElemType e) {\n    if (p == NULL) return ERROR;\n    DuLNode *s = (DuLNode *)malloc(sizeof(DuLNode));\n    if (s == NULL) return OVERFLOW;\n    s->data = e;\n    s->next = p->next;\n    s->prior = p;\n    if (p->next != NULL) p->next->prior = s;\n    p->next = s;\n    return OK;\n}\nStatus DuDeleteNode(DuLNode *p) {\n    if (p == NULL || p->prior == NULL) return ERROR;\n    p->prior->next = p->next;\n    if (p->next != NULL) p->next->prior = p->prior;\n    free(p);\n    return OK;\n}\nA.10  静态链表：数组模拟链式结构\n静态链表的 next 存放数组下标而不是内存地址；0 下标常作为备用链入口。\ntypedef struct {\n    ElemType data;\n    int next;\n} Component;\n// 通常声明：Component space[MAXSIZE];\n// -1 可表示空指针，0 下标可预留为头结点或空闲链头。\nA.11  顺序栈：完整基本操作\n这里采用 top 指向当前栈顶元素、初始 top=-1 的约定。\ntypedef struct {\n    ElemType data[MAXSIZE];\n    int top;\n} SqStack;\nvoid InitStack(SqStack *S) { S->top = -1; }\nint StackEmpty(const SqStack *S) { return S->top == -1; }\nint StackFull(const SqStack *S) { return S->top == MAXSIZE - 1; }\nStatus Push(SqStack *S, ElemType e) {\n    if (StackFull(S)) return OVERFLOW;\n    S->data[++S->top] = e;\n    return OK;\n}\nStatus Pop(SqStack *S, ElemType *e) {\n    if (StackEmpty(S)) return ERROR;\n    *e = S->data[S->top--];\n    return OK;\n}\nStatus GetTop(const SqStack *S, ElemType *e) {\n    if (StackEmpty(S)) return ERROR;\n    *e = S->data[S->top];\n    return OK;\n}\nA.12  链栈：完整基本操作\n链栈不带头结点，L 指向栈顶；所有操作都在表头完成。\ntypedef struct SNode {\n    ElemType data;\n    struct SNode *next;\n} SNode, *LinkStack;\nvoid InitLinkStack(LinkStack *S) { *S = NULL; }\nint LinkStackEmpty(const LinkStack S) { return S == NULL; }\nStatus LinkStackPush(LinkStack *S, ElemType e) {\n    SNode *p = (SNode *)malloc(sizeof(SNode));\n    if (p == NULL) return OVERFLOW;\n    p->data = e;\n    p->next = *S;\n    *S = p;\n    return OK;\n}\nStatus LinkStackPop(LinkStack *S, ElemType *e) {\n    if (*S == NULL) return ERROR;\n    SNode *p = *S;\n    *e = p->data;\n    *S = p->next;\n    free(p);\n    return OK;\n}\nA.13  栈应用：括号匹配与数制转换\n括号匹配扫描结束后必须要求栈空；数制转换按“取余入栈、反向出栈”输出。\nint BracketMatch(const char *s) {\n    SqStack st;\n    InitStack(&st);\n    for (int i = 0; s[i] != '\\0'; ++i) {\n        char c = s[i];\n        ElemType top;\n        if (c == '(' || c == '[' || c == '{') {\n            Push(&st, (ElemType)c);\n        } else if (c == ')' || c == ']' || c == '}') {\n            if (Pop(&st, &top) != OK) return 0;\n            if ((c == ')' && (char)top != '(') ||\n                (c == ']' && (char)top != '[') ||\n                (c == '}' && (char)top != '{')) return 0;\n        }\n    }\n    return StackEmpty(&st);\n}\nvoid ConvertBase(unsigned int n, int base) {\n    SqStack st;\n    InitStack(&st);\n    do {\n        Push(&st, n % base);\n        n /= base;\n    } while (n != 0);\n    while (!StackEmpty(&st)) {\n        int digit;\n        Pop(&st, &digit);\n        putchar(digit < 10 ? '0' + digit : 'A' + digit - 10);\n    }\n}\nA.14  栈应用：判断出栈序列是否合法\n按目标出栈序列模拟压栈与弹栈；入栈序列耗尽仍无法匹配时返回 0。\nint IsPopSequence(const int in[], const int out[], int n) {\n    SqStack st;\n    InitStack(&st);\n    int i = 0, j = 0, top;\n    while (j < n) {\n        if (!StackEmpty(&st) && GetTop(&st, &top) == OK &&\n            top == out[j]) {\n            Pop(&st, &top);\n            ++j;\n        } else if (i < n) {\n            Push(&st, in[i++]);\n        } else {\n            return 0;\n        }\n    }\n    return StackEmpty(&st);\n}\nA.15  栈应用：中缀表达式转后缀\n示例按单个字母或数字作为操作数，输出字符之间保留空格。\ntypedef struct {\n    char data[MAXSIZE];\n    int top;\n} CharStack;\nstatic void CharPush(CharStack *S, char c) { S->data[++S->top] = c; }\nstatic char CharPop(CharStack *S) { return S->data[S->top--]; }\nstatic int Priority(char op) {\n    if (op == '+' || op == '-') return 1;\n    if (op == '*' || op == '/') return 2;\n    return 0;\n}\nStatus InfixToPostfix(const char *infix, char *postfix) {\n    CharStack st;\n    st.top = -1;\n    int k = 0;\n    for (int i = 0; infix[i] != '\\0'; ++i) {\n        char c = infix[i];\n        if (isspace((unsigned char)c)) continue;\n        if (isalnum((unsigned char)c)) {\n            postfix[k++] = c;\n            postfix[k++] = ' ';\n        } else if (c == '(') {\n            CharPush(&st, c);\n        } else if (c == ')') {\n            while (st.top >= 0 && st.data[st.top] != '(') {\n                postfix[k++] = CharPop(&st);\n                postfix[k++] = ' ';\n            }\n            if (st.top < 0) return ERROR;\n            CharPop(&st);\n        } else {\n            while (st.top >= 0 && st.data[st.top] != '(' &&\n                   Priority(st.data[st.top]) >= Priority(c)) {\n                postfix[k++] = CharPop(&st);\n                postfix[k++] = ' ';\n            }\n            CharPush(&st, c);\n        }\n    }\n    while (st.top >= 0) {\n        if (st.data[st.top] == '(') return ERROR;\n        postfix[k++] = CharPop(&st);\n        postfix[k++] = ' ';\n    }\n    postfix[k] = '\\0';\n    return OK;\n}\nA.16  栈应用：后缀表达式求值\n仅演示单个数字操作数与 +、-、*、/；弹出时先得到第二操作数。\nStatus EvalPostfix(const char *postfix, ElemType *result) {\n    SqStack st;\n    InitStack(&st);\n    for (int i = 0; postfix[i] != '\\0'; ++i) {\n        char c = postfix[i];\n        if (isspace((unsigned char)c)) continue;\n        if (isdigit((unsigned char)c)) {\n            Push(&st, c - '0');\n        } else {\n            ElemType b, a;\n            if (Pop(&st, &b) != OK || Pop(&st, &a) != OK) return ERROR;\n            if (c == '+') Push(&st, a + b);\n            else if (c == '-') Push(&st, a - b);\n            else if (c == '*') Push(&st, a * b);\n            else if (c == '/') {\n                if (b == 0) return ERROR;\n                Push(&st, a / b);\n            } else return ERROR;\n        }\n    }\n    if (Pop(&st, result) != OK || !StackEmpty(&st)) return ERROR;\n    return OK;\n}\nA.17  循环队列：完整基本操作\n采用牺牲一个单元区分队空与队满。\ntypedef struct {\n    ElemType data[MAXSIZE];\n    int front, rear;\n} SqQueue;\nvoid InitQueue(SqQueue *Q) { Q->front = Q->rear = 0; }\nint QueueEmpty(const SqQueue *Q) { return Q->front == Q->rear; }\nint QueueFull(const SqQueue *Q) {\n    return (Q->rear + 1) % MAXSIZE == Q->front;\n}\nint QueueLength(const SqQueue *Q) {\n    return (Q->rear - Q->front + MAXSIZE) % MAXSIZE;\n}\nStatus EnQueue(SqQueue *Q, ElemType e) {\n    if (QueueFull(Q)) return OVERFLOW;\n    Q->data[Q->rear] = e;\n    Q->rear = (Q->rear + 1) % MAXSIZE;\n    return OK;\n}\nStatus DeQueue(SqQueue *Q, ElemType *e) {\n    if (QueueEmpty(Q)) return ERROR;\n    *e = Q->data[Q->front];\n    Q->front = (Q->front + 1) % MAXSIZE;\n    return OK;\n}\nA.18  链队列：完整基本操作\nfront 指向头结点，rear 指向尾结点；删除最后一个数据结点后令 rear=front。\ntypedef struct QNode {\n    ElemType data;\n    struct QNode *next;\n} QNode;\ntypedef struct {\n    QNode *front;\n    QNode *rear;\n} LinkQueue;\nStatus InitLinkQueue(LinkQueue *Q) {\n    Q->front = Q->rear = (QNode *)malloc(sizeof(QNode));\n    if (Q->front == NULL) return OVERFLOW;\n    Q->front->next = NULL;\n    return OK;\n}\nint LinkQueueEmpty(const LinkQueue *Q) {\n    return Q->front == Q->rear;\n}\nStatus LinkEnQueue(LinkQueue *Q, ElemType e) {\n    QNode *p = (QNode *)malloc(sizeof(QNode));\n    if (p == NULL) return OVERFLOW;\n    p->data = e;\n    p->next = NULL;\n    Q->rear->next = p;\n    Q->rear = p;\n    return OK;\n}\nStatus LinkDeQueue(LinkQueue *Q, ElemType *e) {\n    if (Q->front == Q->rear) return ERROR;\n    QNode *p = Q->front->next;\n    *e = p->data;\n    Q->front->next = p->next;\n    if (Q->rear == p) Q->rear = Q->front;\n    free(p);\n    return OK;\n}\nA.19  串：定长顺序存储与基本操作\n0 号单元放串长，有效字符从 1 开始；超出 MAXSTRLEN 时截断。\n#define MAXSTRLEN 255\ntypedef unsigned char SString[MAXSTRLEN + 1];\nint StrLength(const SString S) {\n    return S[0];\n}\nStatus StrAssign(SString T, const char *chars) {\n    int len = (int)strlen(chars);\n    if (len > MAXSTRLEN) len = MAXSTRLEN;\n    T[0] = (unsigned char)len;\n    for (int i = 1; i <= len; ++i) T[i] = (unsigned char)chars[i - 1];\n    return (len == (int)strlen(chars)) ? OK : ERROR;\n}\nint StrCompare(const SString S, const SString T) {\n    for (int i = 1; i <= S[0] && i <= T[0]; ++i)\n        if (S[i] != T[i]) return (int)S[i] - (int)T[i];\n    return (int)S[0] - (int)T[0];\n}\nA.20  串：取子串与模式匹配 BF\nsubstring 的字符必须连续；BF 失配时主串回到原起点下一位。\nStatus SubString(SString Sub, const SString S, int pos, int len) {\n    if (pos < 1 || pos > S[0] || len < 0 || len > S[0] - pos + 1)\n        return ERROR;\n    Sub[0] = (unsigned char)len;\n    for (int i = 1; i <= len; ++i) Sub[i] = S[pos + i - 1];\n    return OK;\n}\nint IndexBF(const SString S, const SString T, int pos) {\n    int i = pos, j = 1;\n    while (i <= S[0] && j <= T[0]) {\n        if (S[i] == T[j]) {\n            ++i;\n            ++j;\n        } else {\n            i = i - j + 2;\n            j = 1;\n        }\n    }\n    if (j > T[0]) return i - T[0];\n    return 0;\n}\nA.21  KMP：next、nextval 与匹配\n全部按课堂的 1-based 约定；next[1] 与 nextval[1] 固定为 0。\nvoid GetNext(const SString T, int next[]) {\n    int i = 1, j = 0;\n    next[1] = 0;\n    while (i < T[0]) {\n        if (j == 0 || T[i] == T[j]) {\n            ++i;\n            ++j;\n            next[i] = j;\n        } else {\n            j = next[j];\n        }\n    }\n}\nvoid GetNextval(const SString T, int nextval[]) {\n    int i = 1, j = 0;\n    nextval[1] = 0;\n    while (i < T[0]) {\n        if (j == 0 || T[i] == T[j]) {\n            ++i;\n            ++j;\n            if (T[i] != T[j]) nextval[i] = j;\n            else nextval[i] = nextval[j];\n        } else {\n            j = nextval[j];\n        }\n    }\n}\nint IndexKMP(const SString S, const SString T, int pos) {\n    int next[MAXSTRLEN + 1];\n    GetNext(T, next);\n    int i = pos, j = 1;\n    while (i <= S[0] && j <= T[0]) {\n        if (j == 0 || S[i] == T[j]) {\n            ++i;\n            ++j;\n        } else {\n            j = next[j];\n        }\n    }\n    if (j > T[0]) return i - T[0];\n    return 0;\n}\n使用建议\n第一遍只看结构和函数职责；第二遍遮住代码，独立写出插入、删除、循环队列和 next；第三遍把代码与第 2—4 章的过程图、复杂度及易错点对应起来。"}]}]}, {"id": "exp1", "title": "实验一 · 线性表的相关操作（顺序表 + 链表归并）", "secs": [{"id": "exp10", "no": "", "title": "实验目的", "level": 2, "body": [{"t": "p", "s": "1．熟练掌握计算机中线性表顺序存储结构的描述方法。\n2．熟悉顺序表的各种基本操作。\n3．掌握顺序存储结构中的插入和删除操作。"}]}, {"id": "exp11", "no": "", "title": "实验过程与代码", "level": 2, "body": [{"t": "p", "s": "、程序代码、实验数据、实验现象、实验中发现的问题等）\n（1）实验步骤："}, {"t": "code", "s": "/* algo2-1.cpp */\n#include <stdio.h>\n#include <malloc.h>\n#define MaxSize 50\ntypedef char ElemType;\ntypedef struct{\n    ElemType elem[MaxSize];\n    int length;\n} SqList;\nvoid InitList(SqList *&L)\n{\n    L = (SqList *)malloc(sizeof(SqList));\n    if (!L) exit(1);\n    L->length = 0;\n}\nvoid DestroyList(SqList *&L)\n{\n    free(L);\n    L = NULL;\n}\nint ListEmpty(SqList *L)\n{\n    return(L->length == 0);\n}\nint ListLength(SqList *L)\n{\n    return(L->length);\n}\nvoid DispList(SqList *L)\n{\n    int i;\n    if (ListEmpty(L)) return;\n    for (i = 0; i < L->length; i++)\n        printf(\"%c\", L->elem[i]);\n    printf(\"\\n\");\n}\nint GetElem(SqList *L, int i, ElemType &e)\n{\n    if (i < 1 || i > L->length)\n    return 0;\n    e = L->elem[i - 1];\n    return 1;\n}\nint LocateElem(SqList *L, ElemType e)\n{\n    int i = 0;\n    while(i<L->length && L->elem[i]!=e) i++;\n    if(i>=L->length)\n        return 0;\n    else\n        return i+1;\n}\nint ListInsert(SqList *L,int i,ElemType e)\n{\n    int j;\n    if(i<1 ||i>L->length+1)\n        return 0;\n    i--;\n    for (j=L->length;j>i;j--)\n        L->elem[j]=L->elem[j-1];\n    L->elem[i]=e;\n    L->length++;\n    return 1;\n}\nint ListDelete(SqList *L, int i, ElemType &e)\n{\n    int j;\n    if (i < 1 || i > L->length)\n        return 0;\n    e = L->elem[i - 1];\n    for (j = i; j < L->length; j++)\n        L->elem[j - 1] = L->elem[j];\n    L->length--;\n    return 1;\n}\nint main()\n{SqList *L;\n ElemType e;\n printf(\"(1)初始化顺序表L\\n\");\n InitList(L);\n printf(\"(2)依次采用尾插法插入a,b,c,d,e元素\\n\");\n ListInsert(L,1,'a');\n ListInsert(L,2,'b');\n ListInsert(L,3,'c');\n ListInsert(L,4,'d');\n ListInsert(L,5,'e');\n printf(\"(3)输出顺序表L:\");\n DispList(L);\n printf(\"(4)顺序表L长度=%d\\n\",ListLength(L));\n printf(\"(5)顺序表L为%s\\n\",(ListEmpty(L)?\"空\":\"非空\"));\n GetElem(L,3,e);\n printf(\"(6)顺序表L的第三个元素=%c\\n\",e);\n printf(\"(7)元素a的位置=%d\\n\",LocateElem(L,'a'));\n printf(\"(8)在第4个元素位置上插入f元素\\n\");\n ListInsert(L,4,'f');\n printf(\"(9)输出顺序表L:\\n\");\n DispList(L);\n printf(\"(10)删除L的第3个元素\\n\");\n ListDelete(L,3,e);\n printf(\"(11)输出顺序表L:\");\n DispList(L);\n printf(\"(12)释放顺序表L\\n\");\n DestroyList(L);\n}"}]}, {"id": "exp12", "no": "", "title": "实验结果与分析", "level": 2, "body": [{"t": "p", "s": "（包括结果描述、实验现象分析、影响因素讨论、综合分析和结论等）\n结果截图：\n测试数据：依次插入 a、b、c、d、e；第 4 位插入 f；删除第 3 个元素。\n总结收获：\n报错内容为main前的void,c语言规定main函数返回类型是int,不能写void,修改为int main()后，可以正常运行了。\n顺序表的优点是按下标访问快，GetElem 的时间复杂度是 O(1)；但插入和删除要移动元素，平均要移动约 n/2 个，时间复杂度是 O(n)。插入时要从后往前移动，避免前面的元素被覆盖；删除时要从前往后移动。\n用户输入的位序从 1 开始，而数组下标从 0 开始，所以代码里要用 elem[i-1] 转换，并先判断 i 是否在 1 到 length+1 之间。和链表相比，顺序表更适合频繁查找，链表更适合频繁插入和删除。\n实验基本原理与设计（包括实验方案设计、实验手段的确定、软件流程图设计或算法描述）\n（1）流程图："}]}, {"id": "exp13", "no": "", "title": "实验目的（2）", "level": 2, "body": [{"t": "p", "s": "1．熟练掌握计算机中线性表链式存储结构的描述方法。\n2．熟悉链表的各种基本操作。\n3．掌握链式存储结构中的插入和删除操作。"}]}, {"id": "exp14", "no": "", "title": "实验过程与代码（2）", "level": 2, "body": [{"t": "p", "s": "、程序代码、实验数据、实验现象、实验中发现的问题等）\n（1）实验步骤："}, {"t": "code", "s": "/* algo2-5.cpp */\n#include \"c1.h\"\ntypedef int ElemType;\n#include \"c2-2.h\"\n#include \"bo2-2.h\"\n#ifdef _WIN32\n#include <windows.h>\n#endif\nvoid CreateList(LinkList &L, int n)\n{\n  int i;\n  LinkList p;\n  L = (LinkList)malloc(sizeof(LNode));\n  if (!L) exit(1);\n  L->next = NULL;\n  printf(\"请输入%d个数据\\n\", n);\n  fflush(stdout);\n  for(i = n; i > 0; --i)\n  {\n    p = (LinkList)malloc(sizeof(LNode));\n    if (!p) exit(1);\n    scanf(\"%d\", &p->data);\n    p->next = L->next;\n    L->next = p;\n  }\n}\nvoid CreateList2(LinkList &L, int n)\n{\n  int i;\n  LinkList p, q;\n  L = (LinkList)malloc(sizeof(LNode));\n  if (!L) exit(1);\n  L->next = NULL;\n  q = L;\n  printf(\"请输入%d个数据\\n\", n);\n  fflush(stdout);\n  for(i = 1; i <= n; i++)\n  {\n    p = (LinkList)malloc(sizeof(LNode));\n    if (!p) exit(1);\n    scanf(\"%d\", &p->data);\n    q->next = p;\n    q = q->next;\n  }\n  p->next = NULL;\n}\nvoid MergeList(LinkList La, LinkList &Lb, LinkList &Lc)\n{\n  LinkList pa = La->next, pb = Lb->next, pc;\n  Lc = pc = La;\n  while(pa && pb)\n    if(pa->data <= pb->data)\n    {\n      pc->next = pa;\n      pc = pa;\n      pa = pa->next;\n    }\n    else\n    {\n      pc->next = pb;\n      pc = pb;\n      pb = pb->next;\n    }\n  pc->next = pa ? pa : pb;\n  free(Lb);\n  Lb = NULL;\n}\nvoid visit(ElemType c)\n{\n  printf(\"%d \", c);\n}\nint main()\n{\n#ifdef _WIN32\n  SetConsoleOutputCP(65001);\n#endif\n  int n = 5;\n  LinkList La, Lb, Lc;\n  ElemType e;\n  printf(\"按非递减顺序，\");\n  CreateList2(La, n);\n  printf(\"La=\");\n  ListTraverse(La, visit);\n  printf(\"按非递增顺序，\");\n  CreateList(Lb, n);\n  printf(\"Lb=\");\n  ListTraverse(Lb, visit);\n  ListDelete(La, 3, e);\n  printf(\"删除表La中第三个元素：\");\n  ListTraverse(La, visit);\n  MergeList(La, Lb, Lc);\n  printf(\"Lc=\");\n  ListTraverse(Lc, visit);\n  DestroyList(Lc);\n  return 0;\n}\n/* bo2-2.h */\nStatus InitList(LinkList &L)\n{\n    L=(LinkList)malloc(sizeof(LNode));\n    if(!L)\n        exit(OVERFLOW);\n    L->next=NULL;\n    return OK;\n}\nStatus DestroyList(LinkList &L)\n{\n    LinkList q;\n    while(L)\n    {\n        q=L->next;\n        free(L);\n        L=q;\n    }\n    L = NULL;\n    return OK;\n}\nStatus ClearList(LinkList L)\n{\n    LinkList p,q;\n    p=L->next;\n    while(p)\n    {\n        q=p->next;\n        free(p);\n        p=q;\n    }\n    L->next=NULL;\n    return OK;\n}\nStatus ListEmpty(LinkList L)\n{\n    if(L->next)\n        return FALSE;\n    else\n        return TRUE;\n}\nint ListLength(LinkList L)\n{\n    int i=0;\n    LinkList p=L->next;\n    while(p)\n    {\n        i++;\n        p=p->next;\n    }\n    return i;\n}\nStatus GetElem(LinkList L,int i,ElemType &e)\n{\n    int j=1;\n    LinkList p=L->next;\n    while(p&&j<i)\n    {\n        p=p->next;\n        j++;\n    }\n    if(!p||j>i)\n        return ERROR;\n    e=p->data;\n    return OK;\n}\nint LocateElem(LinkList L,ElemType e,Status(*compare)(ElemType,ElemType))\n{\n    int i=0;\n    LinkList p=L->next;\n    while(p)\n    {\n        i++;\n        if(compare(p->data,e))\n            return i;\n        p=p->next;\n    }\n    return 0;\n}\nStatus PriorElem(LinkList L,ElemType cur_e,ElemType &pre_e)\n{\n    LinkList q,p=L->next;\n    while(p->next)\n    {\n        q=p->next;\n        if(q->data==cur_e)\n        {\n            pre_e=p->data;\n            return OK;\n        }\n        p=q;\n    }\n    return INFEASIBLE;\n}\nStatus NextElem(LinkList L,ElemType cur_e,ElemType &next_e)\n{\n    LinkList p=L->next;\n    while(p->next)\n    {\n        if(p->data==cur_e)\n        {\n            next_e=p->next->data;\n            return OK;\n        }\n        p=p->next;\n    }\n    return INFEASIBLE;\n}\nStatus ListInsert(LinkList L,int i,ElemType e)\n{\n    int j=0;\n    LinkList p=L,s;\n    while(p&&j<i-1)\n    {\n        p=p->next;\n        j++;\n    }\n    if(!p||j>i-1)\n        return ERROR;\n    s=(LinkList)malloc(sizeof(LNode));\n    s->data=e;\n    s->next=p->next;\n    p->next=s;\n    return OK;\n}\nStatus ListDelete(LinkList L,int i,ElemType &e)\n{\n    int j=0;\n    LinkList p=L,q;\n    while(p->next&&j<i-1)\n    {\n        p=p->next;\n        j++;\n    }\n    if(!(p->next)||j>i-1)\n        return ERROR;\n    q=p->next;\n    p->next=q->next;\n    e=q->data;\n    free(q);\n    return OK;\n}\nStatus ListTraverse(LinkList L,void(*vi)(ElemType))\n{\n    LinkList p=L->next;\n    while(p)\n    {\n        vi(p->data);\n        p=p->next;\n    }\n    printf(\"\\n\");\n    return OK;\n}\n/* c2-2.h */\ntypedef int ElemType;\nstruct LNode\n{\n    ElemType data;\n    LNode *next;\n};\ntypedef LNode *LinkList;\n/* c1.h */\n#include <string.h>\n#include <ctype.h>\n#include <malloc.h>\n#include <limits.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <io.h>\n#include <math.h>\n#include <process.h>\n#define TRUE 1\n#define FALSE 0\n#define OK 1\n#define ERROR 0\n#define INFEASIBLE -1\n#ifndef OVERFLOW\n#define OVERFLOW -2\n#endif\ntypedef int Status;\ntypedef int Boolean;"}]}, {"id": "exp15", "no": "", "title": "实验结果与分析（2）", "level": 2, "body": [{"t": "p", "s": "（包括结果描述、实验现象分析、影响因素讨论、综合分析和结论等）\n结果截图：\n测试数据：La 输入 1 2 3 4 5；Lb 输入 6 5 4 3 2；输出 Lc = 1 2 2 3 4 4 5 5 6。\n总结收获：\n1. 一开始把 Lb 也用尾插法建表，输入 6 5 4 3 2 后，Lb 还是 6 5 4 3 2，归并出来的 Lc 就乱了。后来改成用头插法建 Lb，同样输入 6 5 4 3 2，表里变成 2 3 4 5 6，再归并就正确了。\n2. MergeList 里写了 Lb = NULL，但函数返回后外面的 Lb 没有变化。后来才知道参数写成 LinkList Lb 只是传了一个值，函数里改的只是副本，改成 LinkList &Lb 后才能改到外面的 Lb。\n可以把 &Lb 理解成给 main 里的 Lb 起了一个别名：函数里 free(Lb) 后再 Lb = NULL，改的就是外面的 Lb。如果写成 LinkList Lb，函数拿到的只是指针的副本，副本置空不会影响外面。\n通过这次实验，我分清了头插法和尾插法的区别，也明白了归并前两个表都必须是有序的。"}]}]}, {"id": "exp2", "title": "实验二 · 栈的应用（括号匹配）", "secs": [{"id": "exp20", "no": "", "title": "实验目的", "level": 2, "body": [{"t": "p", "s": "1．掌握栈类型的特点。\n2．熟练掌握栈类型的两种实现方法。\n3．掌握栈满和栈空的条件以及它们的描述方法。"}]}, {"id": "exp21", "no": "", "title": "实验过程与代码", "level": 2, "body": [{"t": "p", "s": "、程序代码、实验数据、实验现象、实验中发现的问题等）\n（1）实验步骤："}, {"t": "code", "s": "/* algo3-3.cpp */\ntypedef char SElemType;\n#include \"c1.h\"\n#include \"c3-1.h\"\nvoid check()\n{\n  SqStack s;\n  SElemType ch[80],*p,e;\n  if(InitStack(s))\n  {\n    printf(\"请输入表达式\\n\");\n    gets(ch);\n    p=ch;\n    while(*p)\n      switch(*p)\n      {\n        case '(':\n        case '[':Push(s,*p++);\n                 break;\n        case ')':\n        case ']':if(!StackEmpty(s))\n                 {\n                   Pop(s,e);\n                   if((e=='('&&*p!=')')||(e=='['&&*p!=']'))\n                   {\n                     printf(\"左右括号不配对\\n\");\n                     exit(ERROR);\n                   }\n                   else\n                   {\n                     p++;break;\n                   }\n                 }\n                 else\n                 {\n                   printf(\"缺左括号\\n\");\n                   exit(ERROR);\n                 }\n        default:p++;\n      }\n    if(StackEmpty(s))\n      printf(\"括号匹配\\n\");\n    else\n      printf(\"缺右括号\\n\");\n  }\n}\nvoid main()\n{\n  check();\n}\n/* c1.h */\n#include<string.h>\n#include<ctype.h>\n#include<malloc.h>\n#include<stdio.h>\n#include<stdlib.h>\n#include<io.h>\n#include<math.h>\n#include<process.h>\n#define TRUE 1\n#define FALSE 0\n#define OK 1\n#define ERROR 0\n#define INFEASIBLE -1\ntypedef int Status;\ntypedef int Boolean;\n/* c3-1.h */\n#define STACK_INIT_SIZE 10\n#define STACKINCREHENT 2\nstruct SqStack{\n\tSElemType *base;\n\tSElemType *top;\n\tint stackszie;\n};\nStatus InitStack(SqStack &S){\n\tif(!(S.base=(SElemType *)malloc(STACK_INIT_SIZE*sizeof(SElemType))))\n\t\texit(OVERFLOW);\n\tS.top = S.base;\n\tS.stackszie=STACK_INIT_SIZE;\n\treturn OK;\n}\nStatus StackEmpty(SqStack S)\n{\n\tif(S.top ==S.base)\n\t\treturn OK;\n\telse\n\t\treturn ERROR;\n}\nStatus Push(SqStack &S,SElemType e)\n{\n\tif(S.top-S.base>=S.stackszie)\n\t{\n\t\tS.base=(SElemType *)realloc(S.base,\n\t\t\t(S.stackszie+STACKINCREHENT)*sizeof(SElemType));\n\t\tif(!S.base)\n\t\t\texit(OVERFLOW);\n\t\tS.top = S.base+S.stackszie;\n\t\tS.stackszie+=STACKINCREHENT;\n\t\t}\n\t*(S.top)++=e;\n\treturn OK;\n}\nStatus Pop(SqStack &S,SElemType &e)\n{\n\tif(S.top==S.base)\n\t\treturn ERROR;\n\te=*--S.top;\n\treturn OK;\n}\n四、"}]}, {"id": "exp22", "no": "", "title": "实验结果与分析", "level": 2, "body": [{"t": "p", "s": "（包括结果描述、实验现象分析、影响因素讨论、综合分析和结论等）\n（1） 结果截图：（注意：输入一个表达式后，判定）\n1）括号匹配：         2）括号不匹配\n缺乏左括号        4）缺乏右括号\n（2） 总结收获：\n通过本次实验，我掌握了栈\"后进先出\"的特点，以及顺序栈的初始化、判空、入栈、出栈和动态扩容等基本操作。将栈应用于括号匹配，使我理解了\"左括号入栈、右括号出栈并检查类型、扫描结束后判断栈是否为空\"的求解思路，提高了将数据结构用于解决实际问题的能力。同时，通过调试不同输入情况，我进一步认识到栈空、栈满以及边界条件处理的重要性。"}]}]}];
const KPDOC = {"基本概念":["s1_1","s1_2"],"复杂度分析":["s1_3","s1_4"],"递归":["s3_4"],"线性表":["s2_1"],"顺序表":["s2_2"],"链表":["s2_3"],"双向链表":["s2_4"],"循环链表":["s2_4"],"静态链表":["s2_3"],"数组与矩阵":["s4_7","s4_2"],"广义表":["s2_1"],"栈":["s3_1","s3_2"],"队列":["s3_3"],"循环队列":["s3_3"],"双端队列":["s3_3"],"串":["s4_1"],"串·KMP":["s4_4","s4_3"]};
const SECMAP = {};
DOCS.forEach(d => d.secs.forEach(s => { SECMAP[s.id] = { doc: d, sec: s }; }));
let curDoc = 'res', curSecId = null;

function docObj(id){ return DOCS.find(x => x.id === id) || DOCS[0]; }

function openDrawer(docId, secId){
  const d = docObj(docId || curDoc);
  document.getElementById('drawer').classList.remove('hide');
  const sel = document.getElementById('docSel');
  if (!sel.options.length){
    sel.innerHTML = DOCS.map(x => '<option value="' + x.id + '">' + esc(x.title) + '</option>').join('');
    sel.onchange = () => { curDoc = sel.value; renderToc(docObj(curDoc), null); renderSec(docObj(curDoc).secs[0]); };
  }
  sel.value = d.id; curDoc = d.id;
  document.getElementById('docSearch').value = '';
  const s = (secId && d.secs.find(x => x.id === secId)) || d.secs[0];
  renderToc(d, s ? s.id : null);
  renderSec(s);
}

function renderToc(d, activeId){
  const t = document.getElementById('dtoc');
  t.innerHTML = d.secs.map(s =>
    '<a href="#" data-sid="' + s.id + '" class="' + (s.level === 1 ? 'l1' : '') + (s.id === activeId ? ' on' : '') + '">' +
    esc((s.no ? s.no + ' ' : '') + s.title) + '</a>').join('');
  t.querySelectorAll('a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    const ref = SECMAP[a.dataset.sid];
    renderSec(ref.sec); curSecId = ref.sec.id;
    t.querySelectorAll('a').forEach(x => x.classList.toggle('on', x === a));
  });
}

function tblHtml(txt){
  const rows = txt.split(String.fromCharCode(10)).map(r => r.trim()).filter(Boolean).map(r => r.split(' | '));
  if (!rows.length) return '';
  const head = rows[0], body = rows.slice(1);
  const tds = (cells, tag) => cells.map(c => '<' + tag + '>' + esc(c) + '</' + tag + '>').join('');
  return '<div class="tblwrap"><table class="tbl"><thead><tr>' + tds(head, 'th') + '</tr></thead><tbody>' +
    body.map(r => '<tr>' + tds(r, 'td') + '</tr>').join('') + '</tbody></table></div>';
}

function renderSec(s){
  const box = document.getElementById('dtext');
  if (!s){ box.innerHTML = '<p class="empty">没有找到内容</p>'; return; }
  curSecId = s.id;
  const h = '<h4>' + esc((s.no ? s.no + '　' : '') + s.title) + '</h4>' + s.body.map(b =>
    b.t === 'code' ? '<pre>' + esc(b.s) + '</pre>' :
    b.t === 'img' ? '<img class="dimg" alt="图" src="' + b.s + '">' :
    b.t === 'tbl' ? tblHtml(b.s) :
    '<p>' + esc(b.s) + '</p>').join('');
  box.innerHTML = h;
  box.scrollTop = 0;
}

function openDocFor(kp){
  const ids = KPDOC[kp] || [];
  const first = ids.map(i => SECMAP[i]).filter(Boolean)[0];
  if (first) openDrawer(first.doc.id, first.sec.id);
  else openDrawer('res', 'tables');
}

function docSearchGo(v){
  v = (v || '').trim();
  const t = document.getElementById('dtoc');
  if (!v){ renderToc(docObj(curDoc), curSecId); return; }
  const hits = [];
  DOCS.forEach(d => d.secs.forEach(s => {
    const title = (s.no ? s.no + ' ' : '') + s.title;
    const body = s.body.map(b => b.s).join('\n');
    let cnt = 0, at = 0;
    while ((at = body.indexOf(v, at)) >= 0){ cnt++; at += v.length; }
    const tc = title.indexOf(v) >= 0 ? 1 : 0;
    if (tc || cnt) hits.push({ d, s, title, score: tc * 1000 + cnt });
  }));
  hits.sort((a, b) => b.score - a.score);
  t.innerHTML = '<div class="dt">匹配 ' + hits.length + ' 节</div>' + hits.map((h, i) =>
    '<a href="#" data-i="' + i + '">' + esc(h.title) + (h.score % 1000 ? ' <span class="hn">' + (h.score % 1000) + '</span>' : '') + '</a>').join('');
  t.querySelectorAll('a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    const h = hits[Number(a.dataset.i)];
    curDoc = h.d.id;
    document.getElementById('docSel').value = h.d.id;
    renderSec(h.s);
    renderToc(h.d, h.s.id);
  });
}

document.getElementById('docBtn').onclick = () => openDrawer(curDoc, curSecId);
document.getElementById('docClose').onclick = () => document.getElementById('drawer').classList.add('hide');
document.getElementById('docSearch').oninput = (e) => docSearchGo(e.target.value);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('drawer').classList.add('hide');
});

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

","kp":["队列"]},{"id":"q208","ch":4,"type":"subj","text":"设顺序循环队列Q[0：M-1]的头指针和尾指针分别为F和R，头指针F总是指向队头元素的前一位置，尾指针R总是指向队尾元素的当前位置，则该循环队列中的元素个数为（ ）。","answer":"(R-F+M)％M","kp":["循环队列"]},{"id":"q209","ch":2,"type":"subj","text":"下面关于线性表的叙述错误的是（ ）。","answer":"线性表采用顺序存储便于插入和删除操作的实现","kp":["线性表"]},{"id":"q210","ch":4,"type":"subj","text":"设某数据结构的二元组形式表示为A=(D，R)，D={01，02，03，04，05，06，07，08， 09}，R={r}，r={<01，02>，<01，03>，<01，04>，<02，05>，<02，06>，<03，07>，<03，08>，<03，09>}，则数据结构A是（ ）。","answer":"树型结构","kp":["树"]},{"id":"q211","ch":3,"type":"subj","text":"则下列等式成立的是（ ）。","answer":"N0=N2+1","kp":["其他"]},{"id":"q212","ch":1,"type":"subj","text":"数据的最小单位是（ ）。","answer":"数据项","kp":["基本概念"]},{"id":"q213","ch":4,"type":"subj","text":"设用链表作为栈的存储结构则退栈操作（ ）。","answer":"必须判别栈是否为空","kp":["栈"]},{"id":"q214","ch":1,"type":"subj","text":"树最适合用来表示（ ）。","answer":"元素之间具有分支层次关系的数据","kp":["树"]},{"id":"q215","ch":3,"type":"subj","text":"设输入序列是1、2、3、??、n，经过栈的作用后输出序列的第一个元素是n，则输出序列中第i个输出元素是（ ）。","answer":"n+1-i","kp":["栈"]},{"id":"q216","ch":3,"type":"subj","text":"已知链栈的类型定义如下， 请实现进栈算法void push(const T &value);，将值为value的元素压入栈顶。 template <class T> class seqStack { private: T * data; // 存放栈中元素的数组 int top; // 栈顶指针，指向栈顶元素 int maxSize; // 栈的大小 void resize(); // 扩大栈空间 public: seqStack(int initSize = 100); ~seqStack(){ delete [] data;} void clear() { top = -1; } // 清空栈 bool empty() const{ return top == -1;}// 判空 int size() const{ return top+1; } // 求长度 void push(const T &value); // 进栈 T pop(); // 出栈 T getTop() const; // 取栈顶元素 };","answer":"template <class T> void linkStack<T>::push(const T &value) { Node *p = new Node(value, top); // 在栈顶插入元素 top = p; // p成为新的栈顶元素 }","kp":["栈"]},{"id":"q217","ch":4,"type":"subj","text":"已知单链表的类型定义如下， 请实现算法int size()const;求单链表的长度。注意：请将工作指针命名为p，计数器命名为count。 单链表的类型定义： template <class elemType> // elemType为单链表存储的元素类型 class linkList { private: struct Node { // 结点类型 public: elemType data; // 结点的数据域 Node * next; // 结点的指针域 Node(const elemType value, Node* p = NULL){ // 两个参数的构造函数 data = value; next = p; } Node(Node* p = NULL) { // 一个参数的构造函数 next = p; } }; Node* head; // 单链表的头指针 public: linkList(); // 构造函数 ~linkList(); // 析构函数 int size()const; // 返回单链表的当前实际长度 …… };","answer":"（原库无答案）","kp":["链表"]},{"id":"q218","ch":4,"type":"subj","text":"template<class elemType> void seqList<elemType>::inverse() { elemType tmp; for (int i = 0; i < curLength/2; i++){ // 控制交换的次数 tmp = data[i]; data[i] = data[curLength-i-1]; data[curLength-i-1] = tmp; } }","answer":"（原库无答案）","kp":["其他"]},{"id":"q219","ch":4,"type":"subj","text":"已知顺序表的类型定义如下， 请实现删除算法void remove(int i)，删除下标（位序）为i的元素。 顺序表的类型定义： template <class elemType> // elemType为顺序表存储的元素类型 class seqList{ private: elemType *data; // 利用动态数组存储数据元素 int curLength; // 当前顺序表中存储的元素个数 int maxSize; // 顺序表的最大长度 void resize(); // 表满时扩大表空间 public: seqList(int initSize = 10); // 构造函数 seqList(seqList & sl) ; // 拷贝构造函数 ~seqList(){ delete [] data; } // 析构函数 void clear(){ curLength = 0; } // 清空表，只需置curLength为0 bool empty()const{return curLength==0;} // 判空 int size()const{ return curLength; } // 返回顺序表中当前存储元素的个数 void remove(int i); // 删除位序i上的元素，表的长度减1 …… };","answer":"（原库无答案）","kp":["顺序表"]},{"id":"q220","ch":2,"type":"subj","text":"template <class elemType> void seqList<elemType>::remove(int i) { if (i < 0 || i > curLength-1) throw outOfRange(); // 合法的删除位置为[0..n-1] for (int j = i; j < curLength - 1; j++) // 下标j+1在[i+1..n-1]范围 data[j] = data[j+1] ; // 的元素往前移动一步 --curLength; // 表的实际长度减1 }","answer":"（原库无答案）","kp":["其他"]},{"id":"q221","ch":4,"type":"subj","text":"已知顺序表的类型定义如下， 请实现插入算法void insert(int i,const elemType &value)，在下标（位序）为i的位置插入值为value的元素。注意若线性表已满，需要扩大表空间。 顺序表的类型定义： template <class elemType> // elemType为顺序表存储的元素类型 class seqList{ private: elemType *data; // 利用动态数组存储数据元素 int curLength; // 当前顺序表中存储的元素个数 int maxSize; // 顺序表的最大长度 void resize(); // 表满时扩大表空间 public: seqList(int initSize = 10); // 构造函数 seqList(seqList & sl) ; // 拷贝构造函数 ~seqList(){ delete [] data; } // 析构函数 void clear(){ curLength = 0; } // 清空表，只需置curLength为0 bool empty()const{return curLength==0;} // 判空 int size()const{ return curLength; } // 返回顺序表中当前存储元素的个数 void insert(int i,const elemType &value); // 在位序i上插入值为value的元素，表的长度增1 …… };","answer":"（原库无答案）","kp":["顺序表"]},{"id":"q222","ch":4,"type":"subj","text":"template <class elemType> void seqList<elemType>::insert(int i, const elemType &value) { if (i < 0 || i > curLength) throw outOfRange(); // 合法的插入位置为[0..n] if (curLength == maxSize) resize(); // 表满，扩大数组容量 for (int j = curLength; j > i; j--) // 下标j-1在[curLength-1..i]范围 data[j] = data[j-1]; // 的元素往后移动一步 data[i] = value; // 将 value 置入位序为i的位置 ++curLength; // 表的实际长度增1 }","answer":"（原库无答案）","kp":["数组与矩阵"]},{"id":"q223","ch":4,"type":"subj","text":"已知顺序实现的字符串的类型定义如下， 请实现朴素的模式匹配算法int bfFind(const String &s, int pos = 0) const。当匹配成功时，返回子串在主串中第一次出现的位置；当匹配失败时，返回-1；当子串是空串时返回0。注意：请使用整型变量i访问主串，整型变量j访问子串。 class String{ public: String(const char *str = NULL); // 构造函数 String(const String &str); // 拷贝构造函数 ~String(){ delete []data;} // 析构函数 int capacity()const{return maxSize;} // 最大存储容量 int size()const{return curLength;} // 求字符串长度 bool empty()const{return curLength==0;}// 判空 int bfFind(const String &s, int pos = 0) const;// 朴素模式匹配(BF) private: char *data; // 存储字符串 int maxSize; // 最大存储容量 int curLength; // 串的长度 void resize(int len); // 扩大数组空间 };","answer":"int String::bfFind(const String &s, int pos) const{ int i = 0, j = 0; // 主串和子串的指针 if (curLength < s.curLength) return -1; // 主串比子串短，匹配失败 while (i < curLength && j < s.curLength){ if (data[i] == s.data[j]) // 对应字符相等指针后移 i++, j++; else { // 对应字符不相等时 i = i - j + 1; // 主串指针回溯 j = 0; } // 子串从头开始 } if (j >= s.curLength) return (i - s.curLength); // 返回子串在主串中的位置 else return -1; }","kp":["串·KMP"]},{"id":"q224","ch":4,"type":"subj","text":"已知循环队列的类型定义如下， 请实现出队算法T deQueue();注意处理队列为空的情况。 template <class T> class seqQueue{ private: T *data; // 指向存放元素的数组 int maxSize; // 队列的大小 int front, rear; // 队头和队尾指针 void resize(); // 扩大队列空间 public: seqQueue(int initsize = 100); ~seqQueue(){ delete [] data; } void clear(){ front = rear = -1; } // 清空队列 bool empty()const { return front == rear; } // 判空 bool full()const { return (rear + 1) % MaxSize == front; }// 判满 int size()const{ return (rear-front+maxSize)%maxSize; } // 队列长度 void enQueue(const T &x); // 入队 T deQueue(); // 出队 T getHead()const; // 取队首元素 };","answer":"（原库无答案）","kp":["循环队列"]},{"id":"q225","ch":4,"type":"subj","text":"template <class T> T seqQueue<T>::deQueue(){ // 若队列空，抛出异常 if (empty())throw outOfRange(); front = (front + 1) % maxSize; // 移动队首指针 return data[front]; // 返回队首元素 }","answer":"（原库无答案）","kp":["双端队列"]},{"id":"q226","ch":4,"type":"subj","text":"已知循环队列的类型定义如下， 请实现入队算法void enQueue(const T &x)，注意队满时扩大队列空间。 template <class T> class seqQueue{ private: T *data; // 指向存放元素的数组 int maxSize; // 队列的大小 int front, rear; // 队头和队尾指针 void resize(); // 扩大队列空间 public: seqQueue(int initsize = 100); ~seqQueue(){ delete [] data; } void clear(){ front = rear = -1; } // 清空队列 bool empty()const { return front == rear; } // 判空 bool full()const { return (rear + 1) % MaxSize == front; }// 判满 int size()const{ return (rear-front+maxSize)%maxSize; } // 队列长度 void enQueue(const T &x); // 入队 T deQueue(); // 出队 T getHead()const; // 取队首元素 };","answer":"（原库无答案）","kp":["循环队列"]},{"id":"q227","ch":4,"type":"subj","text":"template <class T> void seqQueue<T>::enQueue(const T &x){ // 若队列满，扩大队列 if ((rear + 1) % maxSize == front) resize(); rear = (rear + 1) % maxSize; // 移动队尾指针 data[rear] = x; // x入队 }","answer":"（原库无答案）","kp":["队列"]},{"id":"q228","ch":4,"type":"subj","text":"已知顺序栈的类型定义如下， 请实现出栈算法T pop()，注意处理栈为空的情况。工作指针请命名为p。 template <class T> class linkStack { private: struct Node{ T data; Node* next; Node(){ next = NULL; } Node(const T &value, Node *p = NULL){ data = value; next = p;} }; Node* top; // 栈顶指针 public: linkStack(){ top = NULL; } // 构造空栈 ~linkStack(){ clear(); } void clear(); // 清空 bool empty()const{ return top == NULL; } // 判空 int size()const; // 求长度 void push(const T &value); // 压栈 T pop(); // 出栈 T getTop()const; // 取栈顶元素 };","answer":"（原库无答案）","kp":["栈"]},{"id":"q229","ch":4,"type":"subj","text":"template <class T> T linkStack<T>::pop() { if (empty())throw outOfRange(); Node *p = top; T value = p->data; // value保存栈顶元素的值 top = top->next; // top指向向后移动 delete p; // 删除栈顶元素 return value; }","answer":"（原库无答案）","kp":["栈"]},{"id":"q230","ch":3,"type":"subj","text":"已知链栈的类型定义如下， 请实现出栈算法T pop()，注意处理栈为空的情况。 template <class T> class seqStack { private: T * data; // 存放栈中元素的数组 int top; // 栈顶指针，指向栈顶元素 int maxSize; // 栈的大小 void resize(); // 扩大栈空间 public: seqStack(int initSize = 100); ~seqStack(){ delete [] data;} void clear() { top = -1; } // 清空栈 bool empty() const{ return top == -1;}// 判空 int size() const{ return top+1; } // 求长度 void push(const T &value); // 进栈 T pop(); // 出栈 T getTop() const; // 取栈顶元素 };","answer":"（原库无答案）","kp":["栈"]},{"id":"q231","ch":3,"type":"subj","text":"template <class T> T seqStack<T>::pop(){ if(empty())throw outOfRange(); // 空栈无法弹栈 return data[top--]; // 修改栈顶指针，返回栈顶元素 }","answer":"（原库无答案）","kp":["栈"]},{"id":"q232","ch":3,"type":"subj","text":"已知顺序栈的类型定义如下， 请实现进栈算法void push(const T &value) ，若栈满了需要扩大栈空间。 template <class T> class seqStack { private: T * data; // 存放栈中元素的数组 int top; // 栈顶指针，指向栈顶元素 int maxSize; // 栈的大小 void resize(); // 扩大栈空间 public: seqStack(int initSize = 100); ~seqStack(){ delete [] data;} void clear() { top = -1; } // 清空栈 bool empty() const{ return top == -1;}// 判空 int size() const{ return top+1; } // 求长度 void push(const T &value); // 进栈 T pop(); // 出栈 T getTop() const; // 取栈顶元素 };","answer":"（原库无答案）","kp":["栈"]},{"id":"q233","ch":4,"type":"subj","text":"template <class T> void seqStack<T>::push(const T &value) { // 检查顺序栈是否已满 if (top == maxSize - 1) resize(); data[++top] = value;// 修改栈顶指针，新元素入栈 }","answer":"设将n（n>1）个整数存放到一维数组R中。试设计一个在时间和空间两方面都尽可能高效的算法，将R中保存的序列循环左移P（0<P<n）个位置， 即将R中的数据由（X0,X1,…,Xn-1）变换为（Xp,Xp+1,…,Xn-1,X0,X1,…,Xp-1）。 注意:请按照如下格式书写答案，用于交换的临时变量名为t void leftshift(int R[], int p, int n) //将有n个元素的一维数组R的序列循环左移p(0<p<n)个位置 { //填代码 } / void leftshift(int R[], int p, int n) //将有n个元素的一维数组R的序列循环左移p(0<p<n)个位置 { int t; //t和数组R中的元素具有相同类型 for(i=0;i<p/2;i++) //逆置0..p-1段 { t=R[i]; R[i]=R[p-1-i]; R[p-1-i]=t;} for(i=p;i<(n+p)/2;i++) //逆置p..n-1段 { t=R[i]; R[i]=R[n-1-i+p];R[n-1-i+p]=t;} for(i=0;i<n/2;i++) //逆置0..n-1段，即整个数组逆置 { t=R[i]; R[i]=R[n-1-i]; R[n-1-i]=t;} }","kp":["栈"]},{"id":"q234","ch":4,"type":"subj","text":"当各边上的权值（ ）时，BFS算法可用来解决单源最短路径问题。","answer":"均相等","kp":["最短路径"]},{"id":"q235","ch":4,"type":"fill","text":"堆一般采用________结构存储表示。具有n个元素的最小堆，其最大值元素的可能位置介于________和________之间（根结点位于1号单元）。（遵循C语言规则，\"/\"用于整数除法求得结果为商）","blank":3,"parts":["顺序","n/2+1","n"],"answer":"顺序 n/2+1 n","kp":["堆"]},{"id":"q236","ch":4,"type":"subj","text":"已知小根堆为8，15，10，21，34，16，12，删除关键字8之后需重建堆，在此过程中，关键字之间的比较数是（ ）。","answer":"3","kp":["堆"]},{"id":"q237","ch":4,"type":"subj","text":"已知关键字序列5,8,12,19,28,20,15,22是小根堆（最小堆）,插入关键字3,调整后得到的小根堆是（ ）。","answer":"3,5,12,8,28,20,15,22,19","kp":["堆"]},{"id":"q238","ch":4,"type":"subj","text":"5个字符有如下4种编码方案，不是前缀编码的是( )","answer":"0,100,110,1110,1100","kp":["其他"]},{"id":"q239","ch":4,"type":"subj","text":"在一棵度为4的树T中，若有20个度为4的结点，10个度为3的结点，1个度为2的结点，10个度为1的结点，则树T的叶结点个数是（ ）。","answer":"82","kp":["树"]},{"id":"q240","ch":4,"type":"subj","text":"有一组数据(15，9，7，8，20，-1，7，4)，用堆的向下筛选方法建立的初始小根堆为( )。","answer":"-1，4，7，8，20，15，7，9","kp":["堆"]},{"id":"q241","ch":1,"type":"subj","text":"从堆中删除一个元素的时间复杂度为( ) 。","answer":"0(log2n)","kp":["堆","复杂度分析"]},{"id":"q242","ch":4,"type":"subj","text":"以下序列不是堆的是( )。","answer":"100,85,40,77,80,60,66,98,82,10,20","kp":["堆"]},{"id":"q243","ch":1,"type":"subj","text":"在含有n个关键字的小根堆(堆顶元素最小)中，关键字最大的记录有可能存储在( )位置上。","answer":"n/2 +2","kp":["堆"]},{"id":"q244","ch":4,"type":"subj","text":"已知一算术表达式的中缀形式为A+B*C-D/E，后缀形式为ABC*+DE/-，其前缀形式为（ ）。","answer":"-+A*BC/DE","kp":["栈"]},{"id":"q245","ch":4,"type":"fill","text":"字符串'ababaaab'的nextVal数组值序列为______________。(用空格分隔各数值)","blank":1,"parts":null,"answer":"-1 0 -1 1 -1 3 1 0","kp":["串·KMP"]},{"id":"q246","ch":4,"type":"fill","text":"模式串P='abaabcac'的next数组值序列为______________。(用空格分隔各数值)","blank":1,"parts":null,"answer":"-1 0 0 1 1 2 0 1","kp":["串·KMP"]},{"id":"q247","ch":4,"type":"fill","text":"设主串长度为n，模式串长度为m，则KMP算法的时间复杂度为______________。","blank":1,"parts":["O(m+n)"],"answer":"O(m+n)","kp":["串·KMP","复杂度分析"]},{"id":"q248","ch":4,"type":"fill","text":"组成串的数据元素只能是______________。","blank":1,"parts":["字符"],"answer":"字符","kp":["串"]},{"id":"q249","ch":4,"type":"fill","text":"用循环链表表示的队列长度为n，若只设头指针，则出队和入队的时间复杂度分别是______和______；若只设尾指针，则出队和入队的时间复杂度分别是______和______。（填O(1) 、O(log2n) 、O(n) 、O(nlog2n)或O(n*n)）","blank":4,"parts":["O(1)","O(n)","O(1)","O(1)"],"answer":"O(1) O(n) O(1) O(1)","kp":["队列","复杂度分析"]},{"id":"q250","ch":4,"type":"fill","text":"在循环队列中，队列长度为n ,存储位置从0到n-1编号，以rear指示实际的队尾元素，现要在此队列中插入一个新元素，新元素的位置是______________。（填rear的计算公式）","blank":1,"parts":["rear=(rear+1)%n"],"answer":"rear=(rear+1)%n","kp":["循环队列"]},{"id":"q251","ch":3,"type":"fill","text":"循环队列的引入，目的是为了克服______________的现象。","blank":1,"parts":["假溢出"],"answer":"假溢出","kp":["循环队列"]},{"id":"q252","ch":4,"type":"fill","text":"表达式23+(12*3-2)的后缀表达式是______________。","blank":1,"parts":null,"answer":"23 12 3*2- +","kp":["栈"]},{"id":"q253","ch":3,"type":"fill","text":"栈和队列都是操作受限的线性表，栈的运算遵循______________的原则，队列的运算遵循______________的原则。","blank":2,"parts":["先进后出","先进先出"],"answer":"先进后出 先进先出","kp":["队列"]},{"id":"q254","ch":2,"type":"fill","text":"对于一个具有n个结点的单链表，在已知的结点p后插入一个新结点的时间复杂度为_________,在值为x的结点后插入一个新结点的时间复杂度为_________。（填O(1) 、O(log2n) 、O(n) 、O(nlog2n)或O(n*n)）","blank":2,"parts":["O(1)","O(n)"],"answer":"O(1) O(n)","kp":["链表","复杂度分析"]},{"id":"q255","ch":2,"type":"fill","text":"在单链表L中，指针p所指结点有后继结点的条件是_________。(写出关系表达式)","blank":1,"parts":["p->next!=NULL"],"answer":"p->next!=NULL","kp":["链表"]},{"id":"q256","ch":4,"type":"fill","text":"顺序存储结构是通过_________表示元素之间的关系的;链式存储结构是通过_________表示元素之间的关系的。","blank":2,"parts":null,"answer":"元素的存储位置 指针 / 串长度是指串中不同字符的个数。 / 错误 / 两个长度不相同的串有可能相等。 / 错误 / 设模式串的长度为m,目标串的长度为n，当n≈m且处理只匹配一次的模式时，朴素的匹配（即子串定位函数）算法所花的时间代价可能会更为节省。 / 正确 / KMP算法的特点是在模式匹配时指示主串的指针不会变小。 / 正确 / 栈和队列的存储方式，既可以是顺序方式，又可以是链式方式。 / 正确 / 在链队列中，即使不设置尾指针也能进行入队操作。 / 正确 / 栈和队列都是线性表，只是在插入和删除时受到了一些限制。 / 正确 / 通常使用队列来处理函数或过程的调用。 / 错误 / 消除递归不一定需要使用栈。 / 正确 / 线性表中每个元素都有一个直接前驱和一个直接后继。 / 错误 / 顺序存储方式的优点是存储密度大，且插入、删除运算效率高。 / 错误 / 顺序存储方式只能用于存储线性结构。 / 错误 / 对任何数据结构链式存储结构一定优于顺序存储结构。 / 错误 / 顺序存储方式插入和删除时效率太低，因此它不如链式存储方式好。 / 错误 / 线性表采用链表存储时，结点和结点之间的存储空间可以是不连续的。 / 正确 / 已知字符串S为\"abaabaabacacaabaabcc\". 模式串t为\"abaabc\", 采用KMP算法进行匹配，第一次出现\"失配\"(s[i] != t[i]) 时，i=j=5,则下次开始匹配时，i和j的值分别是 / i=5，j=2","kp":["串·KMP"]},{"id":"q257","ch":3,"type":"subj","text":"循环队列存放在一维数组A[0..M-1]中，end1指向队头元素，end2指向队尾元素的后一个位置。假设队列两端均可进行入队和出队操作，队列中最多能容纳M－1个元素，初始时为空。下列判断队空和队满的条件中，正确的是（ ）","answer":"队空：end1==end2; 队满：end1==(end2+1) mod M","kp":["循环队列"]},{"id":"q258","ch":3,"type":"subj","text":"某队列允许在其两端进行入队操作，但仅允许在一端进行出队操作。若元素a，b，c，d，e依次入此队列后再进行出队操作，则不可能得到的出队序列是（ ）","answer":"d,b,c,a,e","kp":["队列"]},{"id":"q259","ch":3,"type":"subj","text":"为解决计算机主机与打印机之间速度不匹配问题，通常设置一个打印数据缓冲区，主机将要输出的数据依次写入该缓冲区，而打印机则依次从该缓冲区中取出数据。该缓冲区的逻辑结构应该是（ ）","answer":"队列","kp":["队列"]},{"id":"q260","ch":4,"type":"subj","text":"下列关于栈的叙述中，错误的是（ ） I、采用非递归方式重写递归程序时必须使用栈 II、函数调用时，系统要用栈保存必要的信息 III、只要确定了入栈次序，即可确定出栈次序","answer":"仅I、III、IV","kp":["栈"]},{"id":"q261","ch":4,"type":"subj","text":"已知程序如下： int s(int n) { return (n<=0) ? 0 : s(n-1) +n; } void main() { cout<< s(1); } 程序运行时使用栈来保存调用过程的信息，自栈底到栈顶保存的信息一次对应的是","answer":"（原库无答案）","kp":["栈"]},{"id":"q262","ch":4,"type":"subj","text":"main()->S(1)->S(0)","answer":"（原库无答案）","kp":["其他"]},{"id":"q263","ch":4,"type":"subj","text":"假设栈初始为空，将中缀表达式a/b+(c*d-e*f)/g转换为等价的后缀表达式的过程中，当扫描到f时，栈中的元素依次是（ ）","answer":"+(-*","kp":["栈"]},{"id":"q264","ch":4,"type":"subj","text":"中缀表达式（A+B）*（C-D）/(E-F*G)的后缀表达式是（ ）","answer":"AB+CD-*EFG*-/","kp":["栈"]},{"id":"q265","ch":4,"type":"subj","text":"已知操作符包括'+'，'-'，'*'，'/'，'('和')'。将中缀表达式a+b-a*((c+d)/e-f)+g转换为等价的后缀表达式ab+acd+e/f-*-g+时，用栈来存放暂时还不能确定运算次序的操作符。若栈初始时为空，则转换过程中同时保存在栈中的操作符的最大个数是（ ）","answer":"5","kp":["栈"]},{"id":"q266","ch":3,"type":"subj","text":"一个栈的入栈序列为 1, 2, 3,…,n，其出栈序列是 p1, p2 , p3…pn。若 p2为 3 ，则 p3 可能取值的个数是( )","answer":"n-1 / 元素a，b，c，d，e依次进入初始为空的栈中，若元素进栈后可停留、可出栈，直到所有元素都出栈，则在所有可能的出栈序列中，以元素d开头的序列个数是 / 4","kp":["栈"]},{"id":"q267","ch":4,"type":"subj","text":"若元素a，b，c，d，e，f依次进栈，允许进栈、退栈操作交替进行，但不允许连续三次进行退栈操作，则不可能得到的出栈序列是（ ）","answer":"a,f,e,d,c,b","kp":["栈"]},{"id":"q268","ch":2,"type":"subj","text":"己知一个带有表头结点的双向循环链表L，结点结构为（prev，data，next），其中prev和next分别是指向其直接前驱和直接后继结点的指针。现要删除指针p所指的结点，正确的语句序列是（ ）","answer":"p->next->prev = p->prev; p->prev->next = p->next; free (p);","kp":["循环链表"]},{"id":"q269","ch":4,"type":"subj","text":"若串S=\"software\",其子串的数目是( )。","answer":"37","kp":["串"]},{"id":"q270","ch":4,"type":"subj","text":"设有两个串S1和S2，求S2在S1中首次出现的位置的运算称作（ ）。","answer":"模型匹配","kp":["串"]},{"id":"q271","ch":4,"type":"subj","text":"设S为一个长度为n的字符串，其中的字符各不相同，则S中的互异的非平凡子串（非空且不同于S本身）的个数为（ ）。","answer":"(n2/2)+(n/2)-1","kp":["串"]},{"id":"q272","ch":4,"type":"subj","text":"串的长度是指（ ）。","answer":"串中所含字符的个数","kp":["串"]},{"id":"q273","ch":4,"type":"subj","text":"串是一种特殊的线性表，下面哪个叙述体现了这种特殊性？","answer":"数据元素是一个字符","kp":["线性表"]},{"id":"q274","ch":4,"type":"subj","text":"下面关于串的的叙述中，哪一个是不正确的？","answer":"空串是由空格构成的串","kp":["串"]},{"id":"q275","ch":3,"type":"subj","text":"若以1234作为双端队列的输入序列，则既不能由输入受限的双端队列(一端输入，两端输出)得到，也不能由输出受限的双端队列(两端输入，一端输出)得到的输出序列是（ ）","answer":"4231","kp":["双端队列"]},{"id":"q276","ch":3,"type":"subj","text":"循环队列存储在数组A[0..m]中，则入队时的操作为（ ）。","answer":"rear=(rear+1)mod(m+1)","kp":["循环队列"]},{"id":"q277","ch":4,"type":"subj","text":"循环队列A[0..m-1]存放其元素值，用front和rear分别表示队头和队尾，则当前队列中的元素数是( )。","answer":"(rear-front+m)%m","kp":["循环队列"]},{"id":"q278","ch":1,"type":"subj","text":"一个递归算法必须包括（ ）。","answer":"终止条件和递归部分","kp":["递归"]},{"id":"q279","ch":3,"type":"subj","text":"若栈采用顺序存储方式存储，现两栈共享空间V[1..m]，top[i]代表第i个栈( i =1,2)栈顶，栈1的底在v[1]，栈2的底在V[m]，则栈满的条件是（ ）。","answer":"top[1]+1=top[2]","kp":["栈"]},{"id":"q280","ch":4,"type":"subj","text":"设栈的输入序列是1，2，3，4,则（ ）不可能是其出栈序列。","answer":"4，3，1，2","kp":["栈"]},{"id":"q281","ch":3,"type":"subj","text":"一个栈的输入序列为123…n，若输出序列的第一个元素是n，输出第i（1<=i<=n）个元素是（ ）。","answer":"n-i+1","kp":["栈"]},{"id":"q282","ch":3,"type":"subj","text":"对于栈操作数据的原则是（ ）。","answer":"后进先出","kp":["栈"]},{"id":"q283","ch":2,"type":"subj","text":"在循环双链表的p结点之后插入s结点的操作是（ ）","answer":"s->prior=p; s->next=p->next; p>next->prior=s; p->next=s;","kp":["双向链表"]},{"id":"q284","ch":2,"type":"subj","text":"双向链表中有两个指针域，prior和next分别指向前趋及后继，设p指向链表中的一个结点，现要求删去p所指结点，则正确的删除是（ ）（链中结点数大于2，p不是第一个结点）","answer":"p->prior->next = p->next; p->next->prior = p->prior; delete p;","kp":["双向链表"]},{"id":"q285","ch":2,"type":"subj","text":"在单链表的指针为p的结点之后插入指针为s的结点，正确的操作是（ ）","answer":"s->next = p->next; p->next = s;","kp":["链表"]},{"id":"q286","ch":2,"type":"subj","text":"对于一个头指针为head的带头结点的单链表，判定该表为空表的条件是（ ）","answer":"head->next == NULL","kp":["链表"]},{"id":"q287","ch":4,"type":"subj","text":"在一个以h为头指针（指向头结点）的单循环链中，p指针指向链尾的条件是（ ）","answer":"p->next == h","kp":["其他"]},{"id":"q288","ch":1,"type":"subj","text":"单链表中，增加一个头结点的目的是为了( ）","answer":"方便运算的实现","kp":["链表"]},{"id":"q289","ch":1,"type":"subj","text":"在n个结点的线性表的顺序实现中，算法的时间复杂性是O(1)的操作是( )","answer":"访问第i个结点和求第i个结点的直接前驱","kp":["线性表"]},{"id":"q290","ch":2,"type":"subj","text":"链表不具有的特点是（ ）","answer":"可随机访问任一元素","kp":["链表"]},{"id":"q291","ch":2,"type":"subj","text":"某线性表中最常用的操作是在最后一个元素之后插入一个元素和删除第一个元素，则采用（ ）存储方式最节省运算时间。","answer":"仅有尾指针的单循环链表","kp":["循环链表"]},{"id":"q292","ch":4,"type":"subj","text":"若某线性表最常用的操作是存取任一指定序号的元素和在最后进行插入和删除运算，则利用（ ）存储方式最节省时间。","answer":"顺序表","kp":["顺序表"]},{"id":"q293","ch":1,"type":"fill","text":"线性结构中元素之间存在1:1的关系，树形结构中元素之间存在__________的关系，图形结构中元素之间存在__________的关系。（按线性结构样式填写）","blank":2,"parts":["1:多","多:多"],"answer":"1:多 多:多","kp":["树"]},{"id":"q294","ch":1,"type":"fill","text":"评价算法的优劣通常主要考虑算法的__________和__________这两方面。","blank":2,"parts":["时间复杂度","空间复杂度"],"answer":"时间复杂度 空间复杂度","kp":["复杂度分析"]},{"id":"q295","ch":1,"type":"fill","text":"算法的５个重要特性是有穷性、__________ 、 可行性、输入、__________。","blank":2,"parts":["确定性","输出"],"answer":"确定性 输出","kp":["基本概念"]},{"id":"q296","ch":1,"type":"fill","text":"常见的数据结构有集合、线性结构、__________结构、_________结构。","blank":2,"parts":null,"answer":"树形 图形 / 抽象数据类型与计算机内部表示和实现无关； / 正确 / 数据的逻辑结构与数据元素本身的内容和形式无关。 / 正确 / 算法可以没有输出。 / 错误 / 程序和算法没有区别。 / 错误","kp":["基本概念"]},{"id":"q297","ch":1,"type":"subj","text":"在数据结构中，从逻辑上可以将之分为( )。","answer":"线性结构和非线性结构","kp":["其他"]},{"id":"q298","ch":1,"type":"subj","text":"下列函数的时间复杂度( )。 int func(int n) { int i=0,sum=0; while( sum<n ) sum += ++i; return i; }","answer":"O(n1/2)即n的1/2次方","kp":["复杂度分析"]},{"id":"q299","ch":1,"type":"subj","text":"下列程序段的时间复杂度( )。 count=0; for(k=1; k<=n; k*=2) for(j=1; j<=n; j+=1) count++;","answer":"O(nlogn)","kp":["复杂度分析"]},{"id":"q300","ch":1,"type":"subj","text":"求整数n(n>=0)阶乘的算法如下，其时间复杂度是( )。 int fact(int n){ if (n<=1) return 1； return n*fact(n-1)； }","answer":"O(n) / 设n是描述问题规模的非负整数，下面程序片段的时间复杂度是 x=2; while(x<n/2) x=2*x; / O(logn)","kp":["复杂度分析"]},{"id":"q301","ch":3,"type":"subj","text":"算法分析的目的是（ ）","answer":"分析算法的效率以求改进","kp":["其他"]},{"id":"q302","ch":3,"type":"subj","text":"算法的计算量大小称为算法的( )","answer":"时间复杂度","kp":["复杂度分析"]},{"id":"q303","ch":1,"type":"subj","text":"链式存储结构所占存储空间 ( )","answer":"分两部分一部分存放结点的值，另一部分存放表示结点间关系的指针","kp":["基本概念"]},{"id":"q304","ch":2,"type":"subj","text":"非线性结构中的每个结点( )","answer":"可能有多个直接前趋结点和多个直接后继结点","kp":["其他"]},{"id":"q305","ch":1,"type":"subj","text":"数据元素之间没有任何逻辑关系的是( )","answer":"集合","kp":["基本概念"]},{"id":"q306","ch":1,"type":"subj","text":"数据结构通常是研究数据的( )及它们之间的相互联系","answer":"存储结构和逻辑结构","kp":["基本概念"]},{"id":"q307","ch":1,"type":"choice","text":"以下数据结构中,( )是非线性数据结构","opts":[{"k":"A","t":"树"},{"k":"B","t":"字符串"},{"k":"C","t":"队列"},{"k":"D","t":"栈"}],"correct":["A"],"exp":"解析：树是典型的非线性结构（一对多）；字符串、队列、栈都是线性结构。","kp":["队列"]},{"id":"q308","ch":1,"type":"choice","text":"以下说法正确的是( )。","opts":[{"k":"A","t":"数据元素是数据的最小单位"},{"k":"B","t":"数据项是数据的基本单位"},{"k":"C","t":"数据结构是带有结构的各数据项的集合"},{"k":"D","t":"一些表面上很不相同的数据可以有相同的逻辑结构"}],"correct":["D"],"exp":"解析：A 错：数据元素是数据的基本单位，数据项才是最小单位；B 颠倒了两者；C 错：数据结构是带结构的数据元素的集合，不是数据项的集合；D 对：不同的数据（如学生表与图书表）可以具有相同的逻辑结构。","kp":["基本概念"]},{"id":"q309","ch":4,"type":"choice","text":"若采用连续分配的存储方式存放数据元素，则各元素对应的存储单元地址（ ）。","opts":[{"k":"A","t":"必定是连续的整数序列"},{"k":"B","t":"必定是不连续分布的"},{"k":"C","t":"可以连续也可以不连续，取决于元素类型"},{"k":"D","t":"仅首地址连续，其余由指针维护"}],"correct":["A"],"exp":"解析：连续分配就是顺序存储，各元素在内存中占用连续的存储单元，地址构成连续整数序列。","kp":["基本概念"]},{"id":"q310","ch":1,"type":"choice","text":"影响算法实际运行时间的主要因素包括（ ）。","opts":[{"k":"A","t":"输入数据的规模"},{"k":"B","t":"输入数据的初始分布状态"},{"k":"C","t":"硬件和编译系统的性能"},{"k":"D","t":"以上因素共同影响"}],"correct":["D"],"exp":"解析：算法运行时间既与问题规模 n、输入数据的初始状态有关，也受机器硬件、编译系统影响，所以四个选项都对，选\"以上因素共同影响\"。","kp":["其他"]},{"id":"q311","ch":1,"type":"choice","text":"下列关于\"算法\"的表述中，正确的是（ ）。","opts":[{"k":"A","t":"算法就是采用某种编程语言写成的可执行程序"},{"k":"B","t":"算法必须包含无限循环以保证系统持续运行"},{"k":"C","t":"算法是对特定问题求解步骤的有限、确定的描述"},{"k":"D","t":"算法的每一步都可以有多种不同的理解方式"}],"correct":["C"],"exp":"解析：算法是求解步骤的有限、确定的描述；程序是算法的某种语言实现，二者不等价。A 混淆了算法与程序；B 违反有穷性；D 违反确定性。\n## 二、填空题（5 题）","kp":["其他"]},{"id":"q312","ch":1,"type":"fill","text":"计算机执行下面的语句时,语句s的执行次数为 ____。 for(i=1;i<n-1;i++) for(j=n;j>=i;j--) s;","blank":1,"parts":null,"answer":"(n-2)(n+3)/2\n\n解析：外层 i 取 1~n-2 共 n-2 轮；内层 j 从 n 递减到 i，共 n-i+1 次。总次数 = Σ(n-i+1) = n+(n-1)+…+3 = n(n+1)/2-3 = (n-2)(n+3)/2。你填的式子是对的，被系统判错多半是书写格式不一致（如要求写成 (n-2)*(n+3)/2）。","kp":["其他"]},{"id":"q313","ch":1,"type":"fill","text":"x=0； for(i=1; i<n; i++) for (j=1; j<=n-i; j++) x++; 时间复杂度为：___________。","blank":1,"parts":null,"answer":"O(n^2)\n\n解析：外层约 n 次，内层约 n 次，总次数约 n²/2，取数量级为 O(n²)。","kp":["复杂度分析"]},{"id":"q314","ch":1,"type":"fill","text":"一个数据结构在计算机中的____称为存储结构。","blank":1,"parts":null,"answer":"表示\n\n解析：教材定义：数据的存储结构（物理结构）是数据的逻辑结构在计算机中的表示（又称映像）。你填\"表示\"被判错，属于平台按字符串严格比对的问题。","kp":["串"]},{"id":"q315","ch":1,"type":"fill","text":"数据的物理结构包括____的表示、____的表示。","blank":2,"parts":null,"answer":"① 数据元素；② 数据元素之间的关系\n\n解析：物理结构包含两方面：数据元素本身的表示（存储），以及数据元素之间关系的表示（如顺序关系用相邻位置表示，链式关系用指针表示）。你填的内容是对的，被判错同样是格式问题（多写了\"的\"字）。","kp":["基本概念"]},{"id":"q316","ch":1,"type":"fill","text":"下面程序段的时间复杂度为____。(n>1) sum=1; for (i=0;sum<n;i++) sum+=1;","blank":1,"parts":null,"answer":"O(n)\n\n解析：sum 从 1 开始每次加 1，直到 sum≥n，循环约执行 n-1 次，是线性阶。注意循环变量 i 与 sum 同步增长，循环次数由 sum<n 控制，不是 n²。\n\n## 三、判断题（5 题）","kp":["复杂度分析"]},{"id":"q317","ch":1,"type":"choice","text":"算法可以用不同的语言描述,如果用C 语言或PASCAL语言等高级语言来描述,则算法实际上就是程序了。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：算法可以用自然语言、流程图、伪代码或高级语言描述，但用高级语言写出的程序还受语法、具体机器等约束，算法与程序并不等同。","kp":["图"]},{"id":"q318","ch":1,"type":"choice","text":"数据的逻辑结构是指数据的组织形式,即数据元素之间逻辑关系的总体。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：逻辑结构正是描述数据元素之间逻辑关系的整体，与存储无关。","kp":["基本概念"]},{"id":"q319","ch":1,"type":"choice","text":"数据元素是构成数据的基本单位，而数据项是不可再分的最小标识单位。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：数据元素是数据的基本单位（一个整体），数据项是构成数据元素的、不可再分的最小单位。","kp":["基本概念"]},{"id":"q320","ch":1,"type":"choice","text":"数据的物理结构是指数据在计算机内的实际存储形式。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：物理结构（存储结构）就是数据在计算机内的实际存储形式。","kp":["基本概念"]},{"id":"q321","ch":1,"type":"choice","text":"程序一定是算法。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：程序不一定满足算法的五个特性（有穷性、确定性、可行性、输入、输出），例如死循环的程序就不是算法。\n## 四、主观题（2 题）","kp":["基本概念"]},{"id":"q322","ch":1,"type":"subj","text":"当前主流的数据存储实现方式有哪几种基本类型？请分别指出其最核心的适用场景或优缺点。","answer":"顺序存储 / 链式存储\n\n解析：参考答法：① 顺序存储--用一组连续的存储单元依次存放元素，逻辑相邻即物理相邻。优点是支持随机存取、存储密度高、实现简单；缺点是不易扩充，插入删除要移动大量元素。适用于元素个数相对稳定、以查询为主的场合（数组、顺序表）。② 链式存储--用指针把分散的结点链接起来，逻辑关系由指针体现。优点是插入删除只需改指针、便于动态增长；缺点是不能随机存取、每个结点要额外指针空间、存储密度较低。适用于频繁插入删除、规模动态变化的场合（单链表、双向链表、树）。你原来的作答要点齐全，可以直接用。","kp":["双向链表"]},{"id":"q323","ch":1,"type":"subj","text":"数据结构与数据类型在概念上有何联系与区别？请从\"抽象\"和\"实现\"的角度加以辨析。","answer":"抽象 vs 实现\n\n解析：参考答法：数据类型是一个抽象概念，刻画一组值的集合以及定义在这组值上的一组操作，使用者只关心\"能做什么\"，不关心\"怎么做\"。数据结构更强调实现层面，研究数据元素之间的逻辑关系、在计算机中的存储表示以及相应的运算实现。联系：数据类型可以借助数据结构来实现（如\"栈\"这一数据类型用顺序栈或链栈实现）；抽象数据类型（ADT）把二者统一起来--对外只暴露操作接口，对内用具体的数据结构实现。区别：数据类型偏\"接口/语义\"，数据结构偏\"结构/实现\"。\n\n---\n\n# 第二章作业\n\n- 截止时间：2026-10-11 23:59　题量：35 题\n\n## 一、单选题（15 题）","kp":["栈"]},{"id":"q324","ch":2,"type":"choice","text":"对于顺序存储的线性表，访问结点和增加、删除结点的时间复杂度为（ ）。","opts":[{"k":"A","t":"O(n) O(n)"},{"k":"B","t":"O(n) O(1)"},{"k":"C","t":"O(1) O(n)"},{"k":"D","t":"O(1) O(1)"}],"correct":["C"],"exp":"解析：顺序表支持随机存取，按位访问是 O(1)；插入、删除平均要移动一半元素，是 O(n)。","kp":["顺序表","复杂度分析"]},{"id":"q325","ch":2,"type":"choice","text":"非空线性表，关于元素前驱后继描述正确的是（ ）。","opts":[{"k":"A","t":"第一个元素既有前驱又有后继"},{"k":"B","t":"最后一个元素没有后继"},{"k":"C","t":"最后一个元素既有前驱又有后继"},{"k":"D","t":"所有元素都一定有前驱和后继"}],"correct":["B"],"exp":"解析：非空线性表中，第一个元素没有前驱，最后一个元素没有后继，其余元素各有一个前驱和一个后继。","kp":["线性表"]},{"id":"q326","ch":4,"type":"choice","text":"下面关于链式存储的存储结构所占存储空间描述正确的是（ ）。","opts":[{"k":"A","t":"分两部分，一部分存放结点值，另一部分存放表示结点间关系的指针"},{"k":"B","t":"只有一部分，存放结点值"},{"k":"C","t":"只有一部分，存储表示结点间关系的指针"},{"k":"D","t":"分两部分，一部分存放结点值，另一部分存放结点所占单元数"}],"correct":["A"],"exp":"解析：链式存储的每个结点分两部分：数据域（存结点值）和指针域（存后继结点地址）。","kp":["基本概念"]},{"id":"q327","ch":1,"type":"choice","text":"线性表使用链式存储方式进行存储，内存里各个结点的存储单元地址满足下面哪一种情况（ ）。","opts":[{"k":"A","t":"必须是连续的"},{"k":"B","t":"部分地址必须是连续的"},{"k":"C","t":"一定是不连续的"},{"k":"D","t":"连续或不连续都可以"}],"correct":["D"],"exp":"解析：链式存储的结点是动态分配的，物理地址连续与否都可以，逻辑关系由指针维系。","kp":["线性表"]},{"id":"q328","ch":4,"type":"choice","text":"对于单链表，若要把指针s指向的新结点插入到指针p所指向结点的后面，对应的语句序列是（ ）。","opts":[{"k":"A","t":"s->next=p+1; p->next=s;"},{"k":"B","t":"(*p).next=s; (*s).next=(*p).next;"},{"k":"C","t":"s->next=p->next; p->next=s->next;"},{"k":"D","t":"s->next=p->next; p->next=s;"}],"correct":["D"],"exp":"解析：先让新结点 s 指向 p 的后继，再让 p 指向 s：`s->next=p->next; p->next=s;`。顺序不能反，否则会丢失 p 原来的后继。","kp":["链表"]},{"id":"q329","ch":4,"type":"choice","text":"采用双向链表存储数据，要删除指针 p 指向的结点，需要完成的指针修改操作是（）。","opts":[{"k":"A","t":"p->next->prior=p->prior; p->prior->next=p->next;"},{"k":"B","t":"p->next=p->next->next; p->next->prior=p;"},{"k":"C","t":"p->prior->next=p; p->prior=p->prior->prior;"},{"k":"D","t":"p->prior=p->next->next; p->next=p->prior->prior;"}],"correct":["A"],"exp":"解析：双向链表删除 p：让 p 的后继的前驱指向 p 的前驱，让 p 的前驱的后继指向 p 的后继，即 `p->next->prior=p->prior; p->prior->next=p->next;`，最后再释放 p。","kp":["双向链表"]},{"id":"q330","ch":4,"type":"choice","text":"已知双向循环链表，要把 q 指向的新结点插入到 p 所指向结点的后面，下列指针修改步骤正确的是（）。","opts":[{"k":"A","t":"p->next=q; q->prior=p; p->next->prior=q; q->next=q;"},{"k":"B","t":"p->next=q; p->next->prior=q; q->prior=p; q->next=p->next;"},{"k":"C","t":"q->prior=p; q->next=p->next; p->next->prior=q; p->next=q;"},{"k":"D","t":"q->prior=p; q->next=p->next; p->next=q; p->next->prior=q;"}],"correct":["C"],"exp":"解析：在 p 之后插入 q 的四步：q->prior=p；q->next=p->next；p->next->prior=q；p->next=q。顺序的关键是\"先接后断\"，先处理 q 的两条指针和原后继的 prior，最后再改 p->next。","kp":["循环链表"]},{"id":"q331","ch":2,"type":"choice","text":"某线性表中最常用的操作是在最后一个元素之后插入一个元素和删除第一个元素，则采用（ ）存储方式最节省运算时间。","opts":[{"k":"A","t":"单链表"},{"k":"B","t":"仅有头指针的单循环链表"},{"k":"C","t":"双链表"},{"k":"D","t":"仅有尾指针的单循环链表"}],"correct":["D"],"exp":"解析：\"尾部插入 + 删除第一个\"都需要 O(1) 地到达表尾和表头。仅有尾指针的单循环链表：尾指针 rear 的 next 就是头结点，两个操作都能 O(1) 完成。","kp":["双向链表"]},{"id":"q332","ch":4,"type":"choice","text":"静态链表中指针表示的是（ ）。","opts":[{"k":"A","t":"内存地址"},{"k":"B","t":"数组下标"},{"k":"C","t":"下一元素地址"},{"k":"D","t":"左、右孩子地址"}],"correct":["B"],"exp":"解析：静态链表用数组模拟链表，结点中的\"指针\"存的是数组下标（游标），不是内存地址。本题你选 B 却被判 0 分，与教材结论矛盾，疑似平台答案键有误。","kp":["静态链表"]},{"id":"q333","ch":4,"type":"choice","text":"单链表的头结点（不存储实际数据）的主要作用是（ ）。","opts":[{"k":"A","t":"简化插入和删除操作，避免处理空链表的特殊情况"},{"k":"B","t":"提高随机访问第 k 个元素的速度"},{"k":"C","t":"减少链表占用的内存空间"},{"k":"D","t":"方便双向遍历链表"}],"correct":["A"],"exp":"解析：头结点不存有效数据，作用是统一空表和非空表的处理，简化插入删除时的边界判断。","kp":["链表"]},{"id":"q334","ch":2,"type":"choice","text":"以下说法错误的是（ ）。","opts":[{"k":"A","t":"求表长、定位这两种运算在采用顺序存储结构时实现的效率不比采用链式存储结构时实现的效率低"},{"k":"B","t":"顺序存储的线性表可以随机存取"},{"k":"C","t":"由于顺序存储要求连续的存储区域，所以在存储管理上不够灵活"},{"k":"D","t":"线性表的链式存储结构优于顺序存储结构"}],"correct":["D"],"exp":"解析：链式存储和顺序存储各有优缺点，不存在\"链式一定优于顺序\"的说法。A、B、C 的描述都正确。","kp":["线性表"]},{"id":"q335","ch":1,"type":"choice","text":"下列哪一个不能抽象成线性表（ ）。","opts":[{"k":"A","t":"超市购物清单"},{"k":"B","t":"电话簿联系人列表"},{"k":"C","t":"一棵二叉树的结点"},{"k":"D","t":"学生成绩顺序列表"}],"correct":["C"],"exp":"解析：二叉树的结点之间是一对多的层次关系，属于非线性结构；其余三项都可以排成线性序列。","kp":["二叉树遍历"]},{"id":"q336","ch":2,"type":"choice","text":"下面哪一个属于加工型操作（会修改线性表）（ ）。","opts":[{"k":"A","t":"ListLength(L)"},{"k":"B","t":"GetElem(L,i,&e)"},{"k":"C","t":"ListInsert(&L,i,e)"},{"k":"D","t":"ListEmpty(L)"}],"correct":["C"],"exp":"解析：ListInsert 会改变表的结构和长度，属于加工型操作；ListLength、GetElem、ListEmpty 都只读不写，属于引用型操作。","kp":["线性表"]},{"id":"q337","ch":2,"type":"choice","text":"在n个结点的顺序表中，算法的时间复杂度是O(1)的操作是（ ）。","opts":[{"k":"A","t":"访问第i个结点（1≤i≤n）和求第i个结点的直接前驱（2≤i≤n）"},{"k":"B","t":"在第i个结点后插入一个新结点（1≤i≤n）"},{"k":"C","t":"删除第i个结点（1≤i≤n）"},{"k":"D","t":"将n个结点从小到大排序"}],"correct":["A"],"exp":"解析：顺序表按下标直接定位是 O(1)，已知下标 i 求其前驱也是 O(1)；插入、删除要移动元素是 O(n)，排序至少 O(n²)。","kp":["顺序表","复杂度分析"]},{"id":"q338","ch":2,"type":"choice","text":"向一个有47个元素的顺序表中插入一个新元素并保持原来顺序不变，平均要移动的元素个数为（ ）。","opts":[{"k":"A","t":"8"},{"k":"B","t":"23.5"},{"k":"C","t":"23"},{"k":"D","t":"7"}],"correct":["B"],"exp":"解析：在长度为 n 的顺序表中插入，等概率下有 n+1 个可插入位置，平均移动 n/2 个元素。n=47 时 47/2 = 23.5。\n## 二、填空题（10 题）","kp":["顺序表"]},{"id":"q339","ch":2,"type":"fill","text":"使用链表存储一元多项式时，每个结点需要存储________和________，还有指向下一个结点的指针。","blank":2,"parts":null,"answer":"① 系数；② 指数\n\n解析：一元多项式每一项由系数和指数确定，链表结点需存系数、指数和 next 指针。","kp":["链表"]},{"id":"q340","ch":4,"type":"fill","text":"`ListDelete(&L,i,&e)`操作会删除线性表中第i个元素，并用参数________返回被删除的数据元素。","blank":1,"parts":null,"answer":"e\n\n解析：参数 e 用引用方式传入，函数把被删除元素的值写回 e，调用者即可取得它。","kp":["线性表"]},{"id":"q341","ch":4,"type":"fill","text":"操作ListInsert(&L,i,e)，在线性表第i个元素之前插入元素e，插入成功后线性表表长会________。","blank":1,"parts":null,"answer":"增加1\n\n解析：插入一个元素后表长加 1；相应地，删除一个元素后表长减 1。","kp":["线性表"]},{"id":"q342","ch":2,"type":"fill","text":"当线性表的元素总数基本稳定，且很少进行插入和删除操作，但要求以最快的速度存取线性表中的元素时，应采用_______存储结构。","blank":1,"parts":null,"answer":"顺序\n\n解析：元素总数稳定、很少插入删除、又要求最快存取，正是顺序表（随机存取 O(1)）的适用场景。","kp":["顺序表"]},{"id":"q343","ch":2,"type":"fill","text":"线性表L=（a1,a2,…,an）用数组表示，假定删除表中任一元素的概率相同，则删除一个元素平均需要移动元素的个数是________。","blank":1,"parts":null,"answer":"(n-1)/2\n\n解析：删除第 i 个元素要移动 n-i 个元素，i 取 1~n 等概率，平均移动 (n-1)/2 个。","kp":["线性表"]},{"id":"q344","ch":2,"type":"fill","text":"对于双向链表,在两个结点之间插入一个新结点需修改的指针共 ______个，单链表为_______个。","blank":2,"parts":null,"answer":"① 4；② 2\n\n解析：双向链表在 p、q 之间插入新结点，要改 4 个指针；单链表插入只需改 2 个指针。","kp":["双向链表"]},{"id":"q345","ch":2,"type":"fill","text":"对于一个具有n个结点的单链表，在已知的结点*p后插入一个新结点的时间复杂度为________，在给定值为x的结点后插入一个新结点的时间复杂度为________。","blank":2,"parts":null,"answer":"① O(1)；② O(n)\n\n解析：已知结点 *p 时插入只需改指针，O(1)；只给值 x 时要先从头查找该结点，O(n)。","kp":["链表","复杂度分析"]},{"id":"q346","ch":4,"type":"fill","text":"已知指针p指向单链表L中的某结点,则删除其后继结点的语句是(实现时p指针指向的后继节点，用u指针指向)：________、________和________。","blank":3,"parts":null,"answer":"① u = p->next;；② p->next = u->next;；③ free(u);\n\n解析：三步：让 u 指向 p 的后继；把 p 的 next 跨过 u；释放 u。你写的三条语句内容正确，判 0 分是平台对空格、分号等格式的严格比对造成的。","kp":["链表"]},{"id":"q347","ch":1,"type":"fill","text":"顺序存储结构是通过________表示元素之间的关系的;链式存储结构是通过________表示元素之间的关系的。","blank":2,"parts":null,"answer":"① 元素的存储位置；② 指针\n\n解析：顺序存储靠\"物理位置相邻\"体现逻辑相邻；链式存储靠结点中的指针体现逻辑关系。你的答案正确，被判错属于格式问题。","kp":["基本概念"]},{"id":"q348","ch":2,"type":"fill","text":"有序表合并过程中，当其中一个表处理完毕后，需要把另一个表________全部插入到 LC 中。","blank":1,"parts":null,"answer":"剩余元素\n\n解析：归并两个有序表时，一个表先扫完，把另一个表的剩余部分整段接到 LC 末尾即可。\n\n## 三、判断题（10 题）","kp":["其他"]},{"id":"q349","ch":1,"type":"choice","text":"集合与线性表的区别在于是否按关键字排序。（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：集合与线性表的区别在于元素之间是否存在次序（一对一关系），与是否按关键字排序无关。","kp":["线性表"]},{"id":"q350","ch":2,"type":"choice","text":"线性表的特点是每个元素都有一个前驱和一个后继。（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：第一个元素没有前驱、最后一个元素没有后继，并非每个元素都有前驱和后继。","kp":["线性表"]},{"id":"q351","ch":2,"type":"choice","text":"链表表示一元多项式更适合稠密多项式（大部分系数非零）（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：链表适合稀疏多项式（大量系数为 0）；稠密多项式用顺序存储更省空间、更快。","kp":["链表"]},{"id":"q352","ch":4,"type":"choice","text":"InitList(&L)初始条件要求线性表 L 必须已经存在（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：InitList 的初始条件是\"线性表 L 不存在\"，操作结果是构造一个空表。","kp":["线性表"]},{"id":"q353","ch":4,"type":"choice","text":"顺序存储结构的主要缺点是不利于插入或删除操作（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：顺序存储插入删除要移动大量元素，这正是它的主要缺点。","kp":["基本概念"]},{"id":"q354","ch":4,"type":"choice","text":"顺序存储方式的优点是存储密度大，且插入、删除运算效率高（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：\"存储密度大\"对，\"插入删除效率高\"错--那是链式存储的优点。","kp":["基本概念"]},{"id":"q355","ch":1,"type":"choice","text":"取线性表的第i个元素的时间同i的大小有关（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：顺序表随机存取，取第 i 个元素的时间与 i 无关，都是 O(1)。","kp":["顺序表"]},{"id":"q356","ch":1,"type":"choice","text":"线性表只能用顺序存储结构实现（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：线性表既可用顺序存储，也可用链式存储。","kp":["线性表"]},{"id":"q357","ch":4,"type":"choice","text":"链表中的头结点仅起到标识的作用（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：头结点不只是标识，更重要的是统一空表与非空表的操作、简化边界处理。","kp":["链表"]},{"id":"q358","ch":4,"type":"choice","text":"为了很方便的插入和删除数据，可以使用双向链表存放数据（ ）。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：双向链表每个结点有前驱和后继指针，插入删除时定位前后结点都方便。\n---\n# 第三章作业\n- 截止时间：2026-10-25 23:59　题量：20 题\n## 一、单选题（7 题）","kp":["双向链表"]},{"id":"q359","ch":3,"type":"choice","text":"若让元素1，2，3，4，5依次进栈，则出栈次序不可能出现在（ ）种情况。","opts":[{"k":"A","t":"5，4，3，2，1"},{"k":"B","t":"2，1，5，4，3"},{"k":"C","t":"4，3，1，2，5"},{"k":"D","t":"2，3，5，4，1"}],"correct":["C"],"exp":"解析：4,3,1,2,5 不可能：要弹出 4，必须先压入 1、2、3、4；弹出 4、3 后栈中剩 1、2（2 在上），下一个只能是 2，不可能是 1。","kp":["栈"]},{"id":"q360","ch":4,"type":"choice","text":"已知一个栈的入栈序列是1，2，3，…，n，其输出序列为p1，p2，p3，…，pn，若p1=n，则pi表示为（ ）。","opts":[{"k":"A","t":"i"},{"k":"B","t":"n-i+1"},{"k":"C","t":"n-i"},{"k":"D","t":"不确定"}],"correct":["B"],"exp":"解析：p1=n 说明 n 最先出栈，即 1..n 全部入栈后再依次弹出，输出序列是 n,n-1,…,1，所以 pi = n-i+1。","kp":["栈"]},{"id":"q361","ch":3,"type":"choice","text":"在括号匹配算法中，读到右括号的时候，下面说法正确的是（ ）。","opts":[{"k":"A","t":"直接将右括号入栈"},{"k":"B","t":"若栈为空，说明出现多余右括号，匹配失败"},{"k":"C","t":"将右括号出栈"},{"k":"D","t":"直接跳过，不做任何处理"}],"correct":["B"],"exp":"解析：读到右括号应弹出栈顶左括号与之匹配；若此时栈空，说明右括号多余，匹配失败。","kp":["栈"]},{"id":"q362","ch":3,"type":"choice","text":"若一个栈以向量V[1..n]存储，初始栈顶指针top设为n+1，则元素x进栈的正确操作是( )。","opts":[{"k":"A","t":"top++; V[top]=x;"},{"k":"B","t":"V[top]=x; top++;"},{"k":"C","t":"top--; V[top]=x;"},{"k":"D","t":"V[top]=x; top--;"}],"correct":["C"],"exp":"解析：top 初值为 n+1，表示栈顶在 V[n] 的上方（栈向下增长）。进栈要先 `top--` 让 top 指向空位，再 `V[top]=x`。你选的 B 是\"向上增长\"的写法，与本题 top 的初值不符。","kp":["栈"]},{"id":"q363","ch":3,"type":"choice","text":"以下哪种场景最适合使用栈来实现？（ ）","opts":[{"k":"A","t":"打印机的任务队列（按提交顺序打印）"},{"k":"B","t":"实现撤销（Undo）功能（按操作逆序回退）"},{"k":"C","t":"广度优先搜索遍历树结构"},{"k":"D","t":"多线程任务调度（公平分配资源）"}],"correct":["B"],"exp":"解析：撤销（Undo）要按操作逆序回退，正是栈\"后进先出\"的典型应用；打印机队列、广度优先搜索用的是队列。","kp":["队列"]},{"id":"q364","ch":3,"type":"choice","text":"栈在 （ ）中有所应用。","opts":[{"k":"A","t":"递归调用"},{"k":"B","t":"函数调用"},{"k":"C","t":"表达式求值"},{"k":"D","t":"前三个选项都有"}],"correct":["D"],"exp":"解析：递归调用、函数调用、表达式求值都要用栈保存返回地址或中间结果，三者都是栈的应用。","kp":["栈"]},{"id":"q365","ch":4,"type":"choice","text":"已知最大容量为n的循环队列，队尾用rear表示，队头用front表示，则队空的条件是 （ ）。","opts":[{"k":"A","t":"(rear+1) MOD n==front"},{"k":"B","t":"rear==front"},{"k":"C","t":"rear+1==front"},{"k":"D","t":"(rear-1) MOD n==front"}],"correct":["B"],"exp":"解析：循环队列中 front==rear 表示队空；(rear+1)%n==front 表示队满（牺牲一个单元）。\n## 二、填空题（5 题）","kp":["循环队列"]},{"id":"q366","ch":4,"type":"fill","text":"表达式A+((B*C-M)/N+D*E/F)+I/J的后缀表达式是_______。","blank":1,"parts":null,"answer":"A B C * M - N / D E * F / + + I J / +\n\n解析：设 X=(B*C-M)/N，Y=D*E/F，则原式为 A+(X+Y)+I/J。X 的后缀：B C * M - N /；Y 的后缀：D E * F /；X+Y → … +；A+(X+Y) → A … + +；再加 I/J → … I J / +。","kp":["栈"]},{"id":"q367","ch":3,"type":"fill","text":"栈是_______的线性表，其运算遵循_______的原则。","blank":2,"parts":null,"answer":"① 操作受限；② 后进先出\n\n解析：栈是只允许在栈顶插入和删除的线性表，因此是操作受限的线性表，遵循后进先出（LIFO）。","kp":["栈"]},{"id":"q368","ch":4,"type":"fill","text":"链栈没有容量限制，链栈为空的条件是________。（栈用S表示）","blank":1,"parts":null,"answer":"S.top == NULL\n\n解析：链栈不设头结点时，栈空就是栈顶指针为空。你写的 `S.top == NULL` 语义正确，被判 0 分可能是平台要求 `S->top==NULL` 或不允许空格。","kp":["栈"]},{"id":"q369","ch":4,"type":"fill","text":"栈的两种存储实现分别是________和________。","blank":2,"parts":null,"answer":"① 顺序栈；② 链栈\n\n解析：栈的两种存储实现：用数组实现的顺序栈、用链表实现的链栈。","kp":["栈"]},{"id":"q370","ch":4,"type":"fill","text":"顺序栈入栈时，先存入元素，再将栈顶指针 top________；出栈时先将 top________，再取出元素。","blank":2,"parts":null,"answer":"① 加1（上移）；② 减1（下移）\n\n解析：栈顶指针 top 指向当前栈顶元素时：进栈先把 top 加 1 再存元素（若 top 指向栈顶下一空位，则顺序相反）；出栈先把 top 减 1 再取元素。本题按\"top 指向栈顶元素\"理解，答案为加 1 / 减 1。你写\"上移/下移\"意思正确，被判错是表述与标准答案不一致。\n\n## 三、判断题（8 题）","kp":["栈"]},{"id":"q371","ch":4,"type":"choice","text":"链栈入栈操作在链表表尾进行，时间复杂度 O(n)。( )","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：链栈的插入删除都在表头进行，是 O(1)，不是 O(n)。","kp":["栈","复杂度分析"]},{"id":"q372","ch":4,"type":"choice","text":"顺序栈的入栈、出栈操作时间复杂度都是 O(1)。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：顺序栈的入栈、出栈都只改栈顶指针，不涉及元素移动，均为 O(1)。","kp":["栈","复杂度分析"]},{"id":"q373","ch":4,"type":"choice","text":"栈是一种操作受限的线性表，插入和删除操作只能在栈底进行。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：栈的插入和删除都在栈顶进行，不是栈底。","kp":["栈"]},{"id":"q374","ch":4,"type":"choice","text":"队列属于非线性结构。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：队列是操作受限的线性结构（先进先出），不是非线性结构。","kp":["队列"]},{"id":"q375","ch":4,"type":"choice","text":"即使对不含相同元素的同一输入序列进行两组不同的合法的入栈和出栈组合操作,所得的输出序列也一定相同。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：同一输入序列、不同的合法入出栈组合，得到的输出序列一般不同（如 1,2,3 可得 123、132、213、231、321）。","kp":["栈"]},{"id":"q376","ch":3,"type":"choice","text":"表达式求值、括号匹配、数值转换都是栈的典型应用。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：表达式求值（算符栈）、括号匹配、数制转换都是栈的经典应用。","kp":["栈"]},{"id":"q377","ch":4,"type":"choice","text":"队列是一种插入与删除操作分别在表的两端进行的线性表，是一种先进后出型结构。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["B"],"exp":"解析：队列是先进先出（FIFO），不是先进后出。","kp":["队列"]},{"id":"q378","ch":4,"type":"choice","text":"循环队列牺牲一个存储单元，用来区分队空和队满两种状态。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"correct":["A"],"exp":"解析：为区分队空（front==rear）和队满，循环队列通常牺牲一个存储单元，用 (rear+1)%n==front 表示队满。\n---\n# 附录　错题清单\n| 作业 | 题号 | 题型 | 你的答案 | 正确答案 | 考点 |\n|---|---|---|---|---|---|\n| 第一章作业 | 第6题 | 填空题 | 第一空：(n-2)(n+3)/2 | (n-2)(n+3)/2 | 计算机执行下面的语句时,语句s的执行次数为 ____。 for(i= |\n| 第一章作业 | 第8题 | 填空题 | 第一空：表示 | 表示 | 一个数据结构在计算机中的____称为存储结构。 |\n| 第一章作业 | 第9题 | 填空题 | 第一空：数据元素，第二空：数据元素之间的关系 | ① 数据元素；② 数据元素之间的关系 | 数据的物理结构包括____的表示、____的表示。 |\n| 第二章作业 | 第9题 | 单选题 | B | B | 静态链表中指针表示的是（ ）。 |\n| 第二章作业 | 第23题 | 填空题 | 第一空：u=p->next;，第二空：p-> | ① u = p->next;；② p->next = | 已知指针p指向单链表L中的某结点,则删除其后继结点的语句是(实现时p |\n| 第二章作业 | 第24题 | 填空题 | 第一空：元素的存储位置，第二空：指针 | ① 元素的存储位置；② 指针 | 顺序存储结构是通过________表示元素之间的关系的;链式存储结构 |\n| 第三章作业 | 第4题 | 单选题 | B | C | 若一个栈以向量V[1..n]存储，初始栈顶指针top设为n+1，则元 |\n| 第三章作业 | 第10题 | 填空题 | 第一空：S.top == NULL | S.top == NULL | 链栈没有容量限制，链栈为空的条件是________。（栈用S表示） |\n| 第三章作业 | 第12题 | 填空题 | 第一空：上移，第二空：下移 | ① 加1（上移）；② 减1（下移） | 顺序栈入栈时，先存入元素，再将栈顶指针 top________；出栈 |\n共 9 道题被判错，其中：\n- 真正需要订正思路的：第三章第 4 题（栈顶指针从 n+1 开始时，进栈要 `top--` 再存值）；\n- 答案正确但被判 0 分（平台按字符串严格比对）：第一章第 6、8、9 题，第二章第 23、24 题，第三章第 10、12 题；\n- 疑似平台答案键有误：第二章第 9 题（静态链表的\"指针\"就是数组下标，选 B 应正确）。\n---\n# 附录 B　知识点速查\n## B.1 基本概念（第一章）\n- 数据：所有能输入计算机并被处理的符号集合；数据元素是数据的基本单位；数据项是不可再分的最小单位。\n- 逻辑结构：元素之间的逻辑关系（集合、线性、树、图），与存储无关。\n- 存储结构（物理结构）：逻辑结构在计算机中的表示，包括数据元素的表示和元素之间关系的表示。\n- 四种基本存储方式：顺序存储（地址连续，可随机存取）、链式存储（指针连接，插入删除方便）、索引存储、散列存储。\n- 算法的五个特性：有穷性、确定性、可行性、输入（0 个或多个）、输出（1 个或多个）。\n- 时间复杂度只保留最高阶项、去掉系数。常见阶：O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ)。\n数循环次数的套路：先写出每层循环的执行次数，再求和，最后取数量级。\n```c\nfor (i = 1; i < n - 1; i++) /* n-2 轮 */\nfor (j = n; j >= i; j--) /* n-i+1 次 */\ns;\n/* 合计 n+(n-1)+…+3 = (n-2)(n+3)/2 = O(n²) */\n```\n## B.2 线性表（第二章）\n| 比较项 | 顺序表 | 链表 |\n|---|---|---|\n| 存储方式 | 连续空间，逻辑相邻即物理相邻 | 结点分散，指针连接 |\n| 随机存取 | 支持，O(1) | 不支持，O(n) |\n| 插入删除 | O(n)，平均移动 n/2 个元素 | 已知位置时 O(1) |\n| 存储密度 | 高（只有数据） | 较低（多一个指针域） |\n| 适用场景 | 表长稳定、查询多 | 频繁插入删除、长度多变 |\n必背的指针操作：\n```c\n/* 单链表：在 p 之后插入 s */\ns->next = p->next; p->next = s;\n/* 单链表：删除 p 的后继 u */\nu = p->next; p->next = u->next; free(u);\n/* 双向链表：删除 p */\np->next->prior = p->prior; p->prior->next = p->next; free(p);\n```\n- 顺序表插入：平均移动 n/2 个元素；删除：平均移动 (n-1)/2 个元素。\n- 头结点的作用：统一空表与非空表的处理，简化插入删除的边界判断。\n- 静态链表：用数组模拟链表，指针域存放的是数组下标（游标）。\n## B.3 栈与队列（第三章）\n| 结构 | 特点 | 典型应用 |\n|---|---|---|\n| 栈 | 后进先出（LIFO），只在栈顶操作 | 递归、函数调用、表达式求值、括号匹配、进制转换、撤销 |\n| 队列 | 先进先出（FIFO），队尾入队、队头出队 | 打印任务、层次遍历、缓冲区、任务调度 |\n顺序栈（top 指向栈顶元素，V[1..n]）：进栈 `top++; V[top]=x;`，出栈 `x=V[top]; top--;`。\n若 top 初值为 n+1（栈向下生长），进栈则是 `top--; V[top]=x;`。先看清 top 的初值和含义再套公式。\n循环队列（牺牲一个单元）：队空 `front==rear`，队满 `(rear+1)%n==front`，\n元素个数 `(rear-front+n)%n`。\n出栈序列的合法性：若出栈序列中某元素之后出现了比它小的元素，这些较小元素必须按从大到小的顺序出现，\n否则不可能。例如 4,3,1,2,5 中 4 之后出现 1 又出现 2，而 2 比 1 大，故不合法。\n中缀转后缀：遇到操作数直接输出；遇到运算符，弹出栈中优先级不低于它的运算符后再入栈；\n遇到左括号入栈，遇到右括号弹出到左括号为止。","kp":["二叉树遍历","复杂度分析"]},{"id":"q401","ch":5,"type":"choice","text":"顺序表的存储密度一般等于 1。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["A"],"exp":"顺序表只存数据元素，不存指针，存储密度为 1。","kp":["顺序表"]},{"id":"q402","ch":5,"type":"choice","text":"链表只要执行插入，时间复杂度就一定是 O(1)。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["B"],"exp":"定位前驱本身可能需要 O(n)，只有已定位结点位置后插入才是 O(1)。","kp":["链表"]},{"id":"q403","ch":5,"type":"choice","text":"空串和只含一个空格的串相等。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["B"],"exp":"空串长度为 0；空格串长度至少为 1，两者不相等。","kp":["串"]},{"id":"q404","ch":5,"type":"choice","text":"链栈的插入和删除通常都在栈顶进行。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["A"],"exp":"链栈把栈顶设在链表首端，入栈出栈都在表头，O(1)。","kp":["栈"]},{"id":"q405","ch":5,"type":"choice","text":"KMP 匹配过程中，主串指针 i 不会因为失配而回溯。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["A"],"exp":"KMP 失配时只把模式串指针 j 移到 next[j]，主串 i 不回退。","kp":["串·KMP"]},{"id":"q406","ch":5,"type":"choice","text":"删除链队列最后一个数据结点后，rear 仍需指回头结点。","opts":[{"k":"A","t":"√ 正确"},{"k":"B","t":"× 错误"}],"correct":["A"],"exp":"释放后若不令 rear=front，空队条件 front==rear 会被破坏。","kp":["队列"]},{"id":"q407","ch":5,"type":"fill","text":"顺序表首元素地址为 100，每个元素占 4 字节，第 6 个元素的地址是多少？（填数字）","blank":1,"parts":["120"],"answer":"120","kp":["顺序表"]},{"id":"q408","ch":5,"type":"fill","text":"长度为 20 的顺序表删除第 5 个元素，需要移动多少个元素？（填数字）","blank":1,"parts":["15"],"answer":"15","kp":["顺序表"]},{"id":"q409","ch":5,"type":"fill","text":"长度为 20 的顺序表在第 5 位之前插入元素，需要移动多少个元素？（填数字）","blank":1,"parts":["16"],"answer":"16","kp":["顺序表"]},{"id":"q410","ch":5,"type":"fill","text":"循环队列容量 M=8，front=5，rear=2，当前队列长度是多少？（填数字）","blank":1,"parts":["5"],"answer":"5","kp":["循环队列"]},{"id":"q411","ch":5,"type":"fill","text":"模式串 ABAABC 的 next 与 nextval 分别是什么？（按 1-based，第一空填 next，第二空填 nextval，逗号隔开）","blank":2,"parts":["0,1,1,2,2,3","0,1,0,2,1,3"],"answer":"next=0,1,1,2,2,3；nextval=0,1,0,2,1,3","kp":["串·KMP"]},{"id":"q412","ch":5,"type":"fill","text":"BF 算法最坏复杂度和 KMP 总复杂度分别是什么？（两空，如 O(nm)）","blank":2,"parts":["O(nm)","O(n+m)"],"answer":"BF: O(nm)；KMP: O(n+m)","kp":["串·KMP"]},{"id":"q413","ch":5,"type":"subj","text":"为什么单链表通常设置头结点？写出两个作用。","answer":"① 统一了首元结点和一般位置的插入删除操作，不需要单独判断是否为表头；② 简化了空表的处理，头指针始终非空；③ 方便合并等需要修改起始位置的算法。","kp":["链表"]},{"id":"q414","ch":5,"type":"subj","text":"写出在双向链表中把结点 s 插入到结点 p 之后的指针修改过程。","answer":"s->next = p->next；s->prior = p；若 p->next 非空，则 p->next->prior = s；最后 p->next = s。先接后继、再接前驱、最后改 p 的 next，避免丢失原后继地址。","kp":["双向链表"]},{"id":"q415","ch":5,"type":"subj","text":"写出链队列删除最后一个数据结点时必须补充的处理。","answer":"释放被删结点后，如果队列变空，必须令 rear = front，使空队列条件 front == rear 恢复；否则下次入队会挂到已释放的结点上。","kp":["队列"]},{"id":"q416","ch":5,"type":"subj","text":"用自己的话说明 KMP 为什么能把最坏复杂度降到 O(n+m)。","answer":"KMP 预先计算模式串自身的相等真前后缀（next），失配时利用已匹配信息只移动 j，主串 i 不回溯，避免了 BF 的反复扫描；预处理 O(m)、匹配 O(n)，总计 O(n+m)。","kp":["串·KMP"]},{"id":"q417","ch":5,"type":"subj","text":"中缀表达式 A+B*(C-D)-E/F 的后缀式是什么？","answer":"A B C D - * + E F / -（减法、除法保持原操作数方向，不交换位置）","kp":["栈"]}];
const KPMETA = [{"n":"基本概念","g":"基本概念"},{"n":"复杂度分析","g":"基本概念"},{"n":"递归","g":"基本概念"},{"n":"线性表","g":"线性表"},{"n":"顺序表","g":"线性表"},{"n":"链表","g":"线性表"},{"n":"双向链表","g":"线性表"},{"n":"循环链表","g":"线性表"},{"n":"静态链表","g":"线性表"},{"n":"数组与矩阵","g":"线性表"},{"n":"广义表","g":"线性表"},{"n":"栈","g":"栈·队列·串"},{"n":"队列","g":"栈·队列·串"},{"n":"循环队列","g":"栈·队列·串"},{"n":"双端队列","g":"栈·队列·串"},{"n":"串","g":"栈·队列·串"},{"n":"串·KMP","g":"栈·队列·串"},{"n":"树","g":"树"},{"n":"二叉树遍历","g":"树"},{"n":"二叉树性质","g":"树"},{"n":"二叉排序树","g":"树"},{"n":"平衡二叉树","g":"树"},{"n":"线索二叉树","g":"树"},{"n":"哈夫曼树","g":"树"},{"n":"堆","g":"树"},{"n":"图","g":"图"},{"n":"最小生成树","g":"图"},{"n":"最短路径","g":"图"},{"n":"拓扑排序","g":"图"},{"n":"关键路径","g":"图"},{"n":"查找","g":"查找"},{"n":"折半查找","g":"查找"},{"n":"哈希表","g":"查找"},{"n":"B树/B+树","g":"查找"},{"n":"排序","g":"排序"},{"n":"插入排序","g":"排序"},{"n":"希尔排序","g":"排序"},{"n":"冒泡排序","g":"排序"},{"n":"快速排序","g":"排序"},{"n":"选择排序","g":"排序"},{"n":"归并排序","g":"排序"},{"n":"基数排序","g":"排序"},{"n":"其他","g":"其他"}];
const LS = 'dsquiz_v2';
let S = JSON.parse(localStorage.getItem(LS) || '{}');
if (!S.status) S.status = {};
if (!S.fav) S.fav = {};
if (!S.exfav) S.exfav = {};
if (!S.kpfav) S.kpfav = {};
let filter = 'all';
let list = [];
let idx = 0;
let answered = false;
let mode = 'normal';
let exam = null;
let timerId = null;

function norm(s){
  return (s||'').toLowerCase()
    .replace(/[（(]/g,'(').replace(/[）)]/g,')')
    .replace(/[，,]/g,',').replace(/[。．.]/g,'.').replace(/[：:]/g,':')
    .replace(/[；;]/g,';').replace(/[“”"']/g,'').replace(/[？?]/g,'?')
    .replace(/\s+/g,'').replace(/[－—–]/g,'-');
}

function buildList(){
  if (mode === 'exam'){ list = exam ? exam.items : []; return; }
  if (filter.indexOf('kp:') === 0){ const k = filter.slice(3); list = QUESTIONS.filter(q => (q.kp||[]).indexOf(k) >= 0); }
  else if (filter === 'wrong') list = QUESTIONS.filter(q => (S.status[q.id]||{}).r === 'bad');
  else if (filter === 'fav') list = QUESTIONS.filter(q => S.fav[q.id]);
  else if (filter === 'exfav') list = QUESTIONS.filter(q => S.exfav[q.id]);
  else if (filter === 'kpfav') list = QUESTIONS.filter(q => (q.kp||[]).some(k => S.kpfav[k]));
  else if (filter === 'all') list = QUESTIONS.slice();
  else list = QUESTIONS.filter(q => q.ch === Number(filter.slice(2)));
  idx = Math.min(idx, Math.max(0, list.length-1));
}

function scopeName(){
  if (filter === 'all') return '全部';
  if (filter === 'wrong') return '错题';
  if (filter === 'fav') return '收藏';
  if (filter === 'kpfav') return '收藏知识点';
  if (filter === 'exfav') return '解析收藏';
  if (filter.indexOf('kp:') === 0) return '知识点「' + filter.slice(3) + '」';
  if (filter === 'ch5') return '资料自测';
  return '第' + filter.slice(2) + '章';
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  if (mode === 'exam'){ tabs.innerHTML = ''; tabs.style.display = 'none'; return; }
  tabs.style.display = '';
  const defs = [['all','全部'],['ch1','第1章 · 绪论'],['ch2','第2章 · 线性表'],['ch3','第3章 · 栈/队列'],['ch4','第4章 · 串'],['ch5','资料自测'],['fav','收藏'],['kpfav','收藏知识点'],['exfav','解析收藏'],['wrong','错题']];
  tabs.innerHTML = defs.map(([k,t]) => {
    const n = k==='all' ? QUESTIONS.length
      : k==='wrong' ? QUESTIONS.filter(q=>(S.status[q.id]||{}).r==='bad').length
      : k==='fav' ? QUESTIONS.filter(q=>S.fav[q.id]).length
      : k==='kpfav' ? QUESTIONS.filter(q=>(q.kp||[]).some(x=>S.kpfav[x])).length
      : k==='exfav' ? QUESTIONS.filter(q=>S.exfav[q.id]).length
      : QUESTIONS.filter(q=>q.ch===Number(k.slice(2))).length;
    return '<button class="tab' + (filter===k?' on':'') + (k==='wrong'?' wrong':'') + '" data-k="'+k+'">'+t+' <span class="n">'+n+'</span></button>';
  }).join('');
  if (filter.indexOf('kp:') === 0){
    tabs.innerHTML += '<button class="tab on" id="kpchip">知识点：' + esc(filter.slice(3)) + ' ✕</button>';
  }
  tabs.querySelectorAll('.tab').forEach(b => b.onclick = () => { filter = b.dataset.k; idx = 0; buildList(); render(); });
  const chip = document.getElementById('kpchip');
  if (chip) chip.onclick = () => { filter = 'all'; idx = 0; buildList(); render(); };
}

function statHTML(){
  const ok = Object.values(S.status).filter(s=>s.r==='ok').length;
  const bad = Object.values(S.status).filter(s=>s.r==='bad').length;
  const fav = Object.keys(S.fav).length;
  return '已做 <b>'+(ok+bad)+'</b>/'+QUESTIONS.length+'　答对 <b style="color:var(--ok)">'+ok+'</b>　答错 <b style="color:var(--bad)">'+bad+'</b>'+(fav?'　收藏 <b style="color:#f59e0b">'+fav+'</b>':'');
}

function render(skipRestore){
  const card = document.getElementById('card');
  document.getElementById('stat').innerHTML = statHTML();
  renderTabs();
  document.getElementById('examBtn').textContent = mode==='exam' ? '交卷' : '模考 30 题';
  const t = document.getElementById('timer');
  t.classList.toggle('hide', mode!=='exam');
  if (mode === 'exam'){
    if (!exam) return;
    if (exam.done) return renderSummary();
    return renderExamQ();
  }
  if (!list.length){
    card.innerHTML = '<div style="color:var(--dim);padding:30px 0;text-align:center">这个分类下还没有题目</div>';
    document.getElementById('pos').textContent = '0 / 0';
    renderSide(null);
    return;
  }
  idx = Math.max(0, Math.min(idx, list.length-1));
  const q = list[idx];
  answered = false;
  const st = S.status[q.id] || {};
  const typeName = q.type==='choice' ? '选择题' : q.type==='fill' ? '填空题' : '综合应用题';
  let body = '';

  if (q.type === 'choice'){
    body = '<div class="opts">' + q.opts.map(o =>
      '<button class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></button>')
      .join('') + '</div>';
  } else if (q.type === 'fill'){
    if (q.parts && q.parts.length){
      body = '<div class="fill">' + q.parts.map((p,i) =>
        '<div class="row"><label>第'+(i+1)+'空</label><input type="text" data-i="'+i+'" autocomplete="off"></div>')
        .join('') + '<div><button class="btn primary" id="submit">提交</button></div></div>';
    } else {
      body = '<div class="fill"><div class="row"><label>答案</label><input type="text" data-i="0" autocomplete="off"></div>' +
             '<div><button class="btn primary" id="submit">提交</button></div></div>';
    }
  } else {
    body = '<div class="fill"><textarea id="subj" placeholder="先自己写一遍，再看参考答案对照"></textarea>' +
           '<div><button class="btn primary" id="reveal">显示参考答案</button></div></div>';
  }

  card.innerHTML = '<div class="meta"><span class="badge">第 '+q.ch+' 章</span><span class="badge">'+typeName+'</span>' +
    '<span class="badge">'+esc(q.id)+'</span>' +
    '<button class="star'+(S.fav[q.id]?' on':'')+'" id="star" title="收藏">'+(S.fav[q.id]?'★':'☆')+'</button></div>' +
    '<div class="q">'+esc(q.text)+'</div>' + body + '<div id="ansbox"></div>';

  document.getElementById('pos').innerHTML = (idx+1)+' / '+list.length;
  document.getElementById('bar').style.width = (100*(idx+1)/list.length)+'%';
  document.getElementById('star').onclick = () => { if (S.fav[q.id]) delete S.fav[q.id]; else S.fav[q.id] = 1; save(); render(); };

  if (q.type === 'choice'){
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b, q));
    if (st.choice && !skipRestore) finishChoice(q, st.choice, true);
  } else if (q.type === 'fill'){
    card.querySelector('#submit').onclick = () => checkFill(q);
    card.querySelectorAll('input[type=text]').forEach(inp => inp.onkeydown = e => { if (e.key==='Enter') checkFill(q); });
    if (st.fill && !skipRestore) checkFill(q, st.fill);
  } else {
    card.querySelector('#reveal').onclick = () => revealSubj(q);
    if (st.r && !skipRestore) revealSubj(q, true);
  }
  if (filter === 'exfav') revealExp(q);
  renderSide(q);
  window.scrollTo({top:0,behavior:'smooth'});
}

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function save(){ localStorage.setItem(LS, JSON.stringify(S)); }

function mark(id, ok){
  const st = S.status[id] || (S.status[id] = {});
  if (ok){
    if (st.wrong){
      st.chain = (st.chain || 0) + 1;
      if (st.chain >= 2){ st.r = 'ok'; st.wrong = false; st.chain = 0; }
      else st.r = 'bad';
    } else { st.r = 'ok'; st.wrong = false; }
  } else { st.wrong = true; st.chain = 0; st.r = 'bad'; }
  save();
  return st;
}

function chainNote(q){
  const st = S.status[q.id] || {};
  if (st.r === 'ok') return '';
  if (st.wrong && st.chain) return '<span class="chipx">错题 · 连对 '+st.chain+'/2</span>';
  return '';
}

function showAns(html){
  document.getElementById('ansbox').innerHTML = '<div class="ans">'+html+'</div>';
}

function expHTML(q){
  const on = !!S.exfav[q.id];
  return '<div class="expline"><span class="extext">' + esc(q.exp || '（这条题在题库里没有更多解析）') + '</span>' +
    '<button class="kfstar exstar' + (on ? ' on' : '') + '" data-f="' + q.id + '" title="收藏这条解析">' + (on ? '★' : '☆') + '</button></div>';
}

function bindEx(q){
  const b = document.querySelector('#ansbox .exstar');
  if (!b) return;
  b.onclick = (e) => {
    e.stopPropagation();
    if (S.exfav[q.id]) delete S.exfav[q.id]; else S.exfav[q.id] = 1;
    save();
    b.classList.toggle('on', !!S.exfav[q.id]);
    b.textContent = S.exfav[q.id] ? '★' : '☆';
    renderTabs();
  };
}

function revealExp(q){
  answered = true;
  const want = q.type === 'choice' ? q.correct.join('、')
    : (q.parts && q.parts.length ? q.parts.join('　|　') : q.answer);
  showAns('<h4>参考答案：' + esc(want) + '</h4>' + (q.type === 'subj' ? '' : expHTML(q))
    + (q.type === 'subj' ? '<div class="expline"><span class="extext">' + esc(q.answer || '') + '</span></div>' : ''));
  bindEx(q);
  if (q.type === 'choice'){
    document.querySelectorAll('.opt').forEach(el => {
      el.disabled = true;
      if (q.correct.indexOf(el.dataset.k) >= 0) el.classList.add('ok');
    });
  }
}

function wireRetry(){
  const box = document.getElementById('ansbox');
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = '重做本题'; b.style.cssText = 'margin-top:10px';
  b.onclick = () => render(true);
  box.querySelector('.ans').appendChild(b);
}

function pick(btn, q){
  if (answered) return;
  finishChoice(q, btn.dataset.k, false);
}

function finishChoice(q, k, restore){
  answered = true;
  const ok = q.correct.indexOf(k) >= 0;
  document.querySelectorAll('.opt').forEach(el => {
    el.disabled = true;
    if (el.dataset.k === k) el.classList.add(ok ? 'ok' : 'bad');
    if (q.correct.indexOf(el.dataset.k) >= 0) el.classList.add('ok');
  });
  if (!restore){
    mark(q.id, ok);
    S.status[q.id].choice = k;
    save();
  }
  showAns('<h4>参考答案：'+q.correct.join('、')+chainNote(q)+'<span class="verdict '+(ok?'ok':'bad')+'">'+(restore ? (ok?'答对过':'答错过') : (ok?'答对了':'答错了'))+'</span></h4>' + expHTML(q));
  bindEx(q);
  if (!ok || (S.status[q.id]||{}).wrong) wireRetry();
  document.getElementById('stat').innerHTML = statHTML();
  renderTabs();
  renderSide(q);
}

function checkFill(q, restoreVals){
  if (answered && !restoreVals) return;
  const inputs = Array.from(document.querySelectorAll('input[type=text]'));
  if (!inputs.length) return;
  const vals = restoreVals ? restoreVals.slice() : inputs.map(i => i.value);
  if (restoreVals) inputs.forEach((inp, i) => { inp.value = vals[i] || ''; });
  let ok, right = 0;
  if (q.parts && q.parts.length){
    q.parts.forEach((p, i) => {
      const good = norm(p) === norm(vals[i]);
      if (good) right++;
      inputs[i].style.borderColor = good ? 'var(--ok)' : 'var(--bad)';
    });
    ok = right === q.parts.length;
  } else {
    ok = norm(q.answer) === norm(vals[0]||'');
    inputs[0].style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
    right = ok ? 1 : 0;
  }
  answered = true;
  if (!restoreVals){
    mark(q.id, ok);
    S.status[q.id].fill = vals;
    save();
  }
  const want = (q.parts && q.parts.length) ? q.parts.join('　|　') : q.answer;
  const total = (q.parts && q.parts.length) ? q.parts.length : 1;
  const detail = ok ? '' : '　<span class="chipx">'+(total>1 ? right+'/'+total+' 空正确' : '不对')+'</span>';
  let appeal = '';
  if (!ok && !restoreVals){
    appeal = ' <button class="btn" id="appeal" style="font-size:12px;padding:3px 9px;margin-left:8px">算我对</button>';
  }
  showAns('<h4>参考答案：'+esc(want)+chainNote(q)+detail+'<span class="verdict '+(ok?'ok':'bad')+'">'+(restoreVals ? (ok?'答对过':'答错过') : (ok?'填对了':'再想想'))+'</span>'+appeal+'</h4>' + expHTML(q));
  bindEx(q);
  if (!ok || (S.status[q.id]||{}).wrong) wireRetry();
  const ap = document.getElementById('appeal');
  if (ap) ap.onclick = () => {
    const st = S.status[q.id] || (S.status[q.id] = {});
    st.r = 'ok'; st.wrong = false; st.chain = 0; save();
    ap.remove();
    document.getElementById('stat').innerHTML = statHTML();
    renderTabs(); renderSide(q);
  };
  document.getElementById('stat').innerHTML = statHTML();
  renderTabs();
  renderSide(q);
}

function revealSubj(q, restore){
  const box = document.getElementById('ansbox');
  if (box.dataset.open) return;
  box.dataset.open = '1';
  box.innerHTML = '<div class="ans"><h4>参考答案'+chainNote(q)+'</h4>' + esc(q.answer) +
    '<div class="expline" style="margin-top:10px"><span class="extext"></span>' +
    '<button class="kfstar exstar' + (S.exfav[q.id] ? ' on' : '') + '" data-f="' + q.id + '" title="收藏这条解析">' + (S.exfav[q.id] ? '★' : '☆') + '</button></div>' +
    '<div style="margin-top:6px;display:flex;gap:10px;align-items:center">' +
    '<button class="btn ok" id="selfOk">我答对了</button><button class="btn bad" id="selfBad">没答对</button>' +
    '<span class="hint">自评一下，会记进进度和错题</span></div></div>';
  bindEx(q);
  document.getElementById('selfOk').onclick = () => { mark(q.id,true); document.getElementById('stat').innerHTML = statHTML(); renderTabs(); renderSide(q); };
  document.getElementById('selfBad').onclick = () => { mark(q.id,false); document.getElementById('stat').innerHTML = statHTML(); renderTabs(); renderSide(q); };
}

function renderSide(q){
  const kps = document.getElementById('kps');
  if (q){
    kps.innerHTML = (q.kp || ['其他']).map(k => '<button class="chip' + (filter === 'kp:' + k ? ' on' : '') + '" data-k="'+esc(k)+'">'+esc(k)+'</button>' +
      '<button class="kfstar' + (S.kpfav[k] ? ' on' : '') + '" data-f="' + esc(k) + '" title="收藏这个知识点">' + (S.kpfav[k] ? '★' : '☆') + '</button>' +
      '<button class="doclink" data-k="' + esc(k) + '" title="看这部分资料">📖</button>').join('');
    kps.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = 'kp:' + b.dataset.k; idx = 0; buildList(); render(); });
    kps.querySelectorAll('.doclink').forEach(b => b.onclick = () => openDocFor(b.dataset.k));
  } else {
    kps.innerHTML = '<span style="color:var(--dim);font-size:13px">—</span>';
  }
  const kfav = Object.keys(S.kpfav);
  if (kfav.length){
    kps.innerHTML += '<div class="kfhead">收藏的知识点</div>' + kfav.map(k =>
      '<button class="chip kfchip' + (filter === 'kp:' + k ? ' on' : '') + '" data-k="' + esc(k) + '">★ ' + esc(k) + '</button>').join('');
    kps.querySelectorAll('.kfchip').forEach(b => b.onclick = () => { filter = 'kp:' + b.dataset.k; idx = 0; buildList(); render(); });
  }

  const map = {};
  const base = (filter.indexOf('kp:') === 0 || filter === 'kpfav') ? QUESTIONS : list;
  base.forEach(x => (x.kp || ['其他']).forEach(k => {
    const m = map[k] || (map[k] = { n: 0, ok: 0 });
    m.n++;
    if ((S.status[x.id]||{}).r === 'ok') m.ok++;
  }));

  const groups = [];
  KPMETA.forEach(meta => {
    let g = groups.filter(x => x.g === meta.g)[0];
    if (!g){ g = { g: meta.g, rows: [] }; groups.push(g); }
    const m = map[meta.n] || { n: 0, ok: 0 };
    g.rows.push({ n: meta.n, total: m.n, ok: m.ok });
  });
  groups.forEach(g => g.rows.sort((a,b) => b.total - a.total));

  document.getElementById('scopetitle').textContent = ((filter.indexOf('kp:') === 0 || filter === 'kpfav') ? '全部' : scopeName()) + ' · 知识点';
  document.getElementById('kpstats').innerHTML = groups.map(g => '<div class="kpg">' + esc(g.g) + '</div>' + g.rows.map(r => {
    const pct = r.total ? Math.round(100 * r.ok / r.total) : 0;
    return '<div class="kprow' + (r.total ? '' : ' zero') + (filter === 'kp:' + r.n ? ' on' : '') + '" data-k="' + esc(r.n) + '">' +
      '<span class="kpname">' + esc(r.n) + '</span>' +
      '<span class="kpbar"><i style="width:' + pct + '%"></i></span><span class="kpnum">' + r.ok + '/' + r.total + '</span>' +
      '<button class="doclink" data-d="' + esc(r.n) + '" title="看资料">📖</button>' +
      '<button class="kfstar' + (S.kpfav[r.n] ? ' on' : '') + '" data-f="' + esc(r.n) + '" title="收藏这个知识点">' + (S.kpfav[r.n] ? '★' : '☆') + '</button></div>';
  }).join('')).join('');
  document.querySelectorAll('.kprow').forEach(r => r.onclick = () => {
    if (r.classList.contains('zero')) return;
    filter = 'kp:' + r.dataset.k; idx = 0; buildList(); render();
  });
  document.querySelectorAll('.kprow .doclink').forEach(b => b.onclick = (e) => { e.stopPropagation(); openDocFor(b.dataset.d); });
  document.querySelectorAll('.kfstar:not(.exstar)').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const k = b.dataset.f;
    if (S.kpfav[k]) delete S.kpfav[k]; else S.kpfav[k] = 1;
    save(); render();
  });
}

/* ---------- 模考 ---------- */
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function startExam(){
  const pool = (filter === 'all' || filter.indexOf('kp:') === 0 || filter === 'fav' || filter === 'wrong')
    ? QUESTIONS.slice() : QUESTIONS.filter(q => q.ch === Number(filter.slice(2)));
  const fresh = pool.filter(q => (S.status[q.id]||{}).r !== 'ok');
  const pickFrom = fresh.length >= 30 ? fresh : pool;
  exam = { items: shuffle(pickFrom).slice(0, Math.min(30, pickFrom.length)), ans: {}, t0: Date.now(), limit: 45*60, done: false };
  mode = 'exam'; idx = 0; list = exam.items;
  document.getElementById('tabs').style.display = 'none';
  document.querySelector('aside').style.display = 'none';
  document.querySelector('main').style.gridTemplateColumns = 'minmax(0,1fr)';
  render();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  tick();
}

function fmt(sec){ sec = Math.max(0, sec|0); const m = Math.floor(sec/60), s = sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

function tick(){
  if (mode !== 'exam' || !exam || exam.done) return;
  const left = exam.limit - Math.floor((Date.now() - exam.t0)/1000);
  const el = document.getElementById('timer');
  if (el) el.textContent = '剩余 ' + fmt(left);
  if (left <= 0) submitExam();
}

function renderExamQ(){
  const card = document.getElementById('card');
  idx = Math.max(0, Math.min(idx, exam.items.length-1));
  const q = exam.items[idx];
  const a = exam.ans[q.id];
  let body = '';
  if (q.type === 'choice'){
    body = '<div class="opts">' + q.opts.map(o =>
      '<button class="opt' + (a===o.k?' sel':'') + '" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></button>').join('') + '</div>';
  } else if (q.type === 'fill'){
    const vals = a || [];
    const n = (q.parts && q.parts.length) ? q.parts.length : 1;
    body = '<div class="fill">' + Array.from({length:n}, (_, i) =>
      '<div class="row"><label>'+(n>1?'第'+(i+1)+'空':'答案')+'</label><input type="text" data-i="'+i+'" autocomplete="off" value="'+esc(vals[i]||'')+'"></div>').join('') + '</div>';
  } else {
    body = '<div class="fill"><textarea id="subj" placeholder="写下你的答案，交卷后可对照参考答案">'+esc(a||'')+'</textarea></div>';
  }
  card.innerHTML = '<div class="meta"><span class="badge">模考</span><span class="badge">第 '+q.ch+' 章</span>' +
    '<span class="badge">'+(q.type==='choice'?'选择题':q.type==='fill'?'填空题':'综合应用题')+'</span>' +
    '<span class="badge">'+esc(q.id)+'</span></div><div class="q">'+esc(q.text)+'</div>' + body;

  document.getElementById('pos').innerHTML = '已答 ' + Object.keys(exam.ans).length + ' / ' + exam.items.length + '　第 ' + (idx+1) + ' 题';
  document.getElementById('bar').style.width = (100*(idx+1)/exam.items.length)+'%';

  if (q.type === 'choice'){
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => { exam.ans[q.id] = b.dataset.k; renderExamQ(); });
  } else if (q.type === 'fill'){
    card.querySelectorAll('input[type=text]').forEach(inp => inp.oninput = () => {
      const arr = exam.ans[q.id] || [];
      arr[Number(inp.dataset.i)] = inp.value;
      exam.ans[q.id] = arr;
      document.getElementById('pos').innerHTML = '已答 ' + Object.keys(exam.ans).length + ' / ' + exam.items.length + '　第 ' + (idx+1) + ' 题';
    });
  } else {
    const ta = card.querySelector('#subj');
    if (ta) ta.oninput = () => { exam.ans[q.id] = ta.value; document.getElementById('pos').innerHTML = '已答 ' + Object.keys(exam.ans).length + ' / ' + exam.items.length + '　第 ' + (idx+1) + ' 题'; };
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function submitExam(){
  if (!exam || exam.done) return;
  const open = exam.items.length - Object.keys(exam.ans).length;
  if (open > 0 && Date.now() - exam.t0 < exam.limit*1000){
    if (!confirm('还有 ' + open + ' 题没作答，确定交卷？')) return;
  }
  exam.done = true;
  if (timerId){ clearInterval(timerId); timerId = null; }
  let score = 0, total = 0; const wrongs = []; const oks = {};
  exam.items.forEach(q => {
    const a = exam.ans[q.id];
    if (q.type === 'choice'){
      total++;
      const ok = a && q.correct.indexOf(a) >= 0;
      if (ok){ score++; oks[q.id] = 1; } else wrongs.push(q);
    } else if (q.type === 'fill'){
      total++;
      const n = (q.parts && q.parts.length) ? q.parts.length : 1;
      let ok = true;
      for (let i = 0; i < n; i++){
        const want = (q.parts && q.parts.length) ? q.parts[i] : q.answer;
        if (norm(want) !== norm((a||[])[i])) { ok = false; break; }
      }
      if (ok){ score++; oks[q.id] = 1; } else wrongs.push(q);
    }
  });
  exam.score = score; exam.total = total; exam.wrongs = wrongs; exam.oks = oks;
  exam.used = Math.floor((Date.now() - exam.t0)/1000);
  render();
}

function renderSummary(){
  const card = document.getElementById('card');
  const pct = exam.total ? Math.round(100*exam.score/exam.total) : 0;
  const unanswered = exam.items.filter(q => !(q.id in exam.ans)).length;
  card.innerHTML = '<div class="summary"><h2>模考结束</h2>' +
    '<div><span class="score">' + exam.score + '</span><span style="color:var(--dim)"> / ' + exam.total + ' 客观题　正确率 ' + pct + '%</span></div>' +
    '<div style="color:var(--dim);margin-top:8px">用时 ' + fmt(exam.used) + '　未作答 ' + unanswered + ' 题（简答题不计分，需自评）</div>' +
    (exam.wrongs.length ? '<ul class="wronglist">' + exam.wrongs.map(q => '<li>· '+esc(q.id)+'　'+esc(q.text.slice(0,42)) + (q.type==='choice' ? '（正确答案 '+q.correct.join('、')+'）' : '') + '</li>').join('') + '</ul>'
      : '<div style="color:var(--ok);margin-top:10px">客观题全对，厉害。</div>') +
    '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn primary" id="again">再考一次</button><button class="btn" id="back">退出模考</button></div></div>';
  document.getElementById('pos').textContent = '';
  document.getElementById('bar').style.width = '100%';
  document.getElementById('timer').classList.add('hide');
  document.getElementById('examBtn').textContent = '退出模考';
  document.getElementById('prev').disabled = true;
  document.getElementById('next').disabled = true;
  document.getElementById('again').onclick = () => { exitExam(); startExam(); };
  document.getElementById('back').onclick = exitExam;
  renderSide(null);
}

function exitExam(){
  if (timerId){ clearInterval(timerId); timerId = null; }
  mode = 'normal'; exam = null;
  document.getElementById('tabs').style.display = '';
  document.querySelector('aside').style.display = '';
  document.querySelector('main').style.gridTemplateColumns = '';
  document.getElementById('timer').classList.add('hide');
  document.getElementById('prev').disabled = false;
  document.getElementById('next').disabled = false;
  filter = 'all'; idx = 0; buildList(); render();
}

/* ---------- 导航 ---------- */
function next(){ if (idx < list.length-1){ idx++; render(); } }
function prev(){ if (idx > 0){ idx--; render(); } }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('examBtn').onclick = () => { if (mode === 'exam'){ (exam && exam.done) ? exitExam() : submitExam(); } else startExam(); };
document.getElementById('reset').onclick = () => { if (confirm('清空所有答题记录、收藏？')){ S = {status:{}, fav:{}, kpfav:{}}; save(); buildList(); render(); } };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (mode === 'normal' && /^[a-dA-D]$/.test(e.key)){
    const b = document.querySelector('.opt[data-k="'+e.key.toUpperCase()+'"]');
    if (b) b.click();
  }
});

window.addEventListener('hashchange', () => {
  const m = (location.hash||'').match(/#(q\d+)/);
  if (!m || mode === 'exam') return;
  const i = QUESTIONS.findIndex(x => x.id === m[1]);
  if (i >= 0){ filter = 'all'; list = QUESTIONS.slice(); idx = i; render(); }
});

buildList();
(function(){
  try {
    const sp = new URLSearchParams(location.search);
    const kp = sp.get('kp');
    if (kp){ filter = 'kp:' + kp; buildList(); }
  } catch (e) {}
})();
(function(){
  const m = (location.hash||'').match(/#(q\d+)/);
  if (m){
    const i = QUESTIONS.findIndex(x => x.id === m[1]);
    if (i >= 0){ filter = 'all'; list = QUESTIONS.slice(); idx = i; }
  }
})();
(function(){
  try {
    if (new URLSearchParams(location.search).get('exam') === '1'){ startExam(); return; }
  } catch (e) {}
  render();
})();

const DOCS = [{"id": "res", "title": "期中复习资料 · 第 1–4 章（讲义融合版）", "secs": [{"id": "intro", "no": "", "title": "开篇 · 使用说明", "level": 1, "body": [{"t": "p", "s": "数据结构 · 期中综合 · 知识点 + 代码\n第 1—4 章综合复习资料\n知识梳理 · DeepTutor 学习闭环 · 诊断训练 · 完整 C 代码"}, {"t": "tbl", "s": "考试范围 | 资料依据 | 时间 | 使用方式\n第 1—4 章 | 课堂录音 + 第 1—3 章讲义 + 教材 | 下周期中考试 | 知识 → 代码 → 诊断 → 回炉"}, {"t": "p", "s": "先看结论\n本次考试最容易失分的是：链表指针修改顺序、循环队列空满公式、中缀表达式转后缀、BF 回溯计算和 KMP 的 next/nextval 手算。第 5 章树结构不在本次复习范围内。\n这份资料把定义、操作和题型放在同一条复习线上。每个公式都给出适用条件，每段核心代码都只保留考试最常考、最需要手写的部分。代码按 C 语言风格书写，局部类型名可按课程教材替换。\n复习导航"}, {"t": "tbl", "s": "章节 | 核心内容 | 最可能的题型\n第 1 章 | 逻辑结构、存储结构、算法特性、复杂度 | 选择、判断、复杂度分析\n第 2 章 | 顺序表、单链表、双链表、循环链表、应用 | 指针改图、代码、复杂度\n第 3 章 | 栈、队列、递归、表达式转换与求值 | 过程模拟、空满条件、计算\n第 4 章 | 串操作、存储结构、BF、KMP | 子串边界、next、nextval、算法"}, {"t": "p", "s": "录音覆盖说明\n课堂录音从第 2 章中后段开始，第一章未完整收入。因此第 1 章按数据结构课程的常规范围补齐；第 2—4 章重点与课堂反复强调的内容一致。具体符号和教材术语以任课教师课件为准。\n本次整合补充\n本版在课堂录音整理稿的基础上，又吸收《数据结构与算法 C 语言版第 1 至 3 章复习讲义》的 ADT 三元组、算法评价标准、线性表操作分类、顺序栈 base/top 口径、递归工作栈、汉诺塔、二进制输出及课件典型题。第 4 章继续保留串、数组、BF/KMP 与压缩存储强化；两版冲突处统一按“题目约定优先”说明。\n讲义融合说明  新增内容重点解决“同一个概念，课件写法与常见教材写法不同”的问题。顺序栈、循环队列等地方会同时说明两种指针约定；考试作答时先识别题目采用哪一种，再套对应公式。\nDeepTutor 四维学习闭环\n本版在原有知识点上增加四层学习支持：先用知识路径确定先学什么，再用“双循环”拆解难题，随后通过分层诊断定位薄弱点，最后用跨章研究总结把零散公式连接成完整判断框架。"}, {"t": "img", "s": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABwgAAAPoCAIAAABF+j1AAAEAAElEQVR4nOzdBXhT5xoH8JOk7u5CDWrUKAVKcXd3GTJswNiYwJiPKXdMGAwYA4YOdy0UKaXUqLtQd/fG75OeLqSxpm2K5f979tybnJycnKbNR/LP970vpZnOIgAAAAAAAAAAAAAUCfVlnwAAAAAAAAAAAADAi4ZgFAAAAAAAAAAAABQOglEAAAAAAAAAAABQOAhGAQAAAAAAAAAAQOEgGAUAAAAAAAAAAACFg2AUAAAAAAAAAAAAFA6CUQAAAAAAAAAAAFA4CEYBAAAAAAAAAABA4SAYBQAAAAAAAAAAAIWDYBQAAAAAAAAAAAAUDoJRAAAAAAAAAAAAUDgIRgEAAAAAAAAAAEDhIBgFAAAAAAAAAAAAhYNgFAAAAAAAAAAAABQOglEAAAAAAAAAAABQOAhGAQAAAAAAAAAAQOEgGAUAAAAAAAAAAACFg2AUAAAAAAAAAAAAFA6CUQAAAAAAAAAAAFA4CEYBAAAAAAAAAABA4SAYBQAAAAAAAAAAAIWDYBQAAAAAAAAAAAAUDoJRAAAAAAAAAAAAUDgIRgEAAAAAAAAAAEDhIBgFAAAAAAAAAAAAhYNgFAAAAAAAAAAAABQOglEAAAAAAAAAAABQOAhGAQAAAAAAAAAAQOEgGAUAAAAAAAAAAACFg2AUAAAAAAAA
